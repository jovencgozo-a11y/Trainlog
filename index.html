/* Nocturne — design-system tokens and component classes. This file is the source of truth for the system's look; retune it here and see readme.md. */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

:root {
  --color-bg: #161826;
  --color-surface: #232532;
  --color-text: #e9e9ed;
  --color-accent: #9184d9; /* review round 7 (Barron): the accent moves to
     the product's blurple — OKLCH hue 289.2, the hue of the app's own Pro
     accent (#9a8fe0, --om-accent-pro) — at the same lightness the steel
     accent held (L 0.660, so the documented ratios survive) and chroma
     in the product blurple's own range (its token sits at C 0.118; the
     accent takes 0.125, from the old steel's 0.030):
     the accent now reads as an accent rather than another neutral. */
  --color-accent-2: #a7a1db; /* the machine-derived stand-in follows: same
     hue, same L 0.734, chroma at the same 2:3 proportion it held */
  --color-divider: color-mix(in srgb, #e9e9ed 16%, transparent);

  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the
     same step of any role matches the others in visual value. */
  --color-neutral-100: #f3f5fe;
  --color-neutral-200: #e4e7f5;
  --color-neutral-300: #cfd3e5;
  --color-neutral-400: #b2b6ca;
  --color-neutral-500: #9397ab;
  --color-neutral-600: #75798c;
  --color-neutral-700: #595d6c;
  --color-neutral-800: #3f424d;
  --color-neutral-900: #292b31;

  --color-accent-100: #f5f4ff;
  --color-accent-200: #e7e5fe;
  --color-accent-300: #d2cefd;
  --color-accent-400: #b5abfc;
  --color-accent-500: #968ae0;
  --color-accent-600: #796cbf;
  --color-accent-700: #5d5294;
  --color-accent-800: #423a6a;
  --color-accent-900: #2b2741;

  --color-accent-2-100: #f5f4ff;
  --color-accent-2-200: #e7e5fe;
  --color-accent-2-300: #d2cefd;
  --color-accent-2-400: #b5afe8;
  --color-accent-2-500: #9690c9;
  --color-accent-2-600: #7972a9;
  --color-accent-2-700: #5c5783;
  --color-accent-2-800: #423e5d;
  --color-accent-2-900: #2b293a;

  /* Deck section-divider ground — review round 3: saturation as presence.
     Dividers take a saturated deep indigo (hue 277, the neutral ramp's own
     family; C 0.094 — written when the accent held C 0.030, before the
     round-7 blurple raised it past the ground's) with a lighter bloom and
     a ghost tint of the same hue, while the slide grounds stay
     desaturated. Deck-scale fills only — not interface colors. */
  --color-section: #262a60;
  --color-section-glow: #353b80;
  --color-section-ghost: #4c5397;

  --font-heading: "Inter", system-ui, sans-serif;
  --font-heading-weight: 500;
  --font-body: "Inter", system-ui, sans-serif;

  --space-1: 2.8px;
  --space-2: 5.6px;
  --space-3: 8.4px;
  --space-4: 11.2px;
  --space-6: 16.8px;
  --space-8: 22.4px;

  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 14px;

  /* Elevation — derived from the ground: soft ink-tinted shadows on a
     light theme, a hairline edge + ambient darkness on a dark one. */
  --shadow-sm: 0 0 0 1px #3f424d;
  --shadow-md: 0 0 0 1px #595d6c, 0 6px 18px rgba(0,0,0,0.55);
  --shadow-lg: 0 0 0 1px #9397ab, 0 16px 40px rgba(0,0,0,0.65);
}

body {
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-body);
}
h1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }

.lighten{mix-blend-mode:lighten;background-color:transparent}

/* ══════════════════════════════════════════════════════════════════════════
   Components — built with the tokens above. Plain CSS
   on plain HTML: no JavaScript, no build step. Each class is documented in
   readme.md and demonstrated in foundations/ and components/.
   ══════════════════════════════════════════════════════════════════════ */

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }
h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);
}
h1 { font-size: 42px; }
h2 { font-size: 32px; }
h3 { font-size: 25px; }
h4 { font-size: 20px; }
h5 { font-size: 16px; }
h6 { font-size: 13px; }
h6 { letter-spacing: 0.08em; text-transform: uppercase; }
p { margin: 0 0 var(--space-3); }
a { color: var(--color-accent); text-underline-offset: 3px; }
img { display: block; max-width: 100%; }
figure { margin: 0; }
figcaption {
  font-size: 11px; margin-top: var(--space-1);
  color: color-mix(in srgb, var(--color-text) 55%, transparent);
}
.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }

/* — rules — */
/* Rules fade to transparent at both ends instead of stopping cleanly — a
   Nocturne signature. The ramp is 48px an end (one deck baseline unit),
   painted from the same divider token. Freestanding rules fade; box
   outlines, in-control separators, and short accent marks stay solid. */
.hr {
  height: 1px; border: 0; margin: var(--space-4) 0;
  background: linear-gradient(to right,
    transparent, var(--color-divider) 48px,
    var(--color-divider) calc(100% - 48px), transparent);
}

/* — buttons — */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  cursor: pointer; text-decoration: none;
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —
     the pair sits side by side in sign-up rows */
  background: transparent; border: 1px solid transparent;
  padding: var(--space-2) calc(var(--space-3) * 1.2);
  border-radius: var(--radius-md);
}
.btn svg { display: block; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { color: var(--color-accent); border-color: var(--color-accent); }
.btn-primary:hover { background: color-mix(in srgb, var(--color-accent) 12%, transparent); }
.btn-primary:active { background: color-mix(in srgb, var(--color-accent) 22%, transparent); }
.btn-secondary { border-color: var(--color-divider); }
.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }
.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }
.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }
.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }
.btn-icon { width: 36px; height: 36px; padding: 0; }
.btn-block { width: 100%; margin-top: var(--space-2); }

/* — forms — */
.field > label {
  display: block; font-size: 12px; margin-bottom: 5px;
  color: color-mix(in srgb, var(--color-text) 70%, transparent);
}
.input {
  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;
  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);
  background: var(--color-surface);
  border: 1px solid var(--color-divider); border-radius: var(--radius-md);
}
.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }
.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }
textarea.input { min-height: 90px; resize: vertical; }
.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }
.radio input, .seg-opt input {
  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;
}
.radio .dot {
  width: 16px; height: 16px; flex: none; border-radius: 50%;
  border: 1.5px solid var(--color-divider);
}
.radio:hover .dot { border-color: var(--color-accent); }
.radio input:checked + .dot {
  border-color: var(--color-accent); background: var(--color-accent);
  box-shadow: inset 0 0 0 4px var(--color-bg);
}
.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }
.seg {
  display: inline-flex; overflow: hidden;
  border: 1px solid var(--color-divider); border-radius: var(--radius-md);
}
.seg-opt {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 12px; font-size: 13px; cursor: pointer;
}
.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }
.seg-opt:has(input:checked) { color: var(--color-accent); box-shadow: inset 0 0 0 1px var(--color-accent); }
.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }

/* — cards — */
.card {
  display: flex; flex-direction: column; gap: var(--space-2);
  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);
}
.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }
.card-title {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 17px; line-height: 1.2;
}
.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }
.card-meta {
  display: flex; align-items: center; gap: 6px; font-size: 11px;
  color: color-mix(in srgb, var(--color-text) 50%, transparent);
}
.elev-sm { box-shadow: var(--shadow-sm); }
.elev-md { box-shadow: var(--shadow-md); }
.elev-lg { box-shadow: var(--shadow-lg); }

/* — tags — */
.tag {
  display: inline-flex; align-items: center; font-size: 11px;
  letter-spacing: 0.02em; padding: 3px 10px;
  border-radius: calc(var(--radius-md) * 0.75);
}
.tag-accent { background: var(--color-accent-800); color: var(--color-accent-100); }
.tag-accent-2 { background: var(--color-accent-2-800); color: var(--color-accent-2-100); }
.tag-neutral { background: var(--color-neutral-800); color: var(--color-neutral-100); }
.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }

/* — navigation — */
.nav {
  display: flex; align-items: center; gap: var(--space-4);
  padding: var(--space-3) var(--space-4);
  border-bottom: none;
}
.nav-brand {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 18px; margin-right: auto;
}
.nav a { color: inherit; text-decoration: none; font-size: 14px; }
.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }

/* — tables — */
.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table th {
  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  color: color-mix(in srgb, var(--color-text) 60%, transparent);
  padding: var(--space-2); border-bottom: 1px solid transparent; /* keeps layout; the row paints the fading rule */
}
.table td {
  padding: var(--space-2);
  border-bottom: 1px solid transparent;
}
/* Row rules as row-level strips so the end-fade spans the row, not each cell. */
.table thead tr {
  background: linear-gradient(to right,
    transparent, var(--color-divider) 48px,
    var(--color-divider) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px;
}
.table tbody tr {
  background: linear-gradient(to right,
    transparent, color-mix(in srgb, var(--color-text) 8%, transparent) 48px,
    color-mix(in srgb, var(--color-text) 8%, transparent) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px;
}
.table tbody tr:hover {
  /* the hover tint layers over the row rule, which keeps painting */
  background:
    linear-gradient(color-mix(in srgb, var(--color-text) 4%, transparent),
                    color-mix(in srgb, var(--color-text) 4%, transparent)) no-repeat 0 0 / 100% 100%,
    linear-gradient(to right,
      transparent, color-mix(in srgb, var(--color-text) 8%, transparent) 48px,
      color-mix(in srgb, var(--color-text) 8%, transparent) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px;
}

/* — dialog — */
.dialog-backdrop {
  position: fixed; inset: 0; display: grid; place-items: center;
  padding: var(--space-4);
  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);
}
.dialog {
  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);
  padding: var(--space-4); border-radius: var(--radius-lg);
  background: var(--color-surface); box-shadow: var(--shadow-lg);
}
.dialog-title {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 20px;
}
.dialog-body { font-size: 14px; opacity: 0.85; }
.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }


</style>

<style>
  /* Muscle highlighting reads as red — the anatomical convention, and it keeps the
     body map distinct from the accent that marks interactive things everywhere else. */
  :root{
    --muscle-lit:#d4453f;
    /* ── EDITORIAL TYPE ──
       Documented exception to Nocturne's Inter-over-Inter pairing. Headings take a condensed
       grotesque so the display sizes can be genuinely large without eating the column, and
       so big numerals read like a scoreboard rather than a form field. Falls back to Inter
       if the webfont never arrives. */
    --font-display:"Barlow Condensed","Inter",system-ui,sans-serif;

    /* One scale, used everywhere. The old sheet jumped 32px → 13px with nothing between,
       which is why nothing had a middle rank and every screen flattened into one tier. */
    --t-display:56px;   /* the one number or word a screen is about */
    --t-title:34px;     /* page title */
    --t-section:19px;   /* a section within a page */
    --t-lead:15px;      /* opening sentence, hero body */
    --t-name:15px;      /* a row's subject */
    --t-body:13.5px;    /* ordinary prose */
    --t-meta:12px;      /* supporting detail */
    --t-micro:10.5px;   /* the tracked-out label */

    /* Air lives BETWEEN sections, not inside them. Blocks stay tight; the gutters open up.
       That is what makes a dense app read as editorial rather than merely padded. */
    --gap-section:26px;
    --gap-block:15px;
  }
  html,body{margin:0;padding:0;background:var(--color-bg);color:var(--color-text);
    font-family:var(--font-body);-webkit-font-smoothing:antialiased}
  *{-webkit-tap-highlight-color:transparent}
  body{overscroll-behavior-y:none}
  .app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

  /* header */
  .top{display:flex;align-items:center;justify-content:space-between;
    padding:calc(12px + env(safe-area-inset-top)) 20px 4px}
  .brand{font-family:var(--font-display);font-weight:600;font-size:12.5px;letter-spacing:.22em;
    text-transform:uppercase;color:color-mix(in srgb,var(--color-text) 42%,transparent)}
  .brand span{color:color-mix(in srgb,var(--color-accent) 70%,transparent)}
  .brand span{color:var(--color-accent)}
  .today-date{display:flex;align-items:center;gap:5px;font-family:var(--font-display);font-weight:600;
    font-size:12px;letter-spacing:.1em;text-transform:uppercase}
  .tm-dim{color:color-mix(in srgb,var(--color-text) 34%,transparent)}
  .tm-strong{color:color-mix(in srgb,var(--color-text) 74%,transparent)}
  .tm-dot{width:7px;height:7px;border-radius:50%;display:block;
    box-shadow:0 0 9px -1px currentColor}

  .scroll{flex:1;overflow-y:auto;padding:6px 20px 30px;display:flex;flex-direction:column;
    gap:var(--gap-section)}
  h1.page{font-family:var(--font-display);font-weight:600;font-size:var(--t-title);
    line-height:.98;letter-spacing:-.012em;margin:0;text-wrap:balance}
  .sub{font-size:var(--t-body);line-height:1.55;max-width:40ch;
    color:color-mix(in srgb,var(--color-text) 58%,transparent);margin:7px 0 0}
  /* A sub-line belongs to the heading above it. As a direct child of the column it was
     inheriting the section gap and floating away from the title it describes. */
  .scroll > h1.page + .sub,.scroll > .page + .sub{margin-top:calc(8px - var(--gap-section))}
  /* A heading block and the row of actions that acts on it are one unit. */
  .scroll > div:has(> h1.page) + .brow{margin-top:calc(4px - var(--gap-section))}
  .kicker{font-family:var(--font-display);font-weight:600;font-size:var(--t-micro);
    letter-spacing:.2em;text-transform:uppercase;
    color:color-mix(in srgb,var(--color-text) 45%,transparent)}
  .muted{color:color-mix(in srgb,var(--color-text) 55%,transparent)}
  .dim{color:color-mix(in srgb,var(--color-text) 40%,transparent)}
  .accent{color:var(--color-accent-300)}
  .num{font-variant-numeric:tabular-nums}

  /* Reserved for things that are genuinely card-like. Prose and controls sit on the page. */
  .panel{background:color-mix(in srgb,var(--color-surface) 62%,transparent);
    box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--color-text) 6%,transparent);
    border-radius:var(--radius-lg);padding:17px 18px}
  .panel.flat{background:transparent;box-shadow:none;padding:0}
  /* The one lit object on the screen. It carries the session at display size, so the page
     needs no separate title above it repeating the same word. */
  .hero{border-radius:var(--radius-lg);padding:20px 20px 22px;
    background:radial-gradient(130% 120% at 0% 0%,color-mix(in srgb,var(--color-accent) 20%,transparent) 0%,transparent 62%),
      linear-gradient(150deg,var(--color-section),#1c1e35 70%);
    box-shadow:0 0 0 1px var(--color-accent-800),0 24px 58px -34px var(--color-accent)}
  .hero .kicker{color:color-mix(in srgb,var(--color-accent-200) 78%,transparent)}
  .herotitle{font-family:var(--font-display);font-weight:600;font-size:var(--t-display);
    line-height:.9;letter-spacing:-.018em;margin:12px 0 0;text-wrap:balance}
  /* Three figures, each labelled — the old line ran them together as prose, so none of
     them could be read at a glance. */
  .herostats{display:flex;gap:26px;margin-top:16px}
  .herostats div{display:flex;flex-direction:column;gap:1px}
  .herostats b{font-family:var(--font-display);font-weight:600;font-size:26px;line-height:1;
    letter-spacing:-.01em;color:var(--color-text)}
  .herostats span{font-size:var(--t-micro);letter-spacing:.16em;text-transform:uppercase;
    font-family:var(--font-display);font-weight:500;
    color:color-mix(in srgb,var(--color-text) 42%,transparent)}
  .rowsplit{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  /* Nocturne's rules fade at their ends rather than stopping cleanly. */
  .rule{height:1px;margin:11px 0 2px;background:linear-gradient(to right,
    transparent,color-mix(in srgb,var(--color-text) 11%,transparent) 44px,
    color-mix(in srgb,var(--color-text) 11%,transparent) calc(100% - 44px),transparent)}
  /* A section is a heading over its content with air around it — no container, no border.
     Wrapping every paragraph in a rounded box is what made eight screens look like one. */
  .sect{display:flex;flex-direction:column;gap:var(--gap-block)}
  .sect > h2,.secth{font-family:var(--font-display);font-weight:600;font-size:var(--t-section);
    letter-spacing:-.004em;line-height:1.1;margin:0}
  .secth .kicker{display:block;margin-bottom:4px}
  .listrow{padding:10px 0;box-shadow:inset 0 -1px 0 color-mix(in srgb,var(--color-text) 7%,transparent);
    display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .listrow:last-child{box-shadow:none}
  .name{font-size:var(--t-name);line-height:1.3}
  .tiny{font-size:var(--t-meta);line-height:1.45}
  .lead{font-size:var(--t-lead);line-height:1.5;
    color:color-mix(in srgb,var(--color-text) 72%,transparent)}
  .listrow{padding:13px 0}

  /* buttons */
  button{font-family:var(--font-heading);font-weight:500}
  .b{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:48px;
    border-radius:var(--radius-md);border:1px solid var(--color-neutral-800);background:transparent;
    color:var(--color-text);font-size:14px;cursor:pointer}
  .b:hover{background:color-mix(in srgb,var(--color-accent) 8%,transparent)}
  .b:active{border-color:var(--color-accent-400)}
  .b.pri{border-color:var(--color-accent);background:color-mix(in srgb,var(--color-accent) 13%,transparent);
    color:var(--color-accent-100);min-height:52px;font-size:15px}
  .b.pri:hover{background:color-mix(in srgb,var(--color-accent) 20%,transparent)}
  .b.quiet{color:color-mix(in srgb,var(--color-text) 65%,transparent);min-height:44px;font-size:13px}
  .b.danger{border-color:var(--color-neutral-800);color:var(--color-neutral-400)}
  .b:disabled{opacity:.45;cursor:not-allowed}
  /* Actions size to their label and sit flush left. A full-width block for every secondary
     action gave a tertiary choice the same weight as starting a workout. */
  .brow{display:flex;flex-wrap:wrap;gap:9px}
  .brow .b{flex:0 1 auto;width:auto;min-height:42px;padding:0 18px;font-size:13.5px}
  .brow .b.pri{min-height:46px;padding:0 24px}
  .brow .b.wide,.brow .b:only-child{flex:1 1 100%}
  .icb{border:0;background:transparent;color:color-mix(in srgb,var(--color-text) 45%,transparent);
    font-size:15px;padding:4px 7px;cursor:pointer;border-radius:var(--radius-sm)}
  .icb:hover{color:var(--color-text)}
  .mini{border:0;background:transparent;color:color-mix(in srgb,var(--color-text) 55%,transparent);
    font-size:12.5px;padding:4px 6px;cursor:pointer}
  .mini:hover{color:var(--color-accent-300)}
  .chipwrap{display:flex;flex-wrap:wrap;gap:7px}
  .chip{border:1px solid var(--color-neutral-800);background:transparent;color:var(--color-text);
    border-radius:999px;padding:8px 13px;font-size:13px;cursor:pointer}
  .chip.on{border-color:var(--color-accent);color:var(--color-accent-300);
    background:color-mix(in srgb,var(--color-accent) 12%,transparent)}
  /* Four outlined boxes read as four buttons, all shouting equally — the clunkiest control
     in the app. Tabs are type: the active one is simply brighter, with a mark under it.
     Tap targets stay 44px, and the row scrolls rather than cramping when labels are long. */
  .seg{display:flex;gap:7px}
  .seg:has(> button){gap:22px;overflow-x:auto;scrollbar-width:none;
    box-shadow:inset 0 -1px 0 color-mix(in srgb,var(--color-text) 9%,transparent)}
  .seg::-webkit-scrollbar{display:none}
  .seg > button{flex:0 0 auto;min-height:44px;padding:0 0 9px;border:0;background:transparent;
    font-family:var(--font-display);font-weight:600;font-size:16px;letter-spacing:.004em;
    color:color-mix(in srgb,var(--color-text) 42%,transparent);cursor:pointer;position:relative;
    transition:color .2s ease}
  .seg > button.on{color:var(--color-text)}
  .seg > button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;
    border-radius:2px;background:var(--color-accent);box-shadow:0 0 12px var(--color-accent)}
  /* Where a seg is a real either/or picker rather than navigation, keep it enclosed. */
  .seg.pick:has(> button){gap:7px;box-shadow:none;overflow:visible}
  .seg.pick > button{flex:1;padding:0 12px;min-height:42px;font-size:14px;
    border-radius:var(--radius-md);border:1px solid var(--color-neutral-800)}
  .seg.pick > button.on{border-color:var(--color-accent);color:var(--color-accent-200);
    background:color-mix(in srgb,var(--color-accent) 12%,transparent)}
  .seg.pick > button.on::after{content:none}
  .opt{display:block;width:100%;text-align:left;border:1px solid var(--color-neutral-800);background:transparent;
    color:var(--color-text);border-radius:var(--radius-md);padding:12px 14px;font-size:14.5px;
    margin-bottom:8px;cursor:pointer}
  .opt small{display:block;color:color-mix(in srgb,var(--color-text) 50%,transparent);font-weight:400;
    font-size:12px;margin-top:3px;line-height:1.45}
  .opt.on{border-color:var(--color-accent);color:var(--color-accent-200);
    background:color-mix(in srgb,var(--color-accent) 12%,transparent)}
  .opt.on small{color:var(--color-accent-300)}

  /* inputs */
  input[type=number],input[type=text],textarea{width:100%;background:var(--color-bg);
    border:1px solid var(--color-neutral-800);color:var(--color-text);border-radius:var(--radius-md);
    padding:11px;font-size:16px;font-family:var(--font-body)}
  textarea{height:150px;font-size:12px;line-height:1.5}

  /* stepper */
  .steps{display:flex;gap:10px}
  .step{flex:1;background:var(--color-surface);box-shadow:var(--shadow-sm);border-radius:var(--radius-lg);
    padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px}
  .step .val{width:74px;text-align:center;font-family:var(--font-heading);font-weight:500;
    font-size:30px;line-height:1;font-variant-numeric:tabular-nums;background:transparent;border:0;
    border-bottom:1px dashed color-mix(in srgb,var(--color-text) 22%,transparent);border-radius:0;
    color:var(--color-text);padding:2px 0 4px;-moz-appearance:textfield}
  .step .val::-webkit-outer-spin-button,.step .val::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .step .val:focus{outline:none;border-bottom-color:var(--color-accent);color:var(--color-accent-200)}
  .step .pm{display:flex;align-items:center;gap:8px}
  .step .pm button{width:40px;height:40px;border-radius:10px;border:1px solid var(--color-neutral-800);
    background:transparent;color:var(--color-text);font-size:19px;cursor:pointer}
  .step .pm button:active{border-color:var(--color-accent-400);color:var(--color-accent-300)}

  /* session */
  .sess{position:fixed;inset:0;background:var(--color-bg);z-index:40;display:flex;flex-direction:column}
  /* The overlay is a fixed-height flex column and this is its only child, so without an explicit
     scroller the session content simply overflowed off-screen with no way to reach it. */
  .sessin{max-width:520px;width:100%;margin:0 auto;display:flex;flex-direction:column;
    flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    padding-bottom:calc(28px + env(safe-area-inset-bottom))}
  .sessin > *{flex:none}
  .sesshead{position:sticky;top:0;z-index:2;background:var(--color-bg)}
  .sesshead{flex:none;padding:calc(14px + env(safe-area-inset-top)) 18px 12px;display:flex;
    flex-direction:column;gap:12px}
  .dots{display:flex;gap:4px}
  .dots i{flex:1;height:3px;border-radius:2px;background:var(--color-neutral-800)}
  .dots i.done{background:var(--color-accent-700)}
  .dots i.now{background:var(--color-accent)}
  .setline{display:flex;align-items:center;justify-content:space-between;padding:3px 0}
  .setno{width:20px;height:20px;border-radius:6px;background:var(--color-accent-800);
    color:var(--color-accent-300);font-family:var(--font-heading);font-size:11px;line-height:20px;text-align:center}
  .pr{border-radius:var(--radius-lg);padding:14px 16px;display:flex;align-items:center;gap:12px;
    background:linear-gradient(120deg,var(--color-accent-900),var(--color-accent-800));
    box-shadow:0 0 0 1px var(--color-accent);animation:prin .32s ease-out}
  @keyframes prin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  .vidlink{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;
    color:color-mix(in srgb,var(--color-text) 55%,transparent);font-size:12px;text-decoration:none}

  /* warm-up */
  .wrow{display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;border:0;background:transparent;
    color:var(--color-text);padding:11px 0;cursor:pointer;
    box-shadow:inset 0 -1px 0 color-mix(in srgb,var(--color-text) 7%,transparent)}
  .wrow:last-child{box-shadow:none}
  .wbox{flex:none;width:21px;height:21px;margin-top:1px;border-radius:6px;
    border:1px solid var(--color-neutral-800);display:flex;align-items:center;justify-content:center;
    color:transparent;font-size:12px}
  .wrow.done .wbox{border-color:var(--color-accent);background:color-mix(in srgb,var(--color-accent) 20%,transparent);
    color:var(--color-accent-200)}
  .wrow.done .wname{color:color-mix(in srgb,var(--color-text) 42%,transparent);text-decoration:line-through}
  .wname{font-family:var(--font-heading);font-weight:500;font-size:14.5px}
  .wline{display:flex;align-items:flex-start;gap:4px;
    box-shadow:inset 0 -1px 0 color-mix(in srgb,var(--color-text) 7%,transparent)}
  .wline:last-of-type{box-shadow:none}
  .wline .wrow{flex:1;box-shadow:none}
  .winfo{flex:none;margin-top:9px;border:0;background:transparent;cursor:pointer;padding:4px 2px;
    color:color-mix(in srgb,var(--color-text) 30%,transparent);border-radius:var(--radius-sm);line-height:0}
  .winfo:hover{color:var(--color-accent-300)}

  /* consistency calendar */
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
  .cal .dow{text-align:center;font-size:10px;letter-spacing:.06em;text-transform:uppercase;
    color:color-mix(in srgb,var(--color-text) 35%,transparent);padding-bottom:2px}
  .cell{min-height:74px;border-radius:8px;display:flex;flex-direction:column;align-items:center;border:0;cursor:pointer;
    padding:7px 2px 6px;justify-content:flex-start;gap:3px;background:color-mix(in srgb,var(--color-text) 4%,transparent);
    box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--color-text) 7%,transparent)}
  .cell .dnum{font-size:12px;line-height:1;color:color-mix(in srgb,var(--color-text) 46%,transparent);
    font-variant-numeric:tabular-nums}
  .cell .mk{font-size:14px;line-height:1;color:color-mix(in srgb,var(--color-text) 22%,transparent)}
  .cell .clabel{font-size:8.5px;line-height:1.15;letter-spacing:.01em;text-align:center;margin-top:auto;
    color:color-mix(in srgb,var(--color-text) 44%,transparent);word-break:break-word;padding:0 1px}
  .cell.done .clabel,.cell.planned .clabel{color:var(--color-accent-300)}
  .cell.drop{box-shadow:inset 0 0 0 2px var(--color-accent);
    background:color-mix(in srgb,var(--color-accent) 18%,transparent)}
  .cell[draggable="true"]{cursor:grab}
  .calnav{width:30px;height:30px;border-radius:var(--radius-sm);border:1px solid var(--color-neutral-800);
    background:transparent;cursor:pointer;font-size:16px;line-height:1;font-family:var(--font-body);
    color:color-mix(in srgb,var(--color-text) 55%,transparent)}
  .calnav:hover{border-color:var(--color-accent);color:var(--color-accent-200)}
  .cell.done{background:color-mix(in srgb,var(--color-accent) 20%,transparent);
    box-shadow:inset 0 0 0 1px var(--color-accent)}
  .cell.done .mk{color:var(--color-accent-200)}
  .cell.done .dnum{color:var(--color-accent-300)}
  .cell.run{background:color-mix(in srgb,var(--color-accent) 11%,transparent);
    box-shadow:inset 0 0 0 1px var(--color-accent-700)}
  .cell.run .mk{color:var(--color-accent-400)}
  .cell.missed .mk{color:color-mix(in srgb,var(--color-text) 34%,transparent)}
  .cell.planned{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--color-accent) 32%,transparent)}
  .cell.planned .mk{color:color-mix(in srgb,var(--color-accent) 55%,transparent);font-size:9px}
  .cell.active{background:color-mix(in srgb,var(--color-accent) 8%,transparent);
    box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--color-accent) 45%,transparent)}
  .cell.active .mk{color:var(--color-accent-400)}
  .cell.today{outline:2px solid var(--color-accent);outline-offset:1px}
  .cell.off{background:transparent;box-shadow:none}
  .cell:hover{box-shadow:inset 0 0 0 1px var(--color-accent-400)}
  .legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px}
  .legend span{display:flex;align-items:center;gap:5px;font-size:11px;
    color:color-mix(in srgb,var(--color-text) 50%,transparent)}
  .legend b{font-size:12px;font-weight:400;color:color-mix(in srgb,var(--color-text) 70%,transparent)}

  .rblist{max-height:220px;overflow-y:auto;margin-top:9px}
  #swlist{max-height:46vh}
  .rbhit{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;
    padding:10px 2px;cursor:pointer;border:0;background:transparent;color:var(--color-text);
    font-family:var(--font-body);box-shadow:inset 0 -1px 0 color-mix(in srgb,var(--color-text) 7%,transparent)}
  .rbhit:hover{color:var(--color-accent-100)}
  .rbplus{flex:none;width:26px;height:26px;border-radius:var(--radius-sm);display:flex;align-items:center;
    justify-content:center;font-size:15px;border:1px solid var(--color-neutral-700);
    color:color-mix(in srgb,var(--color-text) 55%,transparent)}
  .rbhit:hover .rbplus{border-color:var(--color-accent);color:var(--color-accent-100)}
  .mobgrid{display:flex;flex-direction:column;gap:8px}
  .mobcard{text-align:left;width:100%;padding:13px 14px;cursor:pointer;
    background:var(--color-surface);box-shadow:var(--shadow-sm);border-radius:var(--radius-lg);
    border:1px solid transparent;color:var(--color-text);font-family:var(--font-body)}
  .mobcard:hover{border-color:var(--color-accent-700)}
  .mobcard.on{border-color:color-mix(in srgb,var(--color-accent) 55%,transparent)}
  .mobstrip{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;margin-top:11px}
  .mobday{height:26px;border-radius:var(--radius-sm);background:color-mix(in srgb,var(--color-text) 7%,transparent)}
  .mobday.on{background:color-mix(in srgb,var(--color-accent) 45%,transparent)}
  .dowpick{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:11px}
  .dowbtn{padding:11px 0;border-radius:var(--radius-md);cursor:pointer;font-size:11.5px;font-family:var(--font-body);
    border:1px solid var(--color-neutral-800);background:transparent;
    color:color-mix(in srgb,var(--color-text) 45%,transparent)}
  .dowbtn:hover{border-color:var(--color-accent-700)}
  .dowbtn.on{border-color:var(--color-accent);color:var(--color-accent-100);
    background:color-mix(in srgb,var(--color-accent) 16%,transparent)}
  .dayrow{display:flex;align-items:center;gap:10px;padding:7px 0}
  .prow{display:flex;align-items:center;gap:12px;padding:10px 0;
    box-shadow:inset 0 -1px 0 color-mix(in srgb,var(--color-text) 7%,transparent)}
  .prow:last-of-type{box-shadow:none}
  .prow .seg{margin:0}
  .prow .seg button{padding:6px 11px;font-size:11.5px;white-space:nowrap}
  .prow .seg button[disabled]{opacity:.35;cursor:not-allowed}
  /* build wizard */
  .steps{display:flex;gap:5px;align-items:center}
  .stepdot{flex:1;height:4px;border:0;padding:0;cursor:pointer;border-radius:2px;
    background:color-mix(in srgb,var(--color-text) 11%,transparent)}
  .stepdot:hover{background:color-mix(in srgb,var(--color-accent) 40%,transparent)}
  .stepdot.past{background:color-mix(in srgb,var(--color-accent) 45%,transparent)}
  .stepdot.on{background:var(--color-accent);height:6px}
  .stepnav{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding-top:4px}
  .stepbtn{min-height:46px;padding:0 18px;border-radius:var(--radius-md);cursor:pointer;
    font-size:13.5px;font-family:var(--font-body);border:1px solid var(--color-neutral-700);
    background:transparent;color:color-mix(in srgb,var(--color-text) 68%,transparent)}
  .stepbtn:hover:not([disabled]){border-color:var(--color-accent);color:var(--color-accent-100)}
  .stepbtn.go{border-color:var(--color-accent);color:var(--color-accent-100);
    background:color-mix(in srgb,var(--color-accent) 12%,transparent)}
  .stepbtn.go:hover:not([disabled]){background:color-mix(in srgb,var(--color-accent) 22%,transparent)}
  .stepbtn[disabled]{opacity:.3;cursor:not-allowed}
  .stepn{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;margin-right:7px;
    border-radius:5px;font-size:9.5px;font-family:var(--font-heading);letter-spacing:0;vertical-align:1px;
    color:var(--color-accent-100);background:color-mix(in srgb,var(--color-accent) 22%,transparent)}
  /* run segments */
  .segs{display:flex;flex-direction:column;gap:2px;margin-top:10px}
  .seg{display:flex;gap:10px;padding:8px 0;
    box-shadow:inset 0 -1px 0 color-mix(in srgb,var(--color-text) 6%,transparent)}
  .seg:last-child{box-shadow:none}
  .segno{flex:none;width:20px;height:20px;border-radius:6px;display:flex;align-items:center;justify-content:center;
    font-size:10px;font-family:var(--font-heading);margin-top:1px;
    color:color-mix(in srgb,var(--color-text) 45%,transparent);
    background:color-mix(in srgb,var(--color-text) 7%,transparent)}
  .segno.work{color:var(--color-accent-100);background:color-mix(in srgb,var(--color-accent) 24%,transparent)}
  .segname{font-family:var(--font-heading);font-weight:500;font-size:13.5px}
  .segbody{min-width:0}

  /* live tracker */
  #track{position:fixed;inset:0;z-index:75;pointer-events:none}
  #track:empty{display:none}
  .trackwrap{position:absolute;inset:0;background:var(--color-bg);pointer-events:auto;overflow-y:auto;
    display:flex;align-items:center;justify-content:center;padding:20px 16px calc(24px + env(safe-area-inset-bottom))}
  .trackin{width:100%;max-width:440px}
  .cdwrap{text-align:center;display:flex;flex-direction:column;align-items:center}
  .cdnum{font-family:var(--font-heading);font-weight:500;font-size:150px;line-height:1;margin:6px 0 2px;
    letter-spacing:-.05em;color:var(--color-accent-100);
    text-shadow:0 0 90px color-mix(in srgb,var(--color-accent) 55%,transparent);
    animation:cdpop .5s cubic-bezier(.2,1.4,.4,1)}
  @keyframes cdpop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.cdnum{animation:none}}
  .bignum{font-family:var(--font-heading);font-weight:500;font-size:74px;line-height:1;margin-top:14px;
    color:var(--color-text);letter-spacing:-.02em}
  .bignum .unit{font-size:20px;margin-left:8px;color:color-mix(in srgb,var(--color-text) 40%,transparent)}
  .trackgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px;
    padding-top:16px;box-shadow:inset 0 1px 0 color-mix(in srgb,var(--color-text) 9%,transparent)}
  .mid{font-family:var(--font-heading);font-weight:500;font-size:24px;line-height:1.1;margin-top:4px}

  /* rest timer */
  #restbar{position:fixed;left:0;right:0;bottom:0;z-index:70;pointer-events:none;
    transform:translateY(100%);transition:transform .22s ease-out}
  #restbar.up{transform:none;pointer-events:auto}
  .restwrap{position:relative;overflow:hidden;max-width:520px;margin:0 auto;
    background:var(--color-surface);box-shadow:0 -1px 0 var(--color-neutral-700),0 -12px 30px rgba(0,0,0,.55);
    padding:12px 16px calc(13px + env(safe-area-inset-bottom))}
  .restfill{position:absolute;left:0;top:0;bottom:0;
    background:color-mix(in srgb,var(--color-accent) 15%,transparent);transition:width .25s linear}
  .restwrap.ready .restfill{width:100% !important;background:color-mix(in srgb,var(--color-accent) 26%,transparent)}
  .restrow{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .resttime{font-family:var(--font-heading);font-weight:500;font-size:25px;line-height:1.05;
    color:var(--color-accent-100)}
  .restbtn{min-height:44px;padding:0 14px;border-radius:var(--radius-md);cursor:pointer;font-size:12.5px;
    font-family:var(--font-body);border:1px solid var(--color-neutral-700);background:transparent;
    color:color-mix(in srgb,var(--color-text) 62%,transparent)}
  .restbtn:hover{border-color:var(--color-accent);color:var(--color-accent-100)}
  .restbtn.go{border-color:var(--color-accent);color:var(--color-accent-100)}
  .restmini{margin-left:auto;border:1px solid var(--color-neutral-700);background:transparent;cursor:pointer;
    min-height:32px;padding:0 11px;border-radius:var(--radius-sm);font-size:11.5px;font-family:var(--font-body);
    color:color-mix(in srgb,var(--color-text) 55%,transparent)}
  .restmini:hover{border-color:var(--color-accent);color:var(--color-accent-200)}
  .exacts{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
  .exact{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 14px;
    border-radius:var(--radius-md);border:1px solid var(--color-neutral-700);background:transparent;
    color:color-mix(in srgb,var(--color-text) 68%,transparent);font-size:12.5px;font-family:var(--font-body);
    cursor:pointer;text-decoration:none;white-space:nowrap}
  .exact:hover{border-color:var(--color-accent);color:var(--color-accent-100)}
  .exact.vid{border-color:var(--color-accent-700);color:var(--color-accent-200);
    background:color-mix(in srgb,var(--color-accent) 11%,transparent)}
  .exact.vid:hover{background:color-mix(in srgb,var(--color-accent) 20%,transparent)}
  .restline{display:flex;align-items:center;gap:7px;margin-top:7px;font-size:12.5px;
    color:color-mix(in srgb,var(--color-text) 58%,transparent)}
  .restline b{color:var(--color-accent-200);font-weight:500}
  .exlink{cursor:pointer;border-radius:var(--radius-sm);margin:-4px -6px;padding:4px 6px}
  .exlink:hover{background:color-mix(in srgb,var(--color-accent) 9%,transparent)}
  .exlink:hover .name{color:var(--color-accent-200)}

  /* kit toggles */
  .kitgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}
  .kit{display:flex;align-items:center;gap:8px;text-align:left;padding:10px 11px;cursor:pointer;
    border:1px solid var(--color-neutral-800);background:transparent;border-radius:var(--radius-md);
    color:color-mix(in srgb,var(--color-text) 55%,transparent);font-size:13px;font-family:var(--font-body)}
  .kit:hover{border-color:var(--color-accent-700)}
  .kit.on{border-color:var(--color-accent);color:var(--color-text);
    background:color-mix(in srgb,var(--color-accent) 10%,transparent)}

  /* ═══ Visual refresh — depth, numerals, glow. Layout, markup and features unchanged. ═══ */

  .hero{background:

  /* ═══ Plan tab: program header + week cards ═══ */

  /* ═══ physical feel ═══ */
  .panel,.daycard,.raild,.mobcard,.b,.chip,.exact{transition:transform .18s cubic-bezier(.2,.8,.25,1),

  /* ═══ muscle map ═══ */

  .sfbtns{display:flex;gap:8px}
  .sfbtns .b{flex:1;margin:0}
  button.chip{font:inherit;cursor:pointer;transition:background .18s ease,color .18s ease,box-shadow .2s ease}

  /* ═══ rank, levels, badges ═══ */

  /* ── tab change (slice 1) ──
     Only go() opens a view transition, so this names the animation for that one case. The
     old view leaves upward and the new one arrives from below, which reads as moving
     between siblings rather than a dissolve. */
  @media (prefers-reduced-motion: no-preference){
    ::view-transition-old(root){ animation: vtOut .18s ease both; }
    ::view-transition-new(root){ animation: vtIn .24s cubic-bezier(.2,.8,.2,1) both; }
  }
  @keyframes vtOut{ to{ opacity:0; transform:translateY(-6px); } }
  @keyframes vtIn{ from{ opacity:0; transform:translateY(8px); } }
  /* The bar is fixed and must not travel with the page underneath it. */
  nav{ view-transition-name: nav; }

  /* ── the moving tab indicator (slice 2) ── */
  .navdot{position:absolute;top:0;left:0;height:2px;width:22px;border-radius:2px;opacity:0;
    background:var(--color-accent);box-shadow:0 0 14px var(--color-accent);
    transition:transform .34s cubic-bezier(.2,.8,.2,1),opacity .2s ease;pointer-events:none}
  nav{position:relative}
  /* The old per-button mark is replaced by the one that slides. */
  nav button.on::before{content:none}

  /* ── press feedback, app-wide (slice 3) ──
     A tap should acknowledge itself before its result arrives. Kept to transform and shadow
     so it composites on the GPU and cannot reflow a list mid-scroll. */
  .b,.chip,.opt,.cell,.mini,.icb,.restbtn,.calnav,.exact{
    transition:transform .13s cubic-bezier(.2,.8,.2,1),background .18s ease,
      border-color .18s ease,box-shadow .2s ease}
  .b:active,.chip:active,.opt:active,.cell:active,.restbtn:active,.exact:active{
    transform:scale(.975)}
  .mini:active,.icb:active{transform:scale(.92)}
  .b.pri:active{transform:scale(.975);
    box-shadow:0 0 30px -14px var(--color-accent)}
  /* Rows are tapped as often as buttons and had no feedback at all. */
  .listrow[onclick]:active,.wrow:active{transform:scale(.99)}
  .listrow[onclick],.wrow{transition:transform .13s cubic-bezier(.2,.8,.2,1)}

  /* ── the rest countdown (slice 5) ── */
  .resttime.tick{animation:restTick .5s cubic-bezier(.2,.8,.2,1)}
  @keyframes restTick{ 0%{transform:scale(1.07);opacity:.85} 100%{transform:scale(1);opacity:1} }
  .restwrap.ready .resttime{animation:none}

  /* ── steady numbers (slice 6) ──
     Live values changed width as they counted — "9s" to "10s", 995 to 1,004 — and every
     change nudged whatever sat beside it. Tabular figures make each digit the same width,
     and a reserved minimum stops the container itself from resizing. */

    text-align:center;will-change:transform}
  .num,.val,.dnum,.sfield,.reps,.bignum,.segno,.celxp,.rankxp,.bcount,.btally{
