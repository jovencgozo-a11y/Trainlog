  }


  /* ── Real 3D. An anatomical mesh with one named object per muscle group;
     the day's groups light, the rest stay matte. The figure is built from primitives in
     buildBody() below — schematic, not a scan. three.js arrives on first open, cached after. ── */
  let threeP = null;
  function loadThree(){
    if(!threeP) threeP = (async()=>{
      const THREE = await import('three');
      return { THREE };
    })().catch(e=>{ threeP = null; throw e; });
    return threeP;
  }
  let loaderP = null;
  function loadGltfLoader(){
    if(!loaderP) loaderP = import('three/addons/loaders/GLTFLoader.js')
      .then(m=>m.GLTFLoader).catch(e=>{ loaderP = null; throw e; });
    return loaderP;
  }
  /* The anatomical scan, when it is installed. muscles.glb is not committed to this
     repository — it is dropped in next to index.html — so the fetch is allowed to fail and
     the schematic figure below stands in. What must never happen again is the app ignoring
     a model that IS there: this path is tried first, every time. */
  let glbP = null, glbAbsent = false;
  function loadGlb(){
    /* A 404 means the scan simply is not installed here — remember that, so opening the body
       map a dozen times does not fire a dozen doomed requests. A network error is different:
       the file may exist and the connection dropped, so that stays retryable. */
    if(glbAbsent) return Promise.reject(new Error('model not installed'));
    if(!glbP) glbP = fetch('./muscles.glb')
      .then(r=>{
        if(!r.ok){ if(r.status === 404) glbAbsent = true; throw new Error('model ' + r.status); }
        return r.arrayBuffer();
      })
      .catch(e=>{ glbP = null; throw e; });
    return glbP;
  }
  /* Which figure the viewer ended up with, so the credit line can be honest about it. */
  let modelSource = null;
  /* ── the figure, built rather than downloaded ──────────────────────────────
     This used to fetch ./muscles.glb, a BodyParts3D scan that was never part of the app —
     so the 3D view failed on every install and quietly fell back to the flat map. A scan
     that is not there cannot be recovered, so the figure is assembled from primitives
     instead: an anatomical mannequin rather than a cadaver, which is what the view is
     actually for. It ships inside the file, needs no network and no asset, and every
     muscle mesh carries the same slug the flat map uses, so highlighting, the group
     chips and the colour-per-group logic all work unchanged.

     Proportions are in metres on a 1.8 m figure, y up, +z forward. */
  function buildBody(THREE){
    const root = new THREE.Group();
    const SEG = 20;
    const ball = new THREE.SphereGeometry(1, SEG, Math.round(SEG * 0.65));

    /* An ellipsoid. Muscles are these, sitting slightly proud of the form beneath. */
    const blob = (name, side, x, y, z, sx, sy, sz)=>{
      const m = new THREE.Mesh(ball, null);
      m.name = name;
      m.position.set(side * x, y, z);
      m.scale.set(sx, sy, sz);
      root.add(m);
    };
    /* A capsule for a limb segment. Rounded ends are what let consecutive segments overlap
       into something that reads as one leg rather than two floating pills. */
    const bone = (side, r, len, x, y, z, tilt)=>{
      const m = new THREE.Mesh(new THREE.CapsuleGeometry(r, len, 4, SEG), null);
      m.name = 'body';
      m.position.set(side * x, y, z || 0);
      if(tilt) m.rotation.z = side * tilt;
      root.add(m);
    };
    const both = (fn)=>{ fn(1); fn(-1); };

    /* ── the form: 1.8 m, eight heads, every segment overlapping the next ── */
    blob('body', 1, 0, 1.715, 0.004, 0.092, 0.112, 0.100);        // head
    bone(1, 0.042, 0.06, 0, 1.585, 0);                            // neck
    blob('body', 1, 0, 1.375, 0, 0.152, 0.135, 0.092);            // ribcage
    blob('body', 1, 0, 1.215, 0, 0.122, 0.105, 0.080);            // waist
    blob('body', 1, 0, 1.045, 0, 0.138, 0.098, 0.090);            // pelvis
    both(sd=>{
      blob('body', sd, 0.148, 1.472, 0, 0.064, 0.062, 0.060);     // shoulder cap
      bone(sd, 0.048, 0.21, 0.178, 1.322, 0, 0.04);               // upper arm
      bone(sd, 0.040, 0.20, 0.196, 1.052, 0);                     // forearm
      blob('body', sd, 0.200, 0.900, 0.006, 0.036, 0.052, 0.026); // hand
      bone(sd, 0.078, 0.31, 0.088, 0.740, 0);                     // thigh
      blob('body', sd, 0.090, 0.512, 0, 0.062, 0.052, 0.062);     // knee
      bone(sd, 0.055, 0.30, 0.092, 0.315, 0);                     // shin
      blob('body', sd, 0.092, 0.118, 0, 0.050, 0.048, 0.050);     // ankle
      blob('body', sd, 0.092, 0.048, 0.048, 0.046, 0.038, 0.108); // foot
    });

    /* ── front ── */
    both(sd=>{
      blob('chest', sd, 0.068, 1.400, 0.070, 0.068, 0.052, 0.045);
      blob('obliques', sd, 0.098, 1.195, 0.040, 0.030, 0.080, 0.042);
      blob('front-deltoids', sd, 0.160, 1.468, 0.034, 0.050, 0.054, 0.046);
      blob('side-deltoids', sd, 0.183, 1.472, 0, 0.038, 0.058, 0.055);
      blob('biceps', sd, 0.178, 1.320, 0.034, 0.036, 0.078, 0.030);
      blob('forearm', sd, 0.198, 1.060, 0.024, 0.032, 0.085, 0.028);
      blob('quadriceps', sd, 0.086, 0.760, 0.050, 0.058, 0.150, 0.036);
      blob('adductor', sd, 0.036, 0.750, 0.006, 0.028, 0.130, 0.046);
    });
    blob('abs', 1, 0, 1.195, 0.072, 0.052, 0.092, 0.035);

    /* ── back ── */
    both(sd=>{
      blob('trapezius', sd, 0.052, 1.500, -0.028, 0.070, 0.058, 0.044);
      blob('upper-back', sd, 0.074, 1.380, -0.070, 0.066, 0.070, 0.034);
      blob('lats', sd, 0.116, 1.270, -0.046, 0.042, 0.100, 0.055);
      blob('lower-back', sd, 0.044, 1.135, -0.066, 0.044, 0.064, 0.032);
      blob('rotator-cuff', sd, 0.152, 1.500, -0.020, 0.036, 0.030, 0.034);
      blob('back-deltoids', sd, 0.160, 1.462, -0.036, 0.048, 0.052, 0.044);
      blob('triceps', sd, 0.180, 1.318, -0.034, 0.038, 0.082, 0.032);
      blob('gluteal', sd, 0.076, 0.955, -0.058, 0.066, 0.064, 0.052);
      blob('hamstring', sd, 0.088, 0.740, -0.048, 0.054, 0.148, 0.036);
      blob('calves', sd, 0.092, 0.375, -0.034, 0.046, 0.082, 0.036);
      blob('soleus', sd, 0.091, 0.230, -0.028, 0.036, 0.062, 0.030);
    });
    return root;
  }

  /* One place builds the scene, used inline on Today and full-screen in the
     viewer. Returns a disposer; the caller MUST call it before mounting again,
     or each repaint leaks a WebGL context (browsers cap at ~16). */
  async function mountModel(stage, lit, opts){
    opts = opts || {};
    let stopped = false, disposed = false;
    let renderer = null, ro = null;
    const dispose = ()=>{
      if(disposed) return; disposed = true; stopped = true;
      try{ if(ro) ro.disconnect(); }catch(e){}
      try{ if(renderer){ renderer.dispose(); renderer.forceContextLoss(); } }catch(e){}
    };
    let THREE, scanBuf = null, GLTFLoader = null;
    try{
      THREE = (await loadThree()).THREE;
    }catch(err){ dispose(); throw err; }
    /* Prefer the real scan wherever it is installed; fall back only when it is not. */
    try{
      scanBuf = await loadGlb();
      GLTFLoader = await loadGltfLoader();
    }catch(e){ scanBuf = null; GLTFLoader = null; }
    if(stopped || !stage.isConnected){ dispose(); return { dispose, setLit:()=>{} }; }

    const css = n => getComputedStyle(document.body).getPropertyValue(n).trim();
    const accent = new THREE.Color(css('--muscle-lit') || '#d4453f');
    /* On a white page an almost-black idle muscle reads as a silhouette rather than a
       body, and an emissive glow has nothing to glow against. The unlit body is a pale
       clay and the trained muscles are solid colour — the contrast is now value and hue
       rather than light. */
    const idle = new THREE.Color('#dfe4e0');

    renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
    renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(38, 1, 0.01, 100);
    scene.add(new THREE.HemisphereLight(0xffffff, 0xd8e2dc, 1.05));
    const key = new THREE.DirectionalLight(0xffffff, 0.85); key.position.set(2, 3, 4); scene.add(key);
    const rim = new THREE.DirectionalLight(0xffffff, 0.35); rim.position.set(-3, 1, -3); scene.add(rim);

    let figure;
    if(scanBuf && GLTFLoader){
      try{
        const gltf = await new Promise((res, rej)=> new GLTFLoader().parse(scanBuf, '', res, rej));
        figure = gltf.scene; modelSource = 'scan';
      }catch(e){ figure = null; }
    }
    if(!figure){ figure = buildBody(THREE); modelSource = 'schematic'; }
    if(stopped || !stage.isConnected){ dispose(); return { dispose, setLit:()=>{} }; }

    const group = new THREE.Group();
    let glow = [];
    const parts = [];                      // every mesh with its slug, for re-lighting in place
    const groupName = o=>{ let n = o; while(n){ if(n.name && SLUG_SET.has(n.name)) return n.name; n = n.parent; } return o.name; };
    /* The scan ships POSITION and COLOR_0 only — no NORMAL attribute — so a lit material has
       no surface data and renders pure black. Compute normals first. */
    figure.traverse(o=>{
      if(!o.isMesh) return;
      if(o.geometry && !o.geometry.getAttribute('normal')) o.geometry.computeVertexNormals();
      o.material = new THREE.MeshStandardMaterial({ roughness:0.95, metalness:0.02 });
      parts.push({ slug:groupName(o), mat:o.material });
    });
    /* Recolour in place. Rebuilding the scene per toggle would re-parse the mesh
       and spend a WebGL context every tap. */
    const hueCache = {};
    const groupColor = slug => {
      const g = SLUG_GROUP[slug], hex = GROUP_HUE[g];
      if(!hex) return accent;
      return hueCache[g] || (hueCache[g] = new THREE.Color(hex));
    };
    const applyLit = set => {
      glow = [];
      parts.forEach(p=>{
        const on = set.has(p.slug);
        const c = on ? groupColor(p.slug) : idle;
        p.mat.color.copy(c);
        p.mat.roughness = on ? 0.5 : 0.92;
        p.mat.emissiveIntensity = 0;                 // no glow on a white ground
        if(on){ p.mat.__base = c.clone(); glow.push(p.mat); }
      });
    };
    applyLit(lit);
    group.add(figure);

    const box = new THREE.Box3().setFromObject(group);
    const size = box.getSize(new THREE.Vector3()), mid = box.getCenter(new THREE.Vector3());
    figure.position.sub(mid);
    const pivot = new THREE.Group(); pivot.add(group); scene.add(pivot);
    let dist = 1, baseDist = 1, userZoom = false;

    stage.innerHTML = '';
    stage.appendChild(renderer.domElement);
    const fit = ()=>{
      const w = stage.clientWidth, ht = stage.clientHeight;
      if(!w || !ht) return;
      renderer.setSize(w, ht, false);
      camera.aspect = w / ht; camera.updateProjectionMatrix();
      const tan = 2 * Math.tan(camera.fov * Math.PI / 360);
      baseDist = Math.max(size.y / tan, size.x / (tan * camera.aspect)) * (opts.pad || 1.08);
      if(!userZoom) dist = baseDist;
    };
    fit();
    ro = new ResizeObserver(fit); ro.observe(stage);

    let ry = opts.turn || 0, rx = 0, px = null, py = 0, spin = opts.spin === undefined ? 0.0022 : opts.spin;
    const el = renderer.domElement;
    el.style.touchAction = opts.inline ? 'pan-y' : 'none';
    el.addEventListener('pointerdown', e=>{ px = e.clientX; py = e.clientY; spin = 0; el.setPointerCapture(e.pointerId); });
    el.addEventListener('pointermove', e=>{
      if(px === null) return;
      ry += (e.clientX - px) * 0.01;
      rx = Math.max(-0.9, Math.min(0.9, rx + (e.clientY - py) * 0.006));
      px = e.clientX; py = e.clientY;
    });
    const up = ()=>{ px = null; };
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
    if(!opts.inline){
      el.addEventListener('wheel', e=>{ e.preventDefault(); userZoom = true;
        dist = Math.max(baseDist * 0.35, Math.min(baseDist * 2.5, dist + e.deltaY * size.y * 0.0012)); }, { passive:false });
      let pinch = null;
      el.addEventListener('touchstart', e=>{ if(e.touches.length === 2){
        pinch = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); } });
      el.addEventListener('touchmove', e=>{ if(pinch && e.touches.length === 2){
        const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        userZoom = true;
        dist = Math.max(baseDist * 0.35, Math.min(baseDist * 2.5, dist * (pinch / d)));
        pinch = d; } }, { passive:true });
      el.addEventListener('touchend', ()=>{ pinch = null; });
    }

    const t0 = performance.now();
    const frame = ()=>{
      if(disposed) return;
      if(!stage.isConnected){ dispose(); return; }   // card repainted out from under us
      ry += spin;
      pivot.rotation.y = ry; pivot.rotation.x = rx;
      camera.position.z = dist;
      const p = 0.94 + 0.06 * Math.sin((performance.now() - t0) / 620);
      glow.forEach(m=>{ if(m.__base) m.color.copy(m.__base).multiplyScalar(p); });
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    };
    frame();
    return { dispose, setLit:applyLit };
  }

  async function open3D(lit, names){
    const ov = document.createElement('div');
    ov.className = 'd3o';
    ov.innerHTML = '<div class="d3head"><div><div class="kicker" style="color:var(--color-accent-300)">Muscles trained</div>' +
        '<div class="d3title">' + (names || []).map(g=>'<span style="color:' + hueOf(g) + '">' +
          ((GROUPS[g] && GROUPS[g].label) || g) + '</span>').join('<span class="dim"> · </span>') + '</div></div>' +
        '<button class="icb d3x" aria-label="Close">✕</button></div>' +
      '<div class="d3stage"><div class="d3load">Loading the model…</div></div>' +
      '<div class="d3foot"><span class="tiny dim">Drag to rotate · pinch or scroll to zoom</span>' +
        '<span class="tiny dim d3credit">\u00a0</span></div>';
    document.body.appendChild(ov);
    document.body.style.overflow = 'hidden';

    let dispose = null, gone = false;
    const close = ()=>{ gone = true;
      document.body.style.overflow = ui.sess ? 'hidden' : '';
      if(dispose) dispose();
      ov.remove();
      document.removeEventListener('keydown', onEsc); };
    const onEsc = e=>{ if(e.key === 'Escape') close(); };
    ov.querySelector('.d3x').onclick = close;
    document.addEventListener('keydown', onEsc);

    const stage = ov.querySelector('.d3stage');
    try{
      const hnd = await mountModel(stage, lit, { pad:1.08 });
      if(gone) hnd.dispose(); else dispose = hnd.dispose;
      /* Credit whatever is actually on screen — the scan when it is installed, and an honest
         note that this is a stand-in when it is not. */
      const cr = ov.querySelector('.d3credit');
      if(cr) cr.textContent = modelSource === 'scan'
        ? 'BodyParts3D, \u00a9 DBCLS, CC BY-SA 2.1 JP'
        : 'Stand-in figure \u2014 add muscles.glb for the anatomical model';
    }catch(err){
      stage.innerHTML = '<div class="d3load">Could not load the 3D model.' +
        '<span class="tiny dim" style="display:block;margin-top:6px">It needs a connection the first time. The flat map still works.</span></div>';
    }
  }

  /* Drag to spin the figure. Not a mesh — the two anatomical faces are set back
     to back in perspective, which is what a turntable of this artwork can be. */
  function wireTurn(card){
    const turn = card.querySelector('.mmturn'), btn = card.querySelector('.mmspin');
    if(!turn) return;
    let back = card.dataset.turned === '1';
    const settle = ()=>{
      card.dataset.turned = back ? '1' : '0';
      turn.classList.add('snap');
      turn.classList.toggle('back', back);
      turn.classList.toggle('showback', back);
      turn.style.transform = '';
      if(btn) btn.textContent = (back ? 'Front' : 'Back') + ' ›';
    };
    if(btn) btn.onclick = ()=>{ back = !back; settle(); };
    let x0 = null, base = 0, moved = false;
    turn.addEventListener('pointerdown', e=>{
      x0 = e.clientX; base = back ? 180 : 0; moved = false;
      turn.classList.remove('snap');
      turn.setPointerCapture(e.pointerId);
    });
    turn.addEventListener('pointermove', e=>{
      if(x0 === null) return;
      const dx = e.clientX - x0;
      if(Math.abs(dx) > 3) moved = true;
      const a = ((base + dx * 0.8) % 360 + 360) % 360;
      turn.style.transform = 'rotateY(' + (base + dx * 0.8) + 'deg)';
      turn.classList.toggle('showback', a > 90 && a < 270);
    });
    const end = e=>{
      if(x0 === null) return;
      const dx = e.clientX - x0;
      x0 = null;
      if(!moved){ back = !back; return settle(); }
      const a = ((base + dx * 0.8) % 360 + 360) % 360;
      back = a > 90 && a < 270;
      settle();
    };
    turn.addEventListener('pointerup', end);
    turn.addEventListener('pointercancel', end);
  }

  /* render() replaces #app wholesale; repaint the map whenever an empty mount appears */
  /* If paintBody throws after clearing the card, the card is empty again — which is
     exactly the condition that triggers this callback, so a throw becomes an infinite
     repaint loop that freezes the thread with nothing in the console. Cap the retries
     and surface the error instead. */
  let kicks = 0;
  const kick = ()=>{ const c = document.getElementById('bodycard');
    if(!c || c.childElementCount) return;
    if(kicks++ > 20){ c.remove(); return; }
    try{ paintBody(); }catch(e){ console.error('muscle map failed:', e); c.remove(); }
  };
  window.addEventListener('trainlog:repaint', ()=>{ kicks = 0; });
  const watch = ()=>{ const app = document.getElementById('app');
    if(!app) return setTimeout(watch, 150);
    new MutationObserver(kick).observe(app, {childList:true, subtree:true});
    kick(); };
  if(document.readyState === 'loading') window.addEventListener('DOMContentLoaded', watch); else watch();

  /* pull to refresh */
  document.addEventListener('pointerdown', e=>{
    const sc = e.target.closest && e.target.closest('.scroll');
    if(!sc || sc.scrollTop > 0) return;
    let start = e.clientY, pulled = 0, ind = null;
    const move = ev=>{
      pulled = ev.clientY - start;
      if(pulled <= 0 || sc.scrollTop > 0) return;
      if(!ind){ ind = document.createElement('div'); ind.id = 'ptr'; sc.prepend(ind); }
      const t = Math.min(64, pulled * 0.5);
      ind.style.height = t + 'px';
      ind.textContent = t > 46 ? 'RELEASE' : 'PULL';
    };
    /* pointercancel matters: a system gesture or an incoming call means pointerup
       never arrives, and without this the listeners would stay attached for good. */
    const up = ()=>{
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', up);
      document.removeEventListener('pointercancel', up);
      if(ind){ const fire = parseFloat(ind.style.height) > 46; ind.remove();
        if(fire){ render(); if(typeof toast === 'function') toast('Up to date'); } }
    };
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', up);
    document.addEventListener('pointercancel', up);
  });

  /* ── drag a session onto another day, from the Today calendar ──
     Moving a workout used to mean opening Plan and finding the schedule sheet. The week is
     already on the Today screen, so the shortest version of the gesture is to pick the session
     up and drop it where it should go. Delegated from the document because render() replaces
     the grid wholesale. Vertical intent is handed straight back to the page so the screen still
     scrolls normally; only a sideways drag along the strip is claimed as a move. */
  document.addEventListener('pointerdown', e=>{
    const cell = e.target.closest && e.target.closest('.calcell[data-lift]');
    if(!cell) return;
    const grid = cell.closest('.calgrid'); if(!grid) return;
    const cells = Array.prototype.slice.call(grid.querySelectorAll('.calcell'));
    const name = cell.getAttribute('data-lift');
    const x0 = e.clientX, y0 = e.clientY;
    let dragging = false, target = null, done = false;

    const clearMarks = ()=> cells.forEach(c=>c.classList.remove('dropinto'));
    const finish = ()=>{
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', up);
      document.removeEventListener('pointercancel', up);
      cell.classList.remove('dragging');
      cell.style.transform = '';
      clearMarks();
      done = true;
    };
    const move = ev=>{
      if(done) return;
      const dx = ev.clientX - x0, dy = ev.clientY - y0;
      if(!dragging){
        if(Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
        /* a mostly-vertical first move is a scroll, not a drag — let go of it entirely */
        if(Math.abs(dy) > Math.abs(dx)){ finish(); return; }
        dragging = true;
        cell.classList.add('dragging');
      }
      cell.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
      /* the dragged cell is translated under the cursor, so it would always win a hit test
         against itself — it is excluded, and the day beneath it is what counts */
      const over = cells.find(c=>{
        if(c === cell) return false;
        const r = c.getBoundingClientRect();
        return ev.clientX >= r.left && ev.clientX <= r.right &&
               ev.clientY >= r.top - 30 && ev.clientY <= r.bottom + 30;
      });
      clearMarks();
      target = over || null;
      if(target) target.classList.add('dropinto');
    };
    const up = ev=>{
      const drop = dragging ? target : null;
      const wasDragging = dragging;
      finish();
      if(ev && ev.type === 'pointercancel') return;
      if(!wasDragging) return;                    // a tap: leave the click alone
      /* the drag consumed the gesture, so the browser's follow-up click must not also
         re-pick the day underneath — same swallow the warm-up swipe uses */
      const swallow = c=>{ c.stopImmediatePropagation(); c.preventDefault(); };
      cell.addEventListener('click', swallow, { once:true, capture:true });
      setTimeout(()=>cell.removeEventListener('click', swallow, true), 350);
      if(!drop) return;
      const dow = +drop.getAttribute('data-dow');
      if(isNaN(dow)) return;
      try{ moveWorkoutToDow(name, dow); }catch(err){ console.error(err); }
    };
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', up);
    document.addEventListener('pointercancel', up);
  });

  /* swipe a warm-up row to tick it off */
  document.addEventListener('pointerdown', e=>{
    const row = e.target.closest && e.target.closest('.wrow');
    if(!row) return;
    let x0 = e.clientX, y0 = e.clientY, dx = 0, swiping = false;
    const move = ev=>{
      dx = ev.clientX - x0;
      if(!swiping && Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(ev.clientY - y0)) swiping = true;
      if(swiping) row.style.transform = 'translateX(' + Math.max(0, Math.min(90, dx)) + 'px)';
    };
    const up = ev=>{
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', up);
      document.removeEventListener('pointercancel', up);
      row.style.transform = '';
      if(ev && ev.type === 'pointercancel') return;    // interrupted, not a completed swipe
      if(!swiping || dx <= 60) return;
      // only the completed swipe synthesises a click, so only it arms the
      // swallower for the browser's own follow-up — and it self-clears
      const swallow = ev=>{ ev.stopImmediatePropagation(); ev.preventDefault(); };
      row.addEventListener('click', swallow, { once:true, capture:true });
      setTimeout(()=>row.removeEventListener('click', swallow, true), 350);
      setTimeout(()=>row.click(), 0);
    };
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', up);
    document.addEventListener('pointercancel', up);
  });
})();
</script>
<script>
if(false && 'serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js').then(reg=>{
      if(reg.update) reg.update().catch(()=>{});
      // If a new worker takes over, reload once so the fresh app is showing.
      let reloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange',()=>{
        if(reloaded) return;
        try{ if(localStorage.getItem('trainlog-data-v3-session')) return; }catch(e){}
        reloaded = true; location.reload();
      });
    }).catch(()=>{});
  });
}
</script>
<script>
(async function(){
  const ready = () => typeof generateProgram === 'function' && typeof state !== 'undefined' && !!state && typeof setup !== 'undefined';
  for(let i=0;i<100 && !ready();i++){ await new Promise(r=>setTimeout(r,50)); }
  await new Promise(r=>setTimeout(r,500));
  if(!ready()) return;
  try{
    if(state.plan && state.plan.length) return;
    Object.assign(setup, {exp:'intermediate', goals:['hypertrophy'], goal:'hypertrophy', splitStyle:'ul', liftDays:4, runDays:0, equip:'gym', injuries:[], weeks:6, startDate:todayISO()});
    try{ persistSetup(); }catch(e){}
    await generateProgram();
    const mk=(dayId,name,w,r,eff,daysAgo)=>{ const d=new Date(); d.setDate(d.getDate()-daysAgo);
      return { id:Date.now()-daysAgo*1e6, date:d.toISOString().slice(0,10), week:1, dayId, dayName:(day(dayId)||{}).name||'', entries:{[name]:[{w,r},{w,r},{w,r}]}, efforts:{[name]:eff}, minutes:52, volume:(w||1)*r*3 }; };
    const sessions=[]; let liftDayId=null,liftName=null;
    for(const d of state.plan){ const ex=(d.exercises||[]).find(e=>{const m=byName[e.name];return m&&loadKindOf(m)!=='bw'&&!isTimedMove(m);}); if(ex){liftDayId=d.id;liftName=ex.name;break;} }
    if(liftName){ const tR=targetRepsAt(liftName,1)||8; sessions.push(mk(liftDayId,liftName,135,tR,'solid',10)); sessions.push(mk(liftDayId,liftName,140,tR,'easy',4)); }
    for(const d of state.plan){ const ex=(d.exercises||[]).find(e=>{const m=byName[e.name];return m&&loadKindOf(m)==='bw'&&!isTimedMove(m)&&nextVariation(e.name);}); if(ex){ const cap=repCeiling(ex.name); sessions.push(mk(d.id,ex.name,0,cap,'easy',8)); sessions.push(mk(d.id,ex.name,0,cap,'easy',3)); break; } }
    state.sessions=sessions; state.readiness=[{date:todayISO(),sleep:4,sore:2,energy:4,stress:2,score:78}]; state.progAck={};
    if(liftDayId) ui.dayId=liftDayId;
    try{ saveNow(); }catch(e){}
    go('today');
  }catch(e){ console.error('preview seed failed', e); }
})();
</script>
