    height:var(--h);background:color-mix(in srgb,var(--cq,var(--color-accent)) 38%,transparent);
    transform-origin:bottom;animation:barup .42s var(--d) cubic-bezier(.16,.9,.3,1.06) both}
  .chart .bars i.best{background:var(--cq,var(--color-accent));
    box-shadow:0 0 14px -3px var(--cq,var(--color-accent))}
  @keyframes barup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  .chartavg{position:absolute;left:0;right:0;height:0;pointer-events:none;
    border-top:1px dashed color-mix(in srgb,var(--color-text) 26%,transparent)}
  .chartavg span{position:absolute;right:0;top:-14px;font-size:9.5px;letter-spacing:.06em;
    font-family:var(--font-display);font-weight:600;
    color:color-mix(in srgb,var(--color-text) 40%,transparent)}
  .chart.empty-ch .bars i{background:color-mix(in srgb,var(--color-text) 9%,transparent);
    height:3px;animation:none}
  @media (prefers-reduced-motion:reduce){ .chart .bars i{animation:none} }
  /* ═══ log feed ═══ */
  .logfeed{display:flex;flex-direction:column;gap:8px}
  .logcard{position:relative;overflow:hidden;padding:14px 15px 13px 18px;
    border-radius:var(--radius-lg);background:color-mix(in srgb,var(--color-surface) 60%,transparent);
    box-shadow:0 0 0 1px color-mix(in srgb,var(--color-text) 7%,transparent)}
  .logcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
    background:linear-gradient(to bottom,var(--rq),color-mix(in srgb,var(--rq) 25%,transparent))}
  .statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:11px}
  .statrow div{display:flex;flex-direction:column;gap:2px}
  .statrow b{font-family:var(--font-display);font-weight:600;font-size:21px;line-height:1;
    letter-spacing:-.01em;color:var(--color-text)}
  .statrow span{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
    font-family:var(--font-display);font-weight:600;
    color:color-mix(in srgb,var(--color-text) 34%,transparent)}
  /* ═══ foldable session cards ═══ */
  .daycard{padding:0}
  .dchead{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;border:0;
    background:transparent;color:inherit;font:inherit;cursor:pointer;padding:15px 15px 14px 18px}
  .dchead:hover{background:color-mix(in srgb,var(--rq) 6%,transparent)}
  .dchead:focus-visible{outline:2px solid var(--rq);outline-offset:-2px;border-radius:var(--radius-lg)}
  .dcmain{flex:1;min-width:0}
  .dcchev{flex:none;font-family:var(--font-display);font-size:20px;line-height:1;margin-top:2px;
    color:color-mix(in srgb,var(--color-text) 32%,transparent);
    transition:transform .28s cubic-bezier(.2,.8,.25,1),color .2s ease}
  .daycard.open .dcchev{transform:rotate(180deg);color:var(--rq)}
  .dcbody{display:grid;grid-template-rows:0fr;
    transition:grid-template-rows .3s cubic-bezier(.2,.8,.25,1)}
  .daycard.open .dcbody{grid-template-rows:1fr}
  .dcinner{overflow:hidden;min-height:0}
  .daycard.open .dcinner{padding:0 15px 4px 18px}
  .daycard.open .dchead{box-shadow:inset 0 -1px 0 color-mix(in srgb,var(--color-text) 8%,transparent)}
  @media (prefers-reduced-motion:reduce){ .dcbody{transition:none} .dcchev{transition:none} }
  /* the workout takes the day's role on its own chrome, controls stay interface violet */
  .sess{--rq:var(--color-accent)}
  .sesswhat{display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.1}
  .sesshead .rolet{color:var(--rq)}
  .sess .dots i.now{background:var(--rq);box-shadow:0 0 12px var(--rq)}
  .sess .restfill{background:var(--rq);box-shadow:0 0 24px color-mix(in srgb,var(--rq) 50%,transparent)}
  /* ═══ empty states ═══ */
  .emptybox{text-align:center;padding:38px 22px 34px;border-radius:var(--radius-lg);
    background:color-mix(in srgb,var(--color-surface) 45%,transparent);
    box-shadow:0 0 0 1px color-mix(in srgb,var(--color-text) 6%,transparent)}
  .ebtitle{font-family:var(--font-display);font-weight:600;font-size:22px;line-height:1.1;
    letter-spacing:-.01em;color:color-mix(in srgb,var(--color-text) 82%,transparent)}
  .ebline{margin:8px auto 0;max-width:30ch;font-size:13px;line-height:1.55;
    color:color-mix(in srgb,var(--color-text) 48%,transparent);text-wrap:pretty}
  /* ══════════════════════════════════════════════════════════════════════════
     LIGHT THEME
     Nocturne's ramps are built outward from a dark ground: step 100 is the
     lightest, 900 the darkest, and every rule in this file reads them that way —
     800 for a border, 100 for bright text. Inverting the ramps rather than
     rewriting two hundred rules keeps that logic intact and simply flips which
     end is which. Delete this block and the app is dark again.
     ══════════════════════════════════════════════════════════════════════════ */
  :root{
    --color-bg:#fbfdfc;
    --color-surface:#ffffff;
    --color-text:#12211b;
    --color-accent:#25a777;
    --color-divider:color-mix(in srgb,#12211b 12%,transparent);

    /* neutrals, inverted: 800 is still "the border step", now a pale one */
    --color-neutral-100:#16241e;
    --color-neutral-200:#243530;
    --color-neutral-300:#3a4b44;
    --color-neutral-400:#55665e;
    --color-neutral-500:#78877f;
    --color-neutral-600:#9aa8a1;
    --color-neutral-700:#c6d2cb;
    --color-neutral-800:#e2ebe6;
    --color-neutral-900:#f1f6f3;

    /* emerald, inverted: 100 is the deepest, so accent text stays legible */
    --color-accent-100:#0c5a41;
    --color-accent-200:#127153;
    --color-accent-300:#178963;
    --color-accent-400:#1e9b72;
    --color-accent-500:#25a777;
    --color-accent-600:#4cbc94;
    --color-accent-700:#88d6b7;
    --color-accent-800:#c0ebdb;
    --color-accent-900:#e5f8ee;
    --color-accent-2:#1f9c8e;
    --color-accent-2-100:#0b5049;
    --color-accent-2-200:#116860;
    --color-accent-2-300:#178077;
    --color-accent-2-400:#1d9289;
    --color-accent-2-500:#249e94;
    --color-accent-2-600:#4bb7ae;
    --color-accent-2-700:#88d3cd;
    --color-accent-2-800:#c0e9e5;
    --color-accent-2-900:#e5f7f5;

    /* one type family throughout */
    --font-heading:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    --font-body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    --font-display:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;

    /* softer corners, and the two-tier shadow the spec builds cards on */
    --radius-sm:10px; --radius-md:12px; --radius-lg:14px;
    --shadow-sm:0 1px 2px rgba(18,33,27,.04), 0 8px 24px rgba(18,33,27,.06);
    --shadow-md:0 1px 2px rgba(18,33,27,.05), 0 18px 40px rgba(21,120,86,.12);
    --shadow-lg:0 1px 2px rgba(18,33,27,.05), 0 28px 60px rgba(21,120,86,.16);

    /* Training qualities, re-mixed for white. The dark-ground set (lime, sky)
       disappeared here, so each is now a deep value that carries as text and as a
       mark, and pale fills are mixed from it rather than being separate tokens. */
    --q-max:#c22a4e;       /* max strength */
    --q-strhyp:#c25a15;    /* strength + size */
    --q-hyp:#6d4bc7;       /* hypertrophy */
    --q-hyphigh:#1273a8;   /* hypertrophy, light */
    --q-end:#10795a;       /* muscular endurance */
    --q-power:#6b8c12;     /* power */
    --q:var(--color-accent);
    --muscle-lit:#c22a4e;
  }
  html,body{background:var(--color-bg);color:var(--color-text)}
  /* the week's quality tints the top of the page rather than glowing out of it */
  body{background:
      radial-gradient(150% 46% at 50% -14%, color-mix(in srgb,var(--q) 9%,transparent) 0%, transparent 62%),
      linear-gradient(180deg,#ffffff 0%,#fbfdfc 42%,#f4f8f6 100%),
      #fbfdfc;
    background-attachment:fixed;transition:background 1.2s ease;
    -webkit-font-smoothing:antialiased}

  /* surfaces are white cards on a tinted ground, lifted by shadow not by border */
  .panel,.logcard,.badge,.emptybox,.mobcard{background:var(--color-surface);
    box-shadow:var(--shadow-sm)}
  .panel:hover,.logcard:hover,.mobcard:hover{box-shadow:var(--shadow-md)}
  .rule{background:linear-gradient(to right,transparent,
    color-mix(in srgb,var(--color-text) 10%,transparent) 40px,
    color-mix(in srgb,var(--color-text) 10%,transparent) calc(100% - 40px),transparent)}

  /* the day's session card: a mint field the quality tints, not a dark slab */
  .hero{background:
      radial-gradient(130% 140% at 0% 0%, color-mix(in srgb,var(--q) 13%,transparent) 0%, transparent 62%),
      linear-gradient(168deg,#ffffff,#f6faf8 74%);
    box-shadow:0 0 0 1px color-mix(in srgb,var(--q) 22%,transparent), var(--shadow-md)}
  .hero .kicker{color:var(--q)}
  .rankcard{background:
      radial-gradient(125% 135% at 0% 0%, color-mix(in srgb,var(--medal) 16%,transparent) 0%, transparent 62%),
      linear-gradient(168deg,#ffffff,#f7faf9 74%);
    box-shadow:0 0 0 1px color-mix(in srgb,var(--medal) 30%,transparent), var(--shadow-md)}
  .rankcard .rankname{color:var(--color-text)}
  .medaldot{box-shadow:0 0 0 3px #fff, 0 0 0 4px color-mix(in srgb,var(--medal) 30%,transparent)}

  /* frosted bars, top and bottom */
  .top{background:rgba(255,255,255,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid var(--color-neutral-800)}
  nav{background:rgba(255,255,255,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:inset 0 1px 0 var(--color-neutral-800)}
  nav button{color:var(--color-neutral-500)}
  nav button.on{color:var(--color-accent-200)}

  /* overlays sit on white too */
  .sess{background:var(--color-bg)}
  .sheet{background:var(--color-surface);
    box-shadow:0 -1px 0 var(--color-neutral-800),0 -16px 40px rgba(18,33,27,.14)}
  .ov{background:rgba(18,33,27,.32)}
  .toast{background:#16241e;color:#f1f6f3;box-shadow:var(--shadow-lg)}
  .celo{background:radial-gradient(90% 60% at 50% 34%,color-mix(in srgb,var(--q) 12%,transparent) 0%,transparent 70%),
    rgba(251,253,252,.96)}
  .d3o{background:radial-gradient(90% 55% at 50% 26%,color-mix(in srgb,var(--q) 8%,transparent) 0%,transparent 70%),
    var(--color-bg)}

  /* the flat body map, on white */
  .mm{fill:#dfe6e2;stroke:#fff;stroke-width:.5}
  .mm.on{fill:var(--lit,var(--muscle-lit));filter:none}

  /* charts and marks read as ink, not as light */
  .chart .bars i.best{box-shadow:none}
  .wkdash.on i{box-shadow:none}
  .lvlbar i{box-shadow:none}
  .b.pri{box-shadow:0 8px 20px -8px color-mix(in srgb,var(--color-accent) 55%,transparent)}
  .b.pri:hover{box-shadow:0 10px 24px -8px color-mix(in srgb,var(--color-accent) 65%,transparent)}
  .chip.on,.opt.on,.exact.on{box-shadow:0 0 0 1px var(--color-accent)}
  .hero h1,.hero h2,.hero h3,.dayname,.rankname{color:var(--color-text)}
  /* ═══ the workout in the dark ═══
     Scoped to the overlay: the dark values come back only inside .sess.dark, so the rest
     of the app is untouched and the toggle costs one class. */
  .seldark{flex:none;font-size:15px;line-height:1;padding:6px 9px}
  .sess.dark{
    --color-bg:#10131a; --color-surface:#1b1f28; --color-text:#e9ece9;
    --color-neutral-100:#f2f5f3; --color-neutral-200:#e2e7e4; --color-neutral-300:#c8d0cb;
    --color-neutral-400:#a5afa9; --color-neutral-500:#828d87; --color-neutral-600:#626c66;
    --color-neutral-700:#464e49; --color-neutral-800:#2d3630; --color-neutral-900:#1e2229;
    --color-accent-100:#c8f3e0; --color-accent-200:#9fe7cb; --color-accent-300:#6fd6ae;
    --color-accent-400:#45c294; --color-accent-500:#2fae80;
    background:var(--color-bg);color:var(--color-text)}
  .sess.dark .panel,.sess.dark .exrow{background:var(--color-surface);box-shadow:none}
  .sess.dark .sfield{background:#141821;border-color:#333c36}
  .sess.dark .wrow{border-color:#2b332e}
  .sess.dark .mm{fill:#2a3138;stroke:#10131a}
  /* ═══ stat cards ═══ */
  .statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .statcard{background:var(--color-surface);border-radius:var(--radius-lg);padding:14px;
    box-shadow:var(--shadow-sm);transition:box-shadow .3s ease}
  /* Entrance animations belong to arriving on a screen, not to every repaint of it. The whole
     body is replaced on each render — and a render happens on every tap in the build wizard — so
     an unconditional entrance animation restarted from opacity zero each time, which reads as the
     app flashing. Gated on an attribute set only when the tab actually changes. */
  #app[data-enter] .statcard{animation:fadeInUp .5s cubic-bezier(.16,1,.3,1) both}
  .statcard:hover{box-shadow:var(--shadow-md)}
  .scrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
  .sclabel{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
    color:color-mix(in srgb,var(--color-text) 42%,transparent)}
  .statcard:has(.sctile.z){opacity:.62}
  .sctile{flex:none;min-width:32px;height:32px;padding:0 8px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;
    background:color-mix(in srgb,var(--sq) 13%,transparent);color:var(--sq)}
  .scval{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1}
  .scsub{font-size:11px;margin-top:4px;color:color-mix(in srgb,var(--color-text) 42%,transparent)}
  @keyframes fadeInUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  /* ═══ status pills ═══ */
  .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;
    font-size:10.5px;font-weight:600;letter-spacing:.03em}
  .pill i{width:5px;height:5px;border-radius:50%;background:currentColor}
  .pill.done{background:color-mix(in srgb,var(--q-end) 13%,transparent);color:var(--q-end)}
  .pill.now{background:color-mix(in srgb,var(--q-strhyp) 14%,transparent);color:var(--q-strhyp)}
  .pill.soon{background:var(--color-neutral-800);color:var(--color-neutral-400)}
  .dchmeta{display:flex;align-items:center;gap:8px;flex:none}

  /* ═══ headings take the emerald gradient ═══ */
  h1.page{background:linear-gradient(135deg,#1a8f68,#159084 62%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    color:transparent;font-weight:700;letter-spacing:-.03em}
  .brand span{background:linear-gradient(135deg,#1a8f68,#159084);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

  /* ═══ cards arrive rather than appear ═══ */
  .scroll > .panel,.scroll > .hero,.scroll > .sect,.scroll > .logfeed > .logcard,
  #app[data-enter] .scroll > div > .daycard{animation:fadeInUp .45s cubic-bezier(.16,1,.3,1) both}
  .scroll > .panel:nth-child(2){animation-delay:40ms}
  .scroll > .panel:nth-child(3){animation-delay:80ms}
  .scroll > .panel:nth-child(4){animation-delay:120ms}
  @media (prefers-reduced-motion:reduce){
    .statcard,.scroll > .panel,.scroll > .hero,.scroll > .sect,
    .scroll > .logfeed > .logcard,.scroll > div > .daycard{animation:none}
  }
  .exdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:8px;
    vertical-align:middle;flex:none}
  .exname{display:flex;align-items:center}
  /* ═══ plan search ═══ */
  .plsearch{display:flex;align-items:center;gap:8px;margin:2px 0 4px}
  .plsearch input{flex:1;min-width:0;height:42px;padding:0 14px;font:inherit;font-size:14px;
    color:var(--color-text);background:var(--color-surface);border-radius:999px;
    border:1px solid var(--color-neutral-800);box-shadow:var(--shadow-sm);
    transition:border-color .18s ease,box-shadow .2s ease}
  .plsearch input::placeholder{color:color-mix(in srgb,var(--color-text) 34%,transparent)}
  .plsearch input:focus{outline:none;border-color:var(--color-accent);
    box-shadow:0 0 0 3px color-mix(in srgb,var(--color-accent) 16%,transparent)}
  .plsearch .mini{flex:none}

  /* ═══ v165 — header, tab bar and dashboard rebuilt to the reference layout ═══ */

  /* Three slots: identity, the question this tab answers, one action. The brand wordmark
     was spending the most valuable strip on the screen saying something the user already
     knows. */
  .top{display:grid;grid-template-columns:36px 1fr 36px;align-items:center;gap:10px;
    padding:calc(10px + env(safe-area-inset-top)) 16px 6px}
  .topmid{justify-content:center;text-align:center;min-width:0}
  .toppip{width:36px;height:36px;border-radius:50%;flex:none;cursor:pointer;display:grid;
    place-items:center;border:1px solid var(--color-neutral-800);
    background:color-mix(in srgb,var(--color-accent) 10%,transparent);
    color:var(--color-accent);transition:background .18s ease,transform .12s ease}
  .toppip:active{transform:scale(.94)}
  .helpb{justify-self:end}

  /* Tab bar: outline icons at a real size, the active one lifted into an accent field
     rather than marked by a dot the thumb covers. */
  nav{gap:2px;padding:6px 8px max(8px,env(safe-area-inset-bottom));
    background:color-mix(in srgb,var(--color-bg) 82%,transparent);
    backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6)}
  nav button{padding:7px 0 3px;gap:5px;font-size:10px;font-weight:500;border-radius:14px;
    transition:color .2s ease}
  nav button svg{width:23px;height:23px;position:relative;z-index:1;
    transition:transform .22s cubic-bezier(.2,.8,.2,1)}
  nav button span{position:relative;z-index:1;transition:font-weight .15s ease}
  nav button.on{color:var(--color-accent)}
  nav button.on span{font-weight:650}
  nav button.on svg{transform:translateY(-1px)}
  /* the moving field, replacing the dot */
  .navdot{position:absolute;top:6px;height:34px;border-radius:12px;box-shadow:none;
    background:color-mix(in srgb,var(--color-accent) 13%,transparent);
    transform-origin:center;pointer-events:none;opacity:0;z-index:0;
    transition:transform .28s cubic-bezier(.2,.8,.2,1),width .28s cubic-bezier(.2,.8,.2,1),opacity .2s ease}
  nav{position:sticky;isolation:isolate}

  /* Week strip: dates carry the week, marks carry the work. Sized so it reads at a glance
     from arm's length rather than needing a look. */
  .wkstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:2px 12px 14px}
  .wkstrip .wkday{border:0;background:transparent;cursor:pointer;padding:6px 0 5px;border-radius:13px;
    display:flex;flex-direction:column;align-items:center;gap:5px;transition:background .18s ease}
  .wkdow{font-family:var(--font-display);font-size:9.5px;font-weight:600;letter-spacing:.14em;
    text-transform:uppercase;color:color-mix(in srgb,var(--color-text) 34%,transparent)}
  .wknum{font-family:var(--font-display);font-size:17px;font-weight:600;letter-spacing:-.02em;
    color:color-mix(in srgb,var(--color-text) 62%,transparent);line-height:1}
  .wkstrip .wkday.past .wknum{color:color-mix(in srgb,var(--color-text) 34%,transparent)}
  .wkstrip .wkday.now .wknum{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
    background:var(--color-text);color:var(--color-bg)}
  .wkmarks{display:flex;gap:3px;height:6px;align-items:center}
  .wkmarks i{width:6px;height:6px;border-radius:2px;display:block}

  /* Day rail — horizontally scrolled cards, each edged by the quality it trains. */
  .dayrail{display:flex;gap:9px;overflow-x:auto;scroll-snap-type:x mandatory;
    padding:2px 20px 4px;margin:0 -20px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .dayrail::-webkit-scrollbar{display:none}
  .raild{scroll-snap-align:start;flex:none;width:132px;text-align:left;cursor:pointer;
    display:flex;flex-direction:column;gap:5px;padding:13px 14px 14px;border-radius:16px;
    border:1px solid var(--color-neutral-800);background:var(--color-surface);
    position:relative;overflow:hidden;transition:transform .16s ease,box-shadow .2s ease,border-color .2s ease}
  .raild::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
    background:var(--dc,var(--color-accent))}
  .raild[data-role="heavy"]{--dc:var(--q-maxstrength,#b3261e)}
  .raild[data-role="moderate"]{--dc:var(--q-strhyp,#a1560c)}
  .raild[data-role="volume"]{--dc:var(--q-hypertrophy,#6d3fc4)}
  .raild:active{transform:scale(.97)}
  .raild.on{border-color:var(--color-accent);
    box-shadow:0 0 0 1px var(--color-accent),0 8px 22px -16px var(--color-accent)}
  .dcrole{font-family:var(--font-display);font-size:9px;font-weight:600;letter-spacing:.16em;
    text-transform:uppercase;color:var(--dc,var(--color-accent))}
  .dcname{font-family:var(--font-display);font-size:15.5px;font-weight:600;letter-spacing:-.02em;
    line-height:1.15;color:var(--color-text)}
  .dcmeta{font-size:11px;color:color-mix(in srgb,var(--color-text) 48%,transparent)}
  .dcmeta b{font-weight:600;color:color-mix(in srgb,var(--color-text) 72%,transparent)}

  /* Hero: the one thing the dashboard is for. */
  .herotitle{font-family:var(--font-display);font-weight:600;font-size:38px;line-height:1;
    letter-spacing:-.04em;margin:9px 0 2px}
  .herostats{display:flex;gap:26px;margin-top:16px}
  .herostats b{display:block;font-family:var(--font-display);font-size:29px;font-weight:600;
    letter-spacing:-.035em;line-height:1}
  .herostats span{display:block;margin-top:3px;font-family:var(--font-display);font-size:9px;
    font-weight:600;letter-spacing:.16em;text-transform:uppercase;
    color:color-mix(in srgb,var(--color-text) 40%,transparent)}
  .b.wide{width:100%;justify-content:center;padding:16px 20px;font-size:15.5px;border-radius:16px}

  /* ═══ Workout screen — same density, real hierarchy ═══ */
  /* flex-direction is stated explicitly: the v152 rules set column, and a later rule that
     only re-declares display:flex leaves that direction standing. */
  .sesshead{display:flex;flex-direction:row;align-items:center;gap:10px;
    padding:calc(8px + env(safe-area-inset-top)) 4px 14px}
  .sesswhat{flex:1;min-width:0;display:flex;flex-direction:row;align-items:baseline;gap:8px}
  .sessday{font-family:var(--font-display);font-weight:600;font-size:16px;letter-spacing:-.02em;
    color:var(--color-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sheadr{display:flex;align-items:center;gap:8px;flex:none}
  .shx{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;cursor:pointer;
    border:1px solid var(--color-neutral-800);background:transparent;font-size:14px;
    color:color-mix(in srgb,var(--color-text) 60%,transparent);
    transition:background .16s ease,transform .12s ease}
  .shx:active{transform:scale(.92)}
  .sess.dark .shx{border-color:rgba(255,255,255,.16);color:rgba(255,255,255,.72)}
  .sess.dark .sessday{color:#f2f5f7}

  /* Movement actions as a labelled icon row — three equal targets instead of three
     different-width text buttons that shuffle position as movement names change. */
  .exacts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:2px 0 14px}
  .exact{display:flex;flex-direction:column;align-items:center;gap:6px;padding:11px 4px 10px;
    border-radius:15px;cursor:pointer;text-decoration:none;
    border:1px solid var(--color-neutral-800);background:var(--color-surface);
    font-family:var(--font-display);font-size:10.5px;font-weight:600;letter-spacing:.03em;
    color:color-mix(in srgb,var(--color-text) 62%,transparent);
    transition:transform .14s ease,border-color .18s ease,color .18s ease}
  .exact:active{transform:scale(.96)}
  .exacti{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
    background:color-mix(in srgb,var(--color-accent) 11%,transparent);color:var(--color-accent)}
  .sess.dark .exact{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.12);color:rgba(255,255,255,.7)}

  /* The movement counter as a segment bar, one segment per movement. */
  .dots{display:flex;gap:3px;margin-bottom:14px}
  .dots i{flex:1;height:3px;border-radius:2px;cursor:pointer;display:block;
    background:color-mix(in srgb,var(--color-text) 12%,transparent);
    transition:background .3s ease,transform .2s ease}
  .dots i.done{background:color-mix(in srgb,var(--color-accent) 55%,transparent)}
  .dots i.now{background:var(--color-accent);transform:scaleY(2)}
  .sess.dark .dots i{background:rgba(255,255,255,.14)}

  /* Set rows: a real grid, so the numbers line up down the column. */
  /* min-width:0 on the fields: a grid track defaults to min-content, so the unit label was
     pushed past the row edge and clipped. */
  .srow > .sfield{min-width:0}
  .srow .val{min-width:0}
  .srow{display:grid;grid-template-columns:34px minmax(0,1fr) minmax(0,1fr);align-items:center;gap:6px;
    padding:8px 0;border-top:1px solid color-mix(in srgb,var(--color-text) 7%,transparent)}
  .srow:first-of-type{border-top:0}
  .sbox{width:34px;height:34px;border-radius:11px;flex:none;cursor:pointer;
    border:1px solid var(--color-neutral-800);background:transparent;
    font-family:var(--font-display);font-weight:600;font-size:13px;
    color:color-mix(in srgb,var(--color-text) 48%,transparent);
    transition:background .18s ease,color .18s ease,border-color .18s ease}
  .srow.done .sbox{background:var(--color-accent);border-color:var(--color-accent);color:#fff}
  .srow.done{opacity:.62}
  .srow.warm .sbox{border-style:dashed}
  .sess.dark .srow{border-color:rgba(255,255,255,.09)}
  .sess.dark .sbox{border-color:rgba(255,255,255,.18);color:rgba(255,255,255,.55)}

  /* ═══ v166 — greeting, day-card tiles and up-next blocks ═══ */
  .greet{padding:2px 2px 14px}
  .greetdate{font-family:var(--font-display);font-size:10px;font-weight:600;letter-spacing:.16em;
    text-transform:uppercase;color:color-mix(in srgb,var(--color-text) 38%,transparent)}
  .greethi{font-family:var(--font-display);font-weight:600;font-size:26px;line-height:1.1;
    letter-spacing:-.03em;margin:6px 0 0;color:var(--color-text)}
  .greethi span{color:var(--color-accent)}

  /* Icon tile: pale field, saturated mark, tinted by the quality the day trains. */
  .raild{width:154px;gap:0;padding:13px 13px 11px}
  .dctile{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;
    background:color-mix(in srgb,var(--dc,var(--color-accent)) 13%,transparent);
    color:var(--dc,var(--color-accent));margin-bottom:11px}
  .raild .dcname{margin-bottom:3px}
  .raild .dcmeta{margin-bottom:10px}

  /* Footer: ruled off, state on the left, count on the right. */
  .dcfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;
    margin-top:auto;padding-top:9px;
    border-top:1px solid color-mix(in srgb,var(--color-text) 9%,transparent)}
  .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 8px 3px 6px;border-radius:999px;
    font-family:var(--font-display);font-size:9.5px;font-weight:600;letter-spacing:.06em;
    text-transform:uppercase;
    background:color-mix(in srgb,var(--dc,var(--color-accent)) 12%,transparent);
    color:var(--dc,var(--color-accent))}
  .pill i{width:5px;height:5px;border-radius:50%;background:currentColor;display:block}
  .dccount{font-family:var(--font-display);font-size:12px;font-weight:600;
    color:color-mix(in srgb,var(--color-text) 46%,transparent)}

  /* Up next: a calendar block, then what it is. */
  .upnext{display:flex;flex-direction:column;gap:8px}
  .upcard{display:flex;align-items:center;gap:13px;width:100%;text-align:left;cursor:pointer;
    padding:11px 13px;border-radius:15px;border:1px solid var(--color-neutral-800);
    background:var(--color-surface);transition:transform .14s ease,border-color .18s ease}
  .upcard:active{transform:scale(.985)}
  div.upcard{cursor:default}
  .update{flex:none;width:46px;padding:7px 0 6px;border-radius:12px;text-align:center;
    background:color-mix(in srgb,var(--color-accent) 11%,transparent);color:var(--color-accent)}
  .update b{display:block;font-family:var(--font-display);font-size:9px;font-weight:700;
    letter-spacing:.12em}
  .update i{display:block;font-family:var(--font-display);font-size:19px;font-weight:600;
    font-style:normal;letter-spacing:-.03em;line-height:1.05}
  .upbody{min-width:0;display:flex;flex-direction:column;gap:3px}
  .upname{font-family:var(--font-display);font-size:15px;font-weight:600;letter-spacing:-.02em;
    color:var(--color-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .upmeta{font-size:11.5px;color:color-mix(in srgb,var(--color-text) 46%,transparent)}

  /* ═══ v167 — Plan session tiles ═══ */
  .dctile.plan{width:38px;height:38px;flex:none;margin:1px 0 0;border-radius:12px;
    background:color-mix(in srgb,var(--rq) 13%,transparent);color:var(--rq)}
  .pill.done{--dc:var(--q-hypertrophy,#6d3fc4)}
  .pill.now{--dc:var(--color-accent)}
  .pill.soon{--dc:color-mix(in srgb,var(--color-text) 42%,transparent)}

  /* the step rail — the dots show position, the rail lets you go anywhere */
  .steprail{display:flex;gap:5px;overflow-x:auto;padding:8px 0 2px;margin:0 -2px;
    scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .steprail::-webkit-scrollbar{display:none}
  .steppip{flex:none;cursor:pointer;border-radius:999px;padding:5px 11px;
    font-family:var(--font-display);font-size:11px;font-weight:600;letter-spacing:.01em;
    border:1px solid var(--color-neutral-800);background:transparent;
    color:color-mix(in srgb,var(--color-text) 48%,transparent);transition:all .16s ease}
  .steppip:active{transform:scale(.96)}
  .steppip.past{color:color-mix(in srgb,var(--color-accent) 80%,var(--color-text));
    border-color:color-mix(in srgb,var(--color-accent) 35%,transparent)}
  .steppip.on{background:color-mix(in srgb,var(--color-accent) 13%,transparent);
    border-color:var(--color-accent);color:var(--color-accent)}

  /* ═══ workout completion summary ═══ */
  .sumo{position:fixed;inset:0;z-index:80;overflow-y:auto;
    background:radial-gradient(90% 55% at 50% 0%,color-mix(in srgb,var(--color-accent) 13%,transparent) 0%,transparent 68%),
      var(--color-bg)}
  .sumin{max-width:520px;margin:0 auto;padding:calc(26px + env(safe-area-inset-top)) 20px
    calc(26px + env(safe-area-inset-bottom))}
  .sumtitle{font-family:var(--font-display);font-weight:600;font-size:34px;line-height:1.05;
    letter-spacing:-.035em;margin-top:6px}
  .sumsub{font-size:12.5px;margin-top:5px;color:color-mix(in srgb,var(--color-text) 50%,transparent)}
  .sumstats{display:flex;gap:26px;margin:20px 0 4px}
  .sumstats b{display:block;font-family:var(--font-display);font-size:28px;font-weight:600;
    letter-spacing:-.035em;line-height:1}
  .sumstats span{display:block;margin-top:3px;font-family:var(--font-display);font-size:9px;
    font-weight:600;letter-spacing:.16em;text-transform:uppercase;
    color:color-mix(in srgb,var(--color-text) 42%,transparent)}
  .sumdelta{margin-top:14px;font-size:12.5px;padding:9px 13px;border-radius:12px;
    background:color-mix(in srgb,var(--color-text) 5%,transparent);
    color:color-mix(in srgb,var(--color-text) 62%,transparent)}
  .sumdelta.up{color:var(--color-accent);background:color-mix(in srgb,var(--color-accent) 10%,transparent)}
  .sumsec{margin-top:20px}
  .sumsec .listrow:first-of-type{border-top:0}

  /* how-to steps */
  .howcue{font-size:12.5px;line-height:1.5;margin:6px 0 12px;
    color:color-mix(in srgb,var(--color-text) 60%,transparent);font-style:italic}
  .howstep{display:flex;flex-direction:column;gap:3px;padding:10px 0;
    border-top:1px solid color-mix(in srgb,var(--color-text) 8%,transparent)}
  .howstep b{font-family:var(--font-display);font-size:9.5px;font-weight:600;letter-spacing:.16em;
    text-transform:uppercase;color:color-mix(in srgb,var(--color-text) 45%,transparent)}
  .howstep span{font-size:13px;line-height:1.55;color:var(--color-text);text-wrap:pretty}
  .howstep.warn b{color:var(--color-accent)}

/* ── readiness / symptom clinical layer ── */
.linkq{background:none;border:0;color:var(--color-accent);font:inherit;font-size:.82rem;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px;opacity:.9}
.linkq:hover{opacity:1}
.rdrow{display:flex;align-items:center;gap:16px;margin-top:12px}
.rdring{flex:0 0 auto;width:66px;height:66px;border-radius:50%;display:grid;place-items:center;position:relative}
.rdring::after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--color-surface)}
.rdring .num{position:relative;z-index:1;font-family:var(--font-heading);font-weight:600;font-size:1.35rem;line-height:1}
.rdinstr{flex:1 1 auto;min-width:0}
.rdhead{font-family:var(--font-heading);font-weight:600;font-size:1.02rem;line-height:1.2}
.rdnote{margin-top:12px;padding:10px 12px;border-radius:var(--radius-md);background:var(--color-neutral-800);border:1px solid var(--color-divider);font-size:.86rem;line-height:1.45;color:var(--color-neutral-300)}
.rdnote b{color:var(--color-text)}
.sevpill{display:inline-block;font-size:.72rem;font-weight:600;padding:1px 7px;border-radius:999px;vertical-align:middle;margin-left:4px}
.rdq{margin-bottom:16px}
.rdscale{display:flex;gap:7px;margin-top:8px}
.rdscale.sev{flex-wrap:wrap}
.rdchip{flex:1 1 0;min-width:34px;height:44px;border-radius:var(--radius-sm,10px);border:1px solid var(--color-divider);background:var(--color-neutral-800);color:var(--color-neutral-300);font-family:var(--font-heading);font-weight:600;font-size:1rem;cursor:pointer;transition:transform .08s ease,background .12s ease,color .12s ease,border-color .12s ease}
.rdscale.sev .rdchip{flex:0 0 auto;width:calc((100% - 70px)/11)}
.rdchip:active{transform:scale(.94)}
.rdchip.on{background:var(--on,var(--color-accent));border-color:var(--on,var(--color-accent));color:#12131a}


/* ── autoregulation apply control + session banner ── */
.rdapply{margin-top:14px;padding:12px;border-radius:var(--radius-md);border:1px solid var(--color-divider);background:var(--color-neutral-800)}
.rdapply.on{border-color:#1e8a5f66;background:color-mix(in srgb,#1e8a5f 10%,var(--color-neutral-800))}
.rdapply .brow{margin:0}
.rdapply .brow .b.pri{flex:1}
.sessauto{display:inline-block;margin:0 0 12px;padding:6px 11px;border-radius:999px;font-size:.8rem;font-weight:600;color:var(--color-accent);background:color-mix(in srgb,var(--color-accent) 16%,transparent);border:1px solid color-mix(in srgb,var(--color-accent) 40%,transparent)}
.sess.dark .sessauto{color:#e7c98a;background:rgba(200,165,107,.16);border-color:rgba(200,165,107,.4)}

/* ── performance progression: suggested-weight line + effort tap ── */
.progline{display:flex;align-items:center;gap:10px;margin:2px 0 10px}
.progtag{font-family:var(--font-heading);font-weight:600;font-size:.95rem;padding:4px 11px;border-radius:999px;background:var(--color-neutral-800);color:var(--color-text)}
.progline.progress .progtag{background:color-mix(in srgb,#1e8a5f 16%,transparent);color:#1e8a5f}
.progline.deload .progtag{background:color-mix(in srgb,#c2621c 16%,transparent);color:#c2621c}
.effort{margin-top:12px;padding:11px 12px;border-radius:var(--radius-md);border:1px dashed var(--color-divider);background:transparent;transition:border-color .2s ease,background .2s ease}
.effort.lit{border-style:solid;border-color:var(--color-divider);background:var(--color-neutral-800)}
.effchips{display:flex;gap:7px;margin-top:9px}
.effchip{flex:1;padding:9px 4px;border-radius:var(--radius-sm,10px);border:1px solid var(--color-divider);background:var(--color-surface);color:var(--color-neutral-300);font:inherit;font-weight:600;font-size:.86rem;cursor:pointer;transition:transform .08s ease,background .12s,color .12s,border-color .12s}
.effchip:active{transform:scale(.95)}
.effchip.on{color:#12131a;border-color:transparent}
.effchip.on.easy{background:#1e8a5f}
.effchip.on.solid{background:#4a854f}
.effchip.on.hard{background:#c2621c}
.effchip.on.grind{background:#c2185b}
.sess.dark .effchip{background:rgba(255,255,255,.05);color:var(--color-neutral-400)}
.sess.dark .effort.lit{background:rgba(255,255,255,.04)}

/* ── earned-progress acknowledgment ── */
.earnkicker{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--color-accent);font-weight:700}
.earnrow{padding:11px 13px;border-radius:var(--radius-md);border:1px solid color-mix(in srgb,var(--color-accent) 45%,transparent);background:color-mix(in srgb,var(--color-accent) 9%,var(--color-surface));margin-bottom:8px}
.earnhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.earnname{font-weight:600;font-size:15px}
.earnval{font-family:var(--font-heading);font-weight:700;color:var(--color-accent);font-size:17px;white-space:nowrap}

/* ── bodyweight level-up offer ── */
.progline.levelup{border:1px solid color-mix(in srgb,var(--color-accent) 50%,transparent);background:color-mix(in srgb,var(--color-accent) 10%,var(--color-surface));border-radius:var(--radius-md);padding:9px 11px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.progline.levelup .progtag{font-weight:600;color:var(--color-text)}
/* ── bodyweight step-back offer: same shape as the level-up, in the deload's own colour so a
   regression never reads as a reward ── */
.progline.regress{border:1px solid color-mix(in srgb,#c2621c 45%,transparent);background:color-mix(in srgb,#c2621c 9%,var(--color-surface));border-radius:var(--radius-md);padding:9px 11px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.progline.regress .progtag{font-weight:600;background:color-mix(in srgb,#c2621c 16%,transparent);color:#c2621c}
.progline.regress .proglvl{background:#c2621c;color:#fff}
.progline.hold .progtag{background:color-mix(in srgb,var(--color-text) 10%,transparent);color:var(--color-text);opacity:.82}

/* ── the session's own body map: a small figure pinned beside the movement ── */
#sessmodel{position:fixed;inset:0;pointer-events:none;z-index:64}
#sessmodel > *{pointer-events:auto}
.mm3sess{position:absolute;top:calc(env(safe-area-inset-top,0px) + 62px);width:116px;
  border-radius:14px;overflow:hidden;background:color-mix(in srgb,var(--color-surface) 92%,transparent);
  border:1px solid var(--color-divider);box-shadow:var(--shadow-md);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.mm3sess.right{right:10px} .mm3sess.left{left:10px}
.mm3sesshead{display:flex;justify-content:flex-end;gap:2px;padding:3px 3px 0}
.mm3btn{font:inherit;font-size:11px;line-height:1;width:20px;height:20px;border:0;cursor:pointer;
  border-radius:6px;background:transparent;color:color-mix(in srgb,var(--color-text) 55%,transparent)}
.mm3btn:hover{background:color-mix(in srgb,var(--color-text) 10%,transparent);color:var(--color-text)}
.mm3sessstage{height:132px;width:100%}
.mm3sessstage canvas{display:block;width:100%;height:100%}
.mm3flat{padding:4px 8px}
.mm3flat svg{width:100%;height:120px}
.mm3sesslabel{padding:5px 8px 8px;font-size:9.5px;line-height:1.35;text-align:center;
  font-weight:600;letter-spacing:.02em}
.mm3peek{position:absolute;top:calc(env(safe-area-inset-top,0px) + 62px);
  font:inherit;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  padding:7px 10px;border-radius:10px;cursor:pointer;border:1px solid var(--color-divider);
  background:color-mix(in srgb,var(--color-surface) 92%,transparent);color:var(--color-text);
  box-shadow:var(--shadow-sm);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.mm3peek.right{right:10px} .mm3peek.left{left:10px}
.mm3btn:focus-visible,.mm3peek:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}
@media (max-width:360px){ .mm3sess{width:98px} .mm3sessstage{height:112px} }
/* the top block keeps clear of whichever side the map is pinned to */
.sess.mm3-right .dots,.sess.mm3-right > .sessin > .kicker,.sess.mm3-right .sessin > h2,
.sess.mm3-right .exacts{padding-right:126px}
.sess.mm3-left .dots,.sess.mm3-left > .sessin > .kicker,.sess.mm3-left .sessin > h2,
.sess.mm3-left .exacts{padding-left:126px}
.sess .exacts{flex-wrap:wrap}
@media (max-width:360px){
  .sess.mm3-right .dots,.sess.mm3-right > .sessin > .kicker,.sess.mm3-right .sessin > h2,
  .sess.mm3-right .exacts{padding-right:108px}
  .sess.mm3-left .dots,.sess.mm3-left > .sessin > .kicker,.sess.mm3-left .sessin > h2,
  .sess.mm3-left .exacts{padding-left:108px}
}

/* ── dragging a session between days on the Today calendar ── */
.calcell.movable{cursor:grab;touch-action:pan-y}
.calcell.dragging{cursor:grabbing;z-index:5;position:relative;opacity:.94;
  transform-origin:center;box-shadow:var(--shadow-lg);border-radius:12px;
  background:var(--color-surface);transition:none}
.calcell.dropinto{border-radius:12px;
  box-shadow:inset 0 0 0 2px var(--color-accent);
  background:color-mix(in srgb,var(--color-accent) 12%,transparent)}

/* ── manage schedule ── */
.msweek{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:9px}
.msday{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:9px;
  background:color-mix(in srgb,var(--color-text) 5%,transparent);text-align:center;min-width:0}
.msday.on{background:color-mix(in srgb,var(--color-accent) 14%,transparent)}
.msdow{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  color:color-mix(in srgb,var(--color-text) 55%,transparent)}
.msname{font-size:10px;font-weight:600;line-height:1.2;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;max-width:100%;color:var(--color-text)}
.msday.on .msname{color:var(--color-accent)}
.msrow{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--color-divider)}
.msrow:last-of-type{border-bottom:0}
.msrow.ord{gap:8px}
.msrowname{font-size:13.5px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Epley, held to the range it is valid in. The formula tracks reality to about ten reps and
   diverges hard above that, and the estimate is the MAXIMUM across all history — so one 25-rep
   burnout set at 135 lb used to lift the estimated max from 171 to 248 and drag every "% 1RM"
   in the program up with it, prescribing 180 lb for sets of eight to someone benching 135 for
   eight. Reps past ten no longer add to the estimate: a high-rep set can confirm a max, never
   inflate one. A true single also comes back as itself — the raw formula returned 1.033w. */
const E1RM_MAX_REPS = 10;
const e1rm = (w,r) => {
  if(!(r > 0)) return w;
  const n = Math.min(r, E1RM_MAX_REPS);
  return n <= 1 ? Math.round(w) : Math.round(w*(1+n/30));

  clock:'M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm64-88a8,8,0,0,1-8,8H128a8,8,0,0,1-8-8V72a8,8,0,0,1,16,0v48h48A8,8,0,0,1,192,128Z',

  play:'M232,128a8,8,0,0,1-3.76,6.79l-88,55.77A8,8,0,0,1,128,183.77V72.23a8,8,0,0,1,12.24-6.79l88,55.77A8,8,0,0,1,232,128Z',
  cog:'M128,80a48,48,0,1,0,48,48A48,48,0,0,0,128,80Zm0,80a32,32,0,1,1,32-32A32,32,0,0,1,128,160Z'
};
const svg = (d,s) => `<svg width="${s||22}" height="${s||22}" viewBox="0 0 256 256" fill="currentColor"><path d="${d}"></path></svg>`;

/* ── storage ── */
let canPersist = true;
try{ localStorage.setItem('__tl','1'); localStorage.removeItem('__tl'); }catch(e){ canPersist=false; }
const inClaude = typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function';
/* Guarantee the shape everything downstream assumes, so a restored backup or a
   session written by an older version can never crash a screen. Runs once at load. */
function normalizeData(){
  const validISO = v => typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v) &&
    !isNaN(new Date(v + 'T12:00:00').getTime());
  const fixSession = s => {
    if(!s || typeof s !== 'object') return null;
    if(!validISO(s.date)) return null;           // undateable — every week/streak calc needs it
    if(!s.entries || typeof s.entries !== 'object') s.entries = {};
    Object.keys(s.entries).forEach(k=>{
      if(!Array.isArray(s.entries[k])) s.entries[k] = [];
      // a key with no real movement name renders as "undefined" everywhere downstream
      if(!k || k === 'undefined' || k === 'null' || !s.entries[k].length) delete s.entries[k];
    });
    if(s.completed === undefined) s.completed = true;
    return s;
  };
  const fixRun = r => {
    if(!r || typeof r !== 'object' || !validISO(r.date)) return null;
    r.miles = Math.max(0, +r.miles || 0);
    r.minutes = Math.max(0, +r.minutes || 0);
    return r;
  };
  if(!Array.isArray(state.sessions)) state.sessions = [];
  if(!Array.isArray(state.runs)) state.runs = [];
  if(!Array.isArray(state.plan)) state.plan = [];
  if(!Array.isArray(state.archive)) state.archive = [];
  state.sessions = state.sessions.map(fixSession).filter(Boolean);
  state.runs = state.runs.filter(fixRun);
  state.archive = state.archive.filter(a=>a && typeof a === 'object').map(a=>{
    a.sessions = Array.isArray(a.sessions) ? a.sessions.map(fixSession).filter(Boolean) : [];
    a.runs = Array.isArray(a.runs) ? a.runs.filter(fixRun) : [];
    return a;
  });
  /* A null or nameless exercise in a restored plan crashes every day view. */
  state.plan = state.plan.filter(d=>d && typeof d === 'object');
  state.plan.forEach(d=>{
    d.exercises = Array.isArray(d.exercises)
      ? d.exercises.filter(e=>e && typeof e === 'object' && e.name) : [];
  });
  // clamp any stored set values that are absurd or non-numeric
  const clampSets = arr => arr.forEach(x=>{
    if(!x || typeof x !== 'object') return;
    x.w = Math.max(0, Math.min(2000, +x.w || 0));
    x.r = Math.max(0, Math.min(300, Math.round(+x.r || 0)));
  });
  /* Wearable support was started and then shelved. Nothing writes this key any more, but a
     state saved while it existed still carries it, and it would otherwise ride along in
     every backup from here on. */
  if('wearables' in state) delete state.wearables;
  /* clinical layer: keep the two logs shaped so a bad restore can't wedge a wellness view */
  if(state.autoreg && typeof state.autoreg !== 'object') state.autoreg = null;
  if(!state.progAck || typeof state.progAck !== 'object' || Array.isArray(state.progAck)) state.progAck = {};
  if(!Array.isArray(state.readiness)) state.readiness = [];
  if(!Array.isArray(state.symptoms)) state.symptoms = [];
  state.readiness = state.readiness.filter(r=>r && typeof r === 'object' && validISO(r.date));
  state.symptoms = state.symptoms.filter(s=>s && typeof s === 'object' && validISO(s.date))
    .map(s=>{ s.sev = Math.max(0, Math.min(10, Math.round(+s.sev || 0))); return s; });
  state.sessions.forEach(s=>Object.keys(s.entries).forEach(k=>clampSets(s.entries[k])));
  (state.archive || []).forEach(a=>(a.sessions || []).forEach(s=>
    Object.keys(s.entries || {}).forEach(k=>clampSets(s.entries[k]))));
}
async function load(){
  try{
    if(inClaude){ const r = await window.storage.get(KEY); if(r && r.value) state = Object.assign(state, JSON.parse(r.value)); }
    else { const v = localStorage.getItem(KEY); if(v) state = Object.assign(state, JSON.parse(v)); }
  }catch(e){}
  if(!ui.dayId && state.plan.length) ui.dayId = state.plan[0].id;
  normalizeData();                             // guarantee session/run/archive shape before anything reads it
  if(repairPlanNames()) saveNow();             // heal free-text swaps from older versions
  if(state.setup) setup = Object.assign(setup, state.setup);
  /* A saved setup from before focus days were removed can still name one, and nothing in the
     onboarding can clear it any more. Pin it. */
  setup.focus = 'balanced';
  setup.priorities = [];
  if(migrateProgramming()) saveNow();          // bring stored prescriptions up to the current engine
  if(!setup.goals || !setup.goals.length) setup.goals = [setup.goal || 'hypertrophy'];
  if(!setup.startDate || setup.startDate < todayISO()) setup.startDate = todayISO();
  syncTrainDows();
  if(!setup.splitStyle) setup.splitStyle = 'auto';
  if(!setup.priorities){                       // carry an older setup across
    setup.priorities = [];
    const f = Object.keys(REGIONS).find(k=>REGIONS[k].focus === setup.focus);
    if(f) setup.priorities.push({ r:f, lvl:'day' });
    (setup.emphasis||[]).forEach(g=>{
      const r = Object.keys(REGIONS).find(k=>!REGIONS[k].dayOnly && REGIONS[k].groups.length===1 && REGIONS[k].groups[0]===g);
      if(r && setup.priorities.length < 2 && !setup.priorities.some(x=>x.r===r)) setup.priorities.push({ r, lvl:'more' });
    });
  }
  if(!setup.kit) setup.kit = Object.assign({}, PRESETS.gym.kit.reduce((a,k)=>(a[k]=true,a),{}));
  /* New kit keys must not silently switch themselves off for existing users:
     anything the stored map has never seen follows the active preset. */
  [setup.kit, state.setup && state.setup.kit].forEach(map=>{
    if(!map) return;
    const preset = PRESETS[setup.equip];
    KIT_KEYS.forEach(k=>{ if(map[k] === undefined) map[k] = preset ? preset.kit.indexOf(k) > -1 : true; });
  });
  if(!state.plan.length) ui.tab = 'build';   // first run lands on the builder
  restoreSession();
  ui.tour = null;                            // the walkthrough is not part of this build
  render();
}
/* Writes have to be able to complete synchronously. An async save started from
   pagehide or a visibility change does its work in a microtask, which the OS is
   free to discard once the page is gone — which is how an in-progress workout
   disappeared on closing the app. saveNow() writes immediately, with no await. */
const SKEY = KEY + '-session';
let saveWarned = false;
function saveNow(){
  let ok = true;
  /* Stamp every write. Two copies of the app share one storage key — two tabs, or a tab and the
     installed app — and the listener below used to adopt whatever arrived. A stale copy saving
     for any reason therefore replaced a newer program wholesale, which is how a freshly built
     program reverted to the previous one, injuries and all. */
  state.savedAt = Date.now();
  try{
    if(canPersist){
      localStorage.setItem(KEY, JSON.stringify(state));
      if(state.openSession) localStorage.setItem(SKEY, JSON.stringify(state.openSession));
      else localStorage.removeItem(SKEY);
    }
  }catch(e){ ok = false; onSaveFail(e); }
  if(inClaude){ try{ window.storage.set(KEY, JSON.stringify(state)); }catch(e){} }
  return ok;
}
/* A write that fails silently is the worst thing this app can do — a client
   finishes a session and the log quietly never records it. Say so instead. */
function onSaveFail(err){
  if(saveWarned) return;                       // one standing warning, not one per set
  saveWarned = true;
  const full = err && (err.name === 'QuotaExceededError' ||

      : 'Your browser is blocking storage — private browsing does this. Anything you log now will be lost when you close the app.') +

/* Two tabs (or a tab plus the installed app) each hold their own copy of state.
   Whichever saves last used to win, silently wiping the other's sessions. Watch
   for a write from elsewhere and reconcile instead of overwriting it. */
window.addEventListener('storage', e=>{
  if(e.key !== KEY || !e.newValue) return;
  if(ui.sess){                                  // mid-workout: never yank the screen away
    if(!ui.staleWarned){
      ui.staleWarned = true;
      toast('Trainlog is open somewhere else — finish here, then reload');
    }
    return;
  }
  try{
    const incoming = JSON.parse(e.newValue);
    /* Only ever move forward. Anything without a stamp predates this rule and is not trusted
       over what is in memory. */
    const mine = +state.savedAt || 0, theirs = +incoming.savedAt || 0;
    if(theirs <= mine){
      if(!ui.staleWarned){
        ui.staleWarned = true;
        toast('Another copy of Trainlog is open — this one is newer, so it was kept');
      }
      saveNow();                                 // put the newer copy back
      return;
    }
    state = Object.assign(state, incoming);
    normalizeData();
    if(!day(ui.dayId) && state.plan.length) ui.dayId = state.plan[0].id;
    render();
  }catch(err){}
});

/* ── helpers over the plan ── */
const day = id => state.plan.find(d=>d.id===id);
function lastSetsOf(exName){
  for(let i=state.sessions.length-1;i>=0;i--){
    const e = state.sessions[i].entries[exName];
    if(e && e.length) return {sets:e, week:state.sessions[i].week, date:state.sessions[i].date};
  }
  return null;
}
function topSet(sets){ return sets.reduce((a,b)=> e1rm(b.w,b.r)>e1rm(a.w,a.r)?b:a); }
function bestOf(exName){
  let best = 0;
  state.sessions.forEach(s=>{ const e=s.entries[exName]; if(e&&e.length){ const t=topSet(e); best=Math.max(best,e1rm(t.w,t.r)); } });
  return best;
}
function stripLoad(str){
  let s = String(str||'');
  s = s.replace(/^\s*\d+(?:\.\d+)?\s*(?:lb|s|kg)\b\s*/i,'');
  s = s.replace(/\b\d+(?:\.\d+)?\s*(?:lb|kg)\b\s*/gi,'');
  return s.replace(/^\s*[+·-]\s*/,'').trim();
}
function weekCount(){ return Math.max(4, Math.min(12, state.weeks || (state.weekNames ? state.weekNames.length : 4))); }
function phaseOf(week, total){          // the 4-week wave repeats; the final week is always a deload
  const n = total || weekCount();
  if(week >= n) return 3;
  const ph = (week - 1) % 4;
  /* Two rules used to fire independently — every fourth week deloads, AND the last week always
     deloads — so wherever they landed near each other the block lost its taper. A five-week
     block spent its last two weeks unloading back to back; a nine-week block did the same; a
     six-week block put one lone loading week between two deloads and gave a third of the block
     to recovery. The scheduled deload gives way when the forced final one is already within
     reach, leaving one unbroken run into the taper. Lengths 4, 8 and 12 are unaffected. */
  if(ph === 3 && (n - week) < 3) return 2;
  return ph;
}
const waveOf = week => Math.floor((week - 1) / 4) + 1;
/* "60% 1RM" cannot be acted on without knowing the max. Where enough has been logged to
   estimate one, show the weight beside the percentage; where it has not, say so rather than
   leave a percentage hanging. Added after stripLoad, which would otherwise remove it. */
function withEstimate(ex, text){
  const m = String(text).match(/(\d+(?:\.\d+)?)% 1RM/);
  if(!m || !ex || !ex.name) return text;
  const max = trainingMax(ex.name, ex);
  /* No max means the percentage is a percentage of nothing. The RPE on the same line already
     prescribes the effort, so drop the percentage rather than restate the effort a second
     time in reps-in-reserve. */
  if(!max) return text.replace(new RegExp('\\s*·\\s*' + m[0].replace(/[.*+?^${}()|[\]\\]/g, '\\$&')), '');
  const w = Math.round(max * (+m[1] / 100) / 2.5) * 2.5;
  return text.replace(m[0], m[0] + ' ≈ ' + w + ' lb');
}
/* The prescription exactly as written, with no load estimate folded in.

   Every parser that reads sets or reps must use THIS and not tgt(). tgt() annotates the
   line with an estimated working weight, and computing that estimate needs the rep target
   — so a parser that called tgt() re-entered the estimator and recursed until the stack
   gave out, killing the workout screen. It only bit once a lift had a logged best (with no
   best, trainingMax returns 0 before it ever asks for reps), which is why testing against
   an empty log never showed it. */
function rawTarget(ex, wk){
  const w = wk || state.week;
  const t = ex.targets || [];
  if(!t.length) return '';
  return stripLoad(t[w-1] !== undefined ? t[w-1] : t[phaseOf(w)] || t[t.length-1]);
}
function tgt(ex, wk){
  const raw = rawTarget(ex, wk);
  return raw ? withEstimate(ex, raw) : '';
}
const weekNamesNow = () => (state.weekNames && state.weekNames.length) ? state.weekNames : WEEK_NAMES;

/* What people actually type. A sport is easier to name than to find in a list of fifty, so
   the field comes first and the bank is there for when the name will not come. */
/* ── Adaptation parameters ────────────────────────────────────────────────────
   Load follows the quality being trained. Each adaptation carries its own %1RM band, rep
   range, set range and rest window. %1RM is a loading GUIDE — the rep-to-percentage
   relationship varies by person and exercise — so it is prescribed alongside reps and
   proximity to failure, never instead of them. */
const ADAPT = {
  maxstrength: { label:'max strength',       pct:[85,100], reps:[1,5],   sets:[3,6], rest:[180,300] },
  strhyp:      { label:'strength + size',    pct:[75,85],  reps:[5,8],   sets:[3,5], rest:[120,240] },
  hypertrophy: { label:'hypertrophy',        pct:[65,80],  reps:[8,15],  sets:[3,5], rest:[60,180] },
  hyphigh:     { label:'hypertrophy, light', pct:[50,65],  reps:[15,30], sets:[2,4], rest:[60,120] },
  endurance:   { label:'muscular endurance', pct:[40,60],  reps:[15,30], sets:[2,4], rest:[30,90] },
  power:       { label:'power',              pct:[30,70],  reps:[1,5],   sets:[3,6], rest:[120,300] }
};
/* Three steps per goal, walked in order — a gradual build toward the quality the goal is
   after, rather than a different emphasis every week. */
const GOAL_RAMP = {
  hypertrophy: ['hypertrophy','hypertrophy','strhyp'],
  strength:    ['strhyp','maxstrength','maxstrength'],
  power:       ['strhyp','power','power'],
  /* Endurance first, then the light-hypertrophy band, then hypertrophy proper — a gradual
     build in load across the block rather than a jump from 40–60% to 65–80% in one step.
     This step was also the only adaptation in the table nothing could ever reach. */
  health:      ['endurance','hyphigh','hypertrophy']
};
const adaptFor = (goalKey, week, total) =>
  (GOAL_RAMP[goalKey || primaryGoal()] || GOAL_RAMP.hypertrophy)[blockIndex(week, total)];

/* The load comes OUT of the rep prescription rather than being chosen beside it, so the two
   can never contradict. Inverse Epley. */
const pctForReps = r => 3000 / (30 + Math.max(1, r));
function loadPct(goalKey, week, total, reps, rpe){
  const a = ADAPT[adaptFor(goalKey, week, total)];
  if(!a) return null;
  const n = total || weekCount(), ph = phaseOf(week, n);
  const hi = Math.min(a.pct[1], 95);                   // never a true 1RM for a multi-rep set
  /* Epley's inverse gives the load at which the rep count is MAXIMAL — reps in reserve zero.
     The app prescribes RPE 5–9 alongside it, so reading the percentage straight off the rep
     target asked for a load 2.5–7.5% of 1RM too heavy: at 12 reps and RPE 5 the lifter cannot
     both reach twelve and stop five short. The load is taken from the reps the set WOULD run
     to failure — prescribed reps plus the reps left in reserve. */
  const rir = Math.max(0, Math.min(6, 10 - (+String(rpe || '').replace(/\D+/g, '').slice(-1) || 8)));
  const eff = Math.max(1, (reps || a.reps[0]) + rir);
  /* Power is velocity work: the point is bar speed, not proximity to a maximum, so it sits in
     the lower half of its wide band and climbs a little across the blocks rather than pinning
     to the top of it. Your own note — the right load depends heavily on the movement. */
  if(a === ADAPT.power){
    const lo = a.pct[0], span = (a.pct[1] - lo) * 0.55;
    const t = ph === 3 ? 0 : Math.min(1, blockIndex(week, n) / 2);
    return Math.round((lo + span * t) / 2.5) * 2.5;
  }
  let p = pctForReps(eff);
  /* An easy week is a real reduction in load, so it is allowed BELOW the band — clamping it
     to the band floor cancelled the reduction outright. Effort also outranks the band on a
     normal week: %1RM is a guide, and reps plus proximity to failure are the real control, so
     a small undershoot of the floor is honest where forcing the floor would not be. */
  if(ph === 3) return Math.round(Math.max(35, Math.min(hi, p * 0.85)) / 2.5) * 2.5;
  return Math.round(Math.max(a.pct[0] - 7.5, Math.min(hi, p)) / 2.5) * 2.5;
}
/* Reps in reserve is the same statement as RPE from the other end: RIR ≈ 10 − RPE. */
function rirFrom(rpeText){
  const m = String(rpeText || '').match(/(\d+)(?:\s*–\s*(\d+))?/);
  if(!m) return '1–2 RIR';
  const lo = +m[1], hi = m[2] ? +m[2] : lo;
  const a = Math.max(0, 10 - hi), b = Math.max(0, 10 - lo);
  return (a === b ? a : a + '–' + b) + ' RIR';
}
function loadText(kind, goalKey, week, total, reps, rpeText){
  if(kind === 'bw') return 'bodyweight';
  if(kind === 'rir') return rirFrom(rpeText);
  const p = loadPct(goalKey, week, total, reps, rpeText);
  return p ? p + '% 1RM' : rirFrom(rpeText);
}
function loadKindOf(m){
  if(!m) return 'rir';
  if(/^plyo/.test(m.p || '')) return 'bw';
  /* Nobody has a one-rep max for a plank or a carry, so a percentage of one is meaningless —
     "3×30s · 57.5% 1RM" is not a prescription. Effort is the currency for a hold. */
  if(isTimedMove(m)) return 'rir';
  /* A band is not bodyweight and has no percentage to take: its tension is ascending and
     unmeasurable, so effort is the only honest currency for it. */
  if(isBandMove(m)) return 'rir';
  if(!kitFor(m).some(k=>LOADABLE.indexOf(k) > -1)) return 'bw';
  return (m.tier || 2) <= 2 ? 'pct' : 'rir';
}
/* A max the lifter entered wins over one estimated from history: they know whether a set was
   a true effort and the estimate does not. */
/* A max is read from the log, not asked for. Typing one in is guesswork that then silently
   governs every percentage in the program, and it goes stale the moment the lifter gets
   stronger. The best set ever recorded for a movement — across the current block and every
   archived one — is turned into an estimated 1RM, so the number tracks training on its own. */
function maxOf(exName){
  let est = 0;
  try{ est = bestOfAll(exName) || 0; }catch(e){ est = 0; }
  return Math.round(est);
}
/* The set the estimate came from, so the number is always attributable. */
function maxDetail(exName){
  let best = null;
  try{
    allHistory().sessions.forEach(s=>{
      const e = (s.entries || {})[exName];
      if(!e || !e.length) return;
      const t = topSet(e), v = e1rm(t.w, t.r);
      if(v > 0 && (!best || v > best.e1rm)) best = { e1rm:v, w:t.w, r:t.r, date:s.date, sets:e.length };
    });

}
/* Every movement with a logged best, heaviest first — the lifter's own record book. */
function trackedMaxes(){
  const out = {};

    allHistory().sessions.forEach(s=>{
      Object.keys(s.entries || {}).forEach(k=>{
        const e = s.entries[k];
        if(!e || !e.length) return;
        const t = topSet(e), v = e1rm(t.w, t.r);
        if(v > 0 && (!out[k] || v > out[k].e1rm)) out[k] = { n:k, e1rm:v, w:t.w, r:t.r, date:s.date };

}

function pctLifts(){ return CORE_LIFTS.slice(); }
/* Any movement in the bank can carry a max — searched, not listed. */
/* Every lift with a logged best, searchable — the lifter's own record book rather than a form
