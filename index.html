/* Plan reads top to bottom the way a training week is actually held in the head: what am I
   doing each day, then what exactly does each of those sessions ask for. The week grid comes
   first — Monday through Sunday, lifts and runs together, so a rest day and a double day are
   both visible at a glance — and the movement-by-movement breakdown sits under it. */
function viewPlan(){
  if(!state.plan.length) return '<h1 class="page">No program yet</h1><p class="sub">Build one from the Build tab.</p>';
  const n = weekCount(), names = weekNamesNow(), w = ui.planWeek || state.week;
  const rows = weekRows(w);
  const bi = blockIndex(w, n), bp = BLOCK_PHASE[bi];
  const wname = String(names[w - 1] || '').replace(/^Wk \d+ · /, '').split(' · ')[0];

  let h = driftBanner();
  h += '<h1 class="page">Plan</h1>';
  h += '<p class="sub">Week ' + w + ' of ' + n + '.' +
    (w !== state.week ? ' Previewing — you are training week ' + state.week + '.' : '') + '</p>';
  h += '<button class="mini whylink" onclick="openWeekWhy()">What this week trains ›</button>';
  const pq = (ui.planQ || '').trim().toLowerCase();
  h += '<div class="plsearch"><input type="search" id="plq" value="' + esc(ui.planQ || '') +
    '" placeholder="Find a movement in this block" oninput="setPlanQ(this.value)" autocomplete="off">' +
    (pq ? '<button class="mini" onclick="setPlanQ(\'\')">Clear</button>' : '') + '</div>';

  /* One dash per week, each carrying the colour of the quality that week trains, filled once
     the week is complete. A block is legible as a whole at a glance — the warm-up weeks, the
     heavy stretch, the deload — and it stays tappable, so it is picker and progress at once.
     Twelve numbered circles could do neither. */
  h += '<div class="wkpick">' + Array.from({ length:n }, (_, i)=>{
    const k = i + 1, st = weekStats(k);
    const full = st.planned && st.done >= st.planned;
    return '<button class="wkdash' + (k === w ? ' on' : '') + (full ? ' full' : '') +
      '" style="--wq:' + qualityVar(k) + '" onclick="setPlanWeek(' + k + ')"' +
      ' aria-label="Week ' + k + (full ? ', complete' : '') + '">' +
      '<span class="wkno num">' + k + '</span><i></i></button>';
  }).join('') + '</div>';
  h += '<div class="blockline">Wk ' + w + ' · ' + esc(wname || bp.label) + ' · block ' + (bi + 1) + '</div>';

  /* the week at a glance, lifts and runs together */
  const runGoalLabel = (RUN_GOALS[state.runGoal] || {}).label || '';
  h += '<div class="panel calpanel"><div class="rowsplit">' +
    '<div class="kicker">Your training week</div>' +
    '<button class="mini" onclick="openManageSchedule()">Manage schedule</button></div>' +
    (runGoalLabel ? '<div class="tiny dim" style="margin-top:2px">' + esc(runGoalLabel) + '</div>' : '') +
    '<div class="wkgrid">' + rows.map(r=>{
      const d = r.lift ? state.plan.find(x=>x.name === r.lift) : null;
      const rest = !r.lift && !r.run;
      const runLine = r.run ? [
        r.run.miles ? (+r.run.miles).toFixed(r.run.miles < 10 ? 2 : 1).replace(/\.00$/, '') + ' mi' + (r.lift ? ' total' : '') : '',
        r.run.detail || '',
        r.run.pace || '',
        r.run.est ? 'about ' + Math.round(r.run.est) + ' min' : ''
      ].filter(Boolean).join(' · ') : '';
      return '<div class="wkrow' + (rest ? ' rest' : '') + '">' +
        '<div class="wkday">' + esc(r.label) + '</div>' +
        '<div class="wkwhat">' +
          (r.lift ? '<button class="wklift" onclick="openPlanDay(' + (d ? d.id : 0) + ')">' +
            '<span class="name">' + esc(r.lift) + '</span></button>' : '') +
          (r.run ? '<div class="wkrun' + (r.lift ? ' plus' : '') + '">' +
            (r.lift ? '' : '<span class="name">' + esc(r.run.label || 'Run') + '</span>') +
            '<span class="tiny dim">' + (r.lift ? '+ ' + esc(r.run.label || 'run') + ' — ' : '') +
            esc(runLine) + '</span></div>' : '') +
          (rest ? '<div class="restword">Rest</div>' : '') +
        '</div></div>';
    }).join('') + '</div>';
  const note = scheduleNote();
  if(note) h += '<p class="tiny dim" style="margin-top:11px;line-height:1.55">' + esc(note) + '</p>';
  h += '</div>';

  /* then every session, movement by movement — for the week being VIEWED. Reading d.exercises
     showed whichever stage the current week happens to point at, so scrolling to week 5 showed
     week 5's targets against week 1's movements, and the progressions looked absent. */
  const stageIdx = stageOf(w);
  state.plan.forEach(d0=>{
    const list = (d0.stages && d0.stages.length)
      ? d0.stages[Math.min(d0.stages.length - 1, stageIdx)] : d0.exercises;
    const d = { id:d0.id, name:d0.name, exercises:list, dayIdx:d0.dayIdx };
    /* Every session opened at full length, so a four-day week was a screen and a half of
       prescriptions to scroll past before reaching the next day. They fold now, with the day
       you are training open — the summary above says what each one is, which is enough to
       decide whether to look inside. */
    const role = roleOf(d0, w);
    const shownEx = pq ? d.exercises.filter(ex=>ex.name.toLowerCase().indexOf(pq) > -1) : d.exercises;
    if(pq && !shownEx.length) return;                       // nothing here matches
    const open = pq ? true
      : (ui.planOpen === undefined ? (d0.id === ui.dayId) : ui.planOpen === d0.id);
    /* Where this session stands. A week row carries a weekday index, not a date, and only
       the week actually being trained maps onto the calendar — browsing week 6 in week 2
       must not claim a session is due today. */
    const rowFor = (weekRows(w) || []).find(r=>r.lift === d0.name);
    const rowISO = (w === state.week && rowFor) ? isoOfWeekday(rowFor.i) : null;
    const dDone = rowISO && state.sessions.some(x=>x.date === rowISO);
    const dToday = rowISO === todayISO();
    const pill = dDone ? '<span class="pill done"><i></i>Done</span>'
      : dToday ? '<span class="pill now"><i></i>Today</span>'
      : '<span class="pill soon"><i></i>Planned</span>';
    h += '<div class="panel daycard' + (open ? ' open' : '') + '" style="--rq:' + roleVar(d0, w) + '">' +
      '<button class="dchead" onclick="togglePlanDay(' + d0.id + ')" aria-expanded="' + open + '">' +
      '<span class="dctile plan">' + dayGlyph(d) + '</span>' +
      '<span class="dcmain"><span class="rowsplit">' +
      '<span class="dayname">' + esc(d.name) + '</span>' +
      '<span class="dchmeta">' + pill +
      '<span class="tiny" style="color:var(--rq)">' + esc(dayTimeLabel(d, w)) + '</span></span></span>' +
      '<span class="tiny dim" style="display:block;margin-top:3px">' +
      (role ? '<span class="rolet">' + esc(role.key) + '</span> · ' : '') +
      (pq ? shownEx.length + ' of ' + d.exercises.length + ' movements match'
          : d.exercises.length + ' movements · warm-up included') +
      ((d0.stages || []).length > 1 ? ' · block ' + (stageIdx + 1) + ' movements' : '') + '</span></span>' +
      '<span class="dcchev">⌄</span></button>';
    h += '<div class="dcbody"><div class="dcinner">';
    h += shownEx.map(ex=>{
      const t = withEstimate(ex, tgt(ex, w));
      const rpe = rpeOf(t);
      const m = byName[ex.name];
      const [lo, hi] = restFor(ex, w, d.exercises.indexOf(ex));
      const q = "'" + esc(ex.name).replace(/'/g, "\\'") + "'";
      const g0 = m && m.g && m.g[0];
      const dot = g0 && window.groupHue
        ? '<i class="exdot" style="background:' + window.groupHue(g0) + '"></i>' : '';
      return '<div class="exrow">' +
        '<button class="exname" onclick="openMovement(' + q + ')">' + dot + esc(ex.name) +
        ' <span class="exchev">›</span></button>' +
        '<div class="extarget">' + esc(t) + '</div>' +
        (rpe ? '<div class="tiny dim">' + esc(rpeNote(t)) + '</div>' : '') +
        '<div class="tiny dim">Rest ' + lo + '–' + hi + ' seconds</div>' +
        (ex.burnout || ex.ssAfter ? '<div class="tiny dim">' + esc(ex.note || '') + '</div>' : '') +
        '</div>';
    }).join('');
    /* Nothing in Plan writes state. Browsing ahead to see what is coming must never move the
       program the client is actually training — a week-6 prescription arriving in week 1 is a
       load they have not built to. Advancing a week is a deliberate act and lives on Today. */
    h += '</div></div></div>';
  });
  return h;
}

/* ── The trend, drawn ─────────────────────────────────────────────────────────
   A number and a percentage cannot show you a plateau, a peak or the week it stalled;
   the shape of the thing is the information. One bar per logged session, scaled inside
   the lift's own range so the movement is visible rather than flattened against zero,
   with the mean drawn across as a dashed line. Bars grow from the baseline on arrival —
   quick, once, and never on scroll. */
function trendChart(pts, colour){
  const show = pts.slice(-24);
  const vals = show.map(p=>p.v);
  const hi = Math.max.apply(null, vals), lo = Math.min.apply(null, vals);
  const floor = Math.max(0, lo - (hi - lo) * 0.35 - 1);   // headroom, so a small gain still reads
  const span = Math.max(1, hi - floor);
  const mean = vals.reduce((a, b)=>a + b, 0) / vals.length;
  const meanPct = Math.round((mean - floor) / span * 100);
  return '<div class="chart" style="--cq:' + colour + '">' +
    '<div class="chartavg" style="bottom:' + Math.max(4, Math.min(96, meanPct)) + '%">' +
      '<span>avg ' + Math.round(mean) + '</span></div>' +
    '<div class="bars">' + show.map((p, i)=>{
      const pc = Math.max(6, Math.round((p.v - floor) / span * 100));
      const best = p.v === hi;
      return '<i class="' + (best ? 'best' : '') + '" style="--h:' + pc + '%;--d:' +
        Math.min(140, i * 14) + 'ms" title="' + esc(fmtDate(p.d)) + ' — ' + p.v + ' lb"></i>';
    }).join('') + '</div></div>';
}
/* An empty range still draws its frame. Hiding the chart when there is nothing in it makes the

function emptyChart(){

}

  }

    });
    if(!pts.length) return '';
    const best = Math.max.apply(null, pts.map(p=>p.v)), first = pts[0].v, last = pts[pts.length - 1].v;

      '<div class="tiny dim" style="margin-top:4px">' + pts.length + ' session' + (pts.length === 1 ? '' : 's') +
      (pts.length > 1 ? ' · ' + (delta >= 0 ? '+' : '') + delta + '% since the first' : '') + '</div>' +
      (pts.length > 1 ? trendChart(pts, col) : '') + '</div>';

  if(!nums) return 10;
  /* The top of the range, not its midpoint. A range of 8–12 seeded at 10 gives a lifter who can
     do 12 no reason to, and the midpoint of an odd span produced the odd numbers that made the
     targets look arbitrary. Prescribing the ceiling means reducing is a decision the lifter makes

  const pct = ui.rest.total ? Math.max(0, Math.min(100, 100 - left / ui.rest.total * 100)) : 0;

const LOWER_SYMPTOM_REGIONS = ['knee','hip','ankle','lowback'];
const SYMPTOM_WINDOW = 10;        // days a symptom stays "active" without a fresh entry

const WHY = {
  readiness:'Sleep, soreness, energy and stress are the cheapest honest read on whether you can recover from what the program prescribes today. A poor night or a stressful week lowers your tolerance for load whether or not you feel it in the gym — so on those days the smart move is to keep the stimulus and trim the cost. This is ordinary autoregulation: the plan sets the direction, today\u2019s readiness sets the dose.',
  symptom:'A movement rating of pain, tracked over weeks, turns \u201cmy knee\u2019s been off\u201d into a line you can actually read — is it settling, holding, or climbing with load? Anything at 4/10 or above, or pain that lingers past a session, is worth respecting: keep it inside a pain-free range, drop the aggravating set, and swap for a tolerated pattern rather than pushing through.',
  cluster:'Tuesday through Thursday is where running mileage and lower-body lifting overlap, so the legs carry the most accumulated fatigue of the week right when they\u2019re asked to do the most. It\u2019s the highest-risk window in the block by design, which is why a sub-par readiness score or an active lower-limb symptom counts for more on those days than on a fresh Monday.'
};

/* ── readiness scoring ── */
function todayReadiness(){ const t = todayISO(); return (state.readiness || []).slice().reverse().find(r=>r.date === t) || null; }
function readinessScore(r){
  if(!r) return null;
  const v = READINESS_Q.map(q=>+r[q.k] || 0).filter(x=>x > 0);
  if(!v.length) return null;
  const avg = v.reduce((a,b)=>a+b,0) / v.length;   // 1..5
  return Math.round(((avg - 1) / 4) * 100 / 5) * 5; // 0..100, snapped to 5
}
function readinessBand(score){
  if(score === null) return { key:'none', label:'Not checked', col:'var(--color-neutral-500)' };
  if(score >= 80) return { key:'green',  label:'Primed',    col:'#1e8a5f' };
  if(score >= 60) return { key:'steady', label:'Steady',    col:'#a8801c' };
  if(score >= 40) return { key:'amber',  label:'Guarded',   col:'#c2621c' };
  return             { key:'red',    label:'Depleted',  col:'#c2185b' };
}

/* ── active symptoms: latest entry per region inside the window, severity ≥ 1 ── */
function activeSymptoms(){
  const cut = new Date(todayISO() + 'T12:00:00'); cut.setDate(cut.getDate() - SYMPTOM_WINDOW);
  const seen = {};
  (state.symptoms || []).slice().sort((a,b)=> a.date < b.date ? 1 : -1).forEach(s=>{
    if(seen[s.region]) return;
    if(new Date(s.date + 'T12:00:00') < cut) return;
    if((+s.sev || 0) < 1) return;
    seen[s.region] = s;
  });
  return Object.values(seen);
}
function sevBand(sev){
  if(sev >= 7) return { key:'high', label:'high', col:'#c2185b' };
  if(sev >= 4) return { key:'mod',  label:'moderate', col:'#c2621c' };
  return           { key:'mild', label:'mild', col:'#a8801c' };
}

/* ── today's day + whether it loads the lower limb, and the fatigue-cluster test ── */
function todaysDay(){ return day(ui.dayId) || (state.plan && state.plan[0]) || null; }
function dayGroups(d){
  const set = new Set();
  ((d && d.exercises) || []).forEach(ex=> (groupsOf(ex.name) || []).forEach(g=>set.add(g)));
  return set;
}
function dayLoadsLower(d){
  const g = dayGroups(d);
  return ['quads','hamstrings','glutes','calves'].some(x=>g.has(x));
}
function inLowerCluster(){ const dw = dowOf(todayISO()); return dw === 2 || dw === 3 || dw === 4; } // Tue–Thu

/* ── the one call that turns readiness + symptoms + the calendar into an instruction ── */
function autoReg(){
  const d = todaysDay();
  if(!d) return null;
  const score = readinessScore(todayReadiness());
  const band  = readinessBand(score);
  const active = activeSymptoms();

  // movements in today's session that a currently-active symptom implicates
  const dg = dayGroups(d);
  const flags = [];
  active.forEach(s=>{
    if((+s.sev || 0) < 4) return;                         // mild aches don't drive the session
    const reg = SYMPTOM_REGIONS[s.region]; if(!reg) return;
    const hits = ((d.exercises) || []).map(e=>e.name)
      .filter(n=> (groupsOf(n) || []).some(g=> reg.groups.indexOf(g) > -1));
    if(hits.length || reg.groups.length === 0) flags.push({ region:s.region, label:reg.label, sev:+s.sev, moves:hits });
  });

  // level 0 clear · 1 trim · 2 pull back · 3 technique/flush day
  let level = 0;
  if(band.key === 'amber') level = 1;
  if(band.key === 'red')   level = 2;
  flags.forEach(f=>{ if(f.sev >= 4) level = Math.max(level, 1); if(f.sev >= 7) level = Math.max(level, 2); });

  // the Tue–Thu lower-limb window escalates a sub-par read rather than creating one
  const cluster = inLowerCluster() && dayLoadsLower(d) &&
    (level >= 1 || active.some(s=> LOWER_SYMPTOM_REGIONS.indexOf(s.region) > -1 && (+s.sev||0) >= 3));
  if(cluster && level >= 1) level = Math.min(3, level + 1);

  const HEAD = [
    score !== null && score >= 85 ? 'Cleared — room to push the top set' : 'Cleared to train as written',
    'Trim the edges today',
    'Pull the load back',
    'Make it a technique day'
  ];
  const BODY = [
    score !== null && score >= 85
      ? 'Everything reads green. If a top set feels genuinely easy you\u2019ve earned a little more — otherwise run it as prescribed.'
      : 'Nothing flagged. Run the session as written and let RPE do its job.',
    'Drop the last working set on your heaviest movements and hold the top set about a point below your usual RPE. Same movements, a little less cost.',
    'Cut the back-off sets, cap everything around RPE 6\u20137 and leave 3\u20134 reps in the tank. You\u2019re banking recovery, not chasing a number.',
    'Light and submaximal only — pain-free range, crisp technique, no grinding. A flush session keeps the habit without adding fatigue you can\u2019t pay back.'
  ];
  return { level, score, band, flags, cluster,
    head:HEAD[level], body:BODY[level],
    showEmpty: score === null && !flags.length };
}

/* ══════════ TODAY CARD ══════════ */
function readinessCard(){
  if(!state.plan || !state.plan.length) return '';
  const r = todayReadiness();
  const score = readinessScore(r);
  const band = readinessBand(score);
  const ar = autoReg();

  // not checked in yet → a single quiet prompt, nothing more
  if(score === null){
    let h = '<div class="panel" style="border-color:var(--color-divider)">' +
      '<div class="rowsplit"><div class="kicker">Readiness</div>' +
      '<button class="linkq" onclick="whySheet(\'readiness\')">Why?</button></div>' +
      '<p class="sub" style="margin:6px 0 0">A 20-second check-in on sleep, soreness, energy and stress sets today\u2019s dose. The program says what to train; this says how hard.</p>' +
      '<div class="brow" style="margin-top:12px"><button class="b pri" onclick="openReadiness()">Check in</button>' +
      '<button class="b quiet" onclick="openSymptom()">Log a symptom</button></div></div>';
    return h + postSessionPrompt();
  }

  // checked in → score, band, the instruction, active symptoms
  const ring = 'conic-gradient(' + band.col + ' ' + score + '%, var(--color-divider) 0)';
  let h = '<div class="panel" style="border-color:' + band.col + '55">' +
    '<div class="rowsplit"><div class="kicker" style="color:' + band.col + '">Readiness · ' + band.label + '</div>' +
    '<button class="linkq" onclick="whySheet(\'readiness\')">Why?</button></div>' +
    '<div class="rdrow">' +
      '<div class="rdring" style="background:' + ring + '"><span class="num">' + score + '</span></div>' +
      '<div class="rdinstr"><div class="rdhead" style="color:' + (ar ? ar.band.col : band.col) + '">' +
        esc(ar ? ar.head : band.label) + '</div>' +
        '<div class="sub" style="margin-top:3px">' + esc(ar ? ar.body : '') + '</div></div>' +
    '</div>';

  if(ar && ar.cluster){
    h += '<div class="rdnote"><b>Fatigue window.</b> Tue\u2013Thu overlaps running and leg work, so a sub-par day counts for more here. ' +
      '<button class="linkq" onclick="whySheet(\'cluster\')">Why?</button></div>';
  }

  if(ar && ar.flags.length){
    h += '<div class="sect" style="margin-top:12px"><div class="kicker">Working around</div>' +
      ar.flags.map(f=>{
        const b = sevBand(f.sev);
        const moves = f.moves.length ? f.moves.slice(0,3).map(esc).join(', ') + (f.moves.length > 3 ? '\u2026' : '') : 'nothing in today\u2019s session';
        return '<div class="listrow"><div><div class="name">' + esc(f.label) +
          ' <span class="sevpill" style="background:' + b.col + '22;color:' + b.col + '">' + f.sev + '/10 ' + b.label + '</span></div>' +
          '<div class="tiny dim" style="margin-top:2px">' + (f.moves.length
            ? 'Loads today: ' + moves + ' — keep pain-free range, drop the aggravating set or swap the pattern.'
            : 'Not loaded by today\u2019s movements. Keep monitoring.') + '</div></div></div>';
      }).join('') + '</div>';
  }

  h += autoRegControl(ar);
  h += '<div class="brow" style="margin-top:14px">' +
    '<button class="b quiet" onclick="openReadiness()">Update check-in</button>' +
    '<button class="b quiet" onclick="openSymptom()">Log a symptom</button></div></div>';
  return h + postSessionPrompt();
}

/* a gentle post-session nudge, shown only the day a session was finished and only
   until a symptom is logged or it's dismissed — no overlay stacking on the summary */
function postSessionPrompt(){
  if(ui.justFinished !== todayISO()) return '';
  const already = (state.symptoms || []).some(s=>s.date === todayISO());
  if(already) return '';
  return '<div class="panel" style="border-color:var(--color-accent)55">' +
    '<div class="kicker" style="color:var(--color-accent)">Since you just trained</div>' +
    '<p class="sub" style="margin:6px 0 0">Anything twinge, pinch or ache in that session? Logging it now — even a mild 2/10 — is what makes the trend worth reading later.</p>' +
    '<div class="brow" style="margin-top:12px"><button class="b pri" onclick="openSymptom()">Log how it felt</button>' +
    '<button class="b quiet" onclick="dismissPostSession()">Nothing to report</button></div></div>';
}
function dismissPostSession(){ ui.justFinished = null; render(); }

/* ══════════ READINESS SHEET ══════════ */
function openReadiness(){
  const cur = todayReadiness() || {};
  ui.rdDraft = { sleep:+cur.sleep || 0, sore:+cur.sore || 0, energy:+cur.energy || 0, stress:+cur.stress || 0 };
  const ov = sheet('<h4>How are you today?</h4>' +
    '<p class="sub" style="margin:2px 0 12px">Tap each — worst on the left, best on the right.</p>' +
    '<div id="rdbody"></div>' +
    '<button class="b pri" id="rdok" style="margin-top:6px">Save check-in</button>' +
    '<button class="b quiet" id="rdno">Cancel</button>');
  const paint = ()=>{
    ov.querySelector('#rdbody').innerHTML = READINESS_Q.map(q=>
      '<div class="rdq"><div class="rowsplit"><div class="name">' + q.label + '</div></div>' +
      '<div class="rdscale">' + [1,2,3,4,5].map(v=>
        '<button class="rdchip' + (ui.rdDraft[q.k] === v ? ' on' : '') + '" onclick="setReadiness(\'' + q.k + '\',' + v + ')">' + v + '</button>'
      ).join('') + '</div>' +
      '<div class="rowsplit tiny dim"><span>' + esc(q.lo) + '</span><span>' + esc(q.hi) + '</span></div></div>'
    ).join('');
  };
  paint(); ov._paint = paint;
  ov.querySelector('#rdno').onclick = ()=>{ ui.rdDraft = null; ov.remove(); };
  ov.querySelector('#rdok').onclick = async ()=>{
    const filled = READINESS_Q.filter(q=>ui.rdDraft[q.k] > 0);
    if(filled.length < READINESS_Q.length){ toast('Answer all four'); return; }
    const t = todayISO();
    state.readiness = (state.readiness || []).filter(x=>x.date !== t);
    const entry = { date:t, sleep:ui.rdDraft.sleep, sore:ui.rdDraft.sore, energy:ui.rdDraft.energy, stress:ui.rdDraft.stress };
    entry.score = readinessScore(entry);
    state.readiness.push(entry);
    ui.rdDraft = null; ov.remove();
    normalizeData(); await save(); render();
    toast('Readiness ' + entry.score + ' · dose set for today');
  };
}
function setReadiness(k, v){ if(!ui.rdDraft) return; ui.rdDraft[k] = v; const ov = document.querySelector('.ov'); if(ov && ov._paint) ov._paint(); }

function setSy(k, v){ if(!ui.syDraft) return; ui.syDraft[k] = (k === 'context' && ui.syDraft.context === v) ? null : v; const ov = document.querySelector('.ov'); if(ov && ov._paint) ov._paint(); }

/* ══════════ WELLNESS TRENDS (prepended to the Progress charts) ══════════ */
function wellSpark(pts, colour, invert, hiRef){
  if(!pts.length) return '';
  const vals = pts.map(p=>p.v);
  const hi = hiRef || Math.max.apply(null, vals), lo = 0;
  const span = Math.max(1, hi - lo);
  return '<div class="chart" style="--cq:' + colour + '"><div class="bars">' + pts.map((p,i)=>{
    const pc = Math.max(6, Math.round((p.v - lo) / span * 100));
    return '<i style="--h:' + pc + '%;--d:' + Math.min(140, i*14) + 'ms" title="' + esc(fmtDate(p.d)) + ' — ' + p.v + (invert ? '/10' : '') + '"></i>';
  }).join('') + '</div></div>';
}
function wellnessTrends(){
  const rd = (state.readiness || []).slice(-24).map(r=>({ d:r.date, v:r.score != null ? r.score : readinessScore(r) })).filter(p=>p.v != null);
  const active = activeSymptoms();
  const hasSy = (state.symptoms || []).length;
  if(!rd.length && !hasSy) return '';

  let h = '<div class="sect"><div class="secth"><div class="kicker">Readiness &amp; symptoms</div></div>';

  if(rd.length){
    const last = rd[rd.length-1].v, avg = Math.round(rd.reduce((a,p)=>a+p.v,0)/rd.length);
    const band = readinessBand(last);
    h += '<div class="panel"><div class="rowsplit"><div class="name">Readiness</div>' +
      '<div class="num" style="color:' + band.col + '">' + last + '</div></div>' +
      '<div class="tiny dim" style="margin-top:4px">' + rd.length + ' check-in' + (rd.length===1?'':'s') + ' · ' + avg + ' average</div>' +
      (rd.length > 1 ? wellSpark(rd, band.col, false, 100) : '') + '</div>';
  }

  // one panel per region ever logged, newest first, with its own severity line
  const regions = [...new Set((state.symptoms || []).map(s=>s.region))];
  regions.forEach(reg=>{
    const pts = (state.symptoms || []).filter(s=>s.region === reg).sort((a,b)=> a.date < b.date ? -1 : 1).map(s=>({ d:s.date, v:+s.sev||0 }));
    if(!pts.length) return;
    const cur = active.find(s=>s.region === reg);
    const last = pts[pts.length-1], b = sevBand(last.v);
    const trendTxt = pts.length > 1
      ? (last.v < pts[0].v ? 'settling' : last.v > pts[0].v ? 'climbing — watch the load' : 'holding')
      : 'first entry';
    h += '<div class="panel"><div class="rowsplit"><div class="name">' + esc(SYMPTOM_REGIONS[reg] ? SYMPTOM_REGIONS[reg].label : reg) +
      (cur ? '' : ' <span class="tiny dim">(quiet)</span>') + '</div>' +
      '<div class="num" style="color:' + b.col + '">' + last.v + '/10</div></div>' +
      '<div class="tiny dim" style="margin-top:4px">' + pts.length + ' entr' + (pts.length===1?'y':'ies') + ' · ' + trendTxt + '</div>' +
      (pts.length > 1 ? wellSpark(pts, b.col, true, 10) : '') + '</div>';
  });

  return h + '</div>';
}

/* ══════════ ONE-TAP AUTOREGULATION ══════════
   The readiness instruction stops being advice and becomes a button. Apply writes a today-only
   override that trims a set from the movements that need it and caps the effort; nothing in the
   program or the log is rewritten, and Undo removes it. The set trim lands through targetSetCount,
   so both the Today tally and the session build see it. */
function autoRegPlan(){
  const ar = autoReg(); if(!ar || ar.level < 1) return null;
  const d = todaysDay(); if(!d) return null;
  const names = (d.exercises || []).map(e=>e.name);
  const flagged = new Set();
  ar.flags.forEach(f=> (f.moves || []).forEach(n=>flagged.add(n)));
  /* level 1 touches the primaries and anything a symptom flags; 2 and 3 pull the whole session
     back, since a depleted or high-symptom day is not one to spend on accessories either. */
  const moves = ar.level === 1
    ? [...new Set([...names.slice(0, 2), ...flagged])]
    : names.slice();
  const rpeCap = ar.level >= 3 ? 6 : ar.level === 2 ? 7 : null;
  return { level:ar.level, moves, setDrop:1, rpeCap };
}
function autoRegActive(){
  const o = state.autoreg;
  return (o && o.date === todayISO() && o.dayId === ui.dayId) ? o : null;
}
function autoRegDelta(ex){
  const o = autoRegActive(); if(!o) return 0;
  const nm = (ex && ex.name) || '';
  return (o.moves || []).indexOf(nm) > -1 ? -(o.setDrop || 0) : 0;
}
async function autoRegApply(){
  const p = autoRegPlan(); if(!p) return;
  state.autoreg = { date:todayISO(), dayId:ui.dayId, level:p.level, moves:p.moves, setDrop:p.setDrop, rpeCap:p.rpeCap };
  /* If the session is already open, trim undone working sets on the affected movements now — never
     below one working set, and never a set already ticked off. */
  if(ui.sess && ui.sess.dayId === ui.dayId){
    p.moves.forEach(nm=>{
      const rows = ui.sess.sets[nm]; if(!rows) return;
      let drop = p.setDrop;
      for(let k = rows.length - 1; k >= 0 && drop > 0; k--){
        if(rows.filter(r=>!r.warm).length <= 1) break;
        if(!rows[k].warm && !rows[k].done){ rows.splice(k, 1); drop--; }
      }
    });
    writeOpenSession();
  }
  await save(); render();
  toast('Session adjusted for today');
}
function autoRegClear(){ state.autoreg = null; saveNow(); render(); toast('Keeping today as written'); }
function autoRegControl(ar){
  if(!ar || ar.level < 1) return '';
  const o = autoRegActive();
  if(o){
    const list = (o.moves || []).slice(0, 3).map(esc).join(', ') + ((o.moves || []).length > 3 ? '\u2026' : '');
    return '<div class="rdapply on"><div class="name">Adjusted for today</div>' +
      '<div class="tiny dim" style="margin-top:3px">One set trimmed on ' + (list || 'today\u2019s work') +
      (o.rpeCap ? ' \u00b7 hold everything \u2264 RPE ' + o.rpeCap : '') + '. Your logged sets are untouched.</div>' +
      '<div class="brow" style="margin-top:10px"><button class="b quiet" onclick="autoRegClear()">Undo</button></div></div>';
  }
  const plan = autoRegPlan();
  const capTxt = plan && plan.rpeCap ? ' and caps the effort at RPE ' + plan.rpeCap : '';
  return '<div class="rdapply"><div class="brow">' +
    '<button class="b pri" onclick="autoRegApply()">Apply it for me</button>' +
    '<button class="b quiet" onclick="autoRegClear()">Keep as written</button></div>' +
    '<div class="tiny dim" style="margin-top:8px">One tap trims the suggested set' +
    (plan && plan.moves.length > 1 ? 's' : '') + ' from today\u2019s session' + capTxt +
    ' \u2014 nothing you\u2019ve logged changes.</div></div>';
}
function autoRegSessBanner(ex){
  if(!ui.sess) return '';
  const o = state.autoreg;
  if(!o || o.date !== todayISO() || o.dayId !== ui.sess.dayId) return '';
  const hit = (o.moves || []).indexOf(ex.name) > -1;
  if(!hit && !o.rpeCap) return '';
  const bits = [];
  if(hit) bits.push('one less set today');
  if(o.rpeCap) bits.push('keep it \u2264 RPE ' + o.rpeCap);
  return '<div class="sessauto">Readiness-adjusted \u00b7 ' + bits.join(' \u00b7 ') + '</div>';
}

/* ══════════════════════════════════════════════════════════════════════════════
   PERFORMANCE-BASED PROGRESSION  (the individualisation engine)
   The program prescribes reps and effort; the person's own logged sets decide the
   weight and WHEN it moves. Everything here is derived from state.sessions — nothing
   new is stored beyond an optional one-tap effort rating, so it can never drift from
   the record. The lever is chosen by movement type: load for weighted work, reps then
   a harder variation for bodyweight, duration for holds.

   The ratchet, per movement, read from its own history:
     hit the reps, easy          → progress now (it was under-dosed)
     hit the reps, solid         → bank a credit; progress once enough are earned
     hit the reps, hard          → hold and consolidate
     missed the reps, or grind   → hold; twice in a row → deload ~10%
   Earned threshold: 1 clean session for a beginner, 2 for intermediate and up.
   A weekly speed limit caps how fast any one movement can climb, whatever it earns.
   ══════════════════════════════════════════════════════════════════════════════ */

const EFFORT = {
  easy:  { label:'Easy',  rank:0, note:'had plenty left' },
  solid: { label:'Solid', rank:1, note:'about right' },
  hard:  { label:'Hard',  rank:2, note:'tough but clean' },
  grind: { label:'Grind', rank:3, note:'maximal or missed reps' }
};
const EFFORT_ORDER = ['easy','solid','hard','grind'];
function earnedThreshold(){ return (setup.exp === 'beginner') ? 1 : 2; }

/* the rep target that was prescribed for a movement in a given week — so a session is judged
   against what it was actually asked to do, not against this week's different wave */
function targetRepsAt(exName, week){
  const ex = state.plan.flatMap(d=>d.exercises || []).find(e=>e.name === exName);
  if(!ex) return null;
  const wv = waveReps(ex, week);
  if(wv && wv.length) return wv[0];
  const nums = String(rawTarget(ex, week)).match(/\d+/g);
  if(!nums) return 10;
  return nums.length > 1 ? Math.max(+nums[0], +nums[1]) : +nums[0];
}

/* one movement's recent outcomes, newest first, each already judged hit/effort */
function progHistory(exName, limit){
  const out = [];
  /* Every block counts. progHistory used to read state.sessions, which archiveCurrent() empties
     when a program is filed away — so building a new block silently threw away the earned weight
     and re-seeded the lift from a percentage, handing back weeks of progress. The 1RM estimate
     already read the archive; the ratchet does now too. */
  const all = allHistory().sessions;
  for(let i = all.length - 1; i >= 0 && out.length < (limit || 5); i--){
    const s = all[i];
    const e = (s.entries || {})[exName];
    if(!e || !e.length) continue;
    const work = e.filter(x=>!x.warm);
    if(!work.length) continue;
    const top = work.reduce((a, b)=> (b.w > a.w || (b.w === a.w && b.r > a.r)) ? b : a);
    const tR = targetRepsAt(exName, s.week) || top.r;
    const hit = top.r >= tR && work.every(x=> x.r >= Math.max(1, tR - 1));
    /* How hard it felt is the brake on the whole ratchet, and the tap that records it is
       optional — so what silence means decides how the app behaves for most people. Reading
       silence as "solid" made every session the lifter simply finished an earned one, which is
       an unbounded linear progression wearing an autoregulation costume: it waits for a missed
       rep instead of preventing one. Silence is now read from the reps themselves, which are
       objective. Beating the top of the prescribed range by two or more is real evidence of
       reps in reserve and counts as easy; merely finishing is provisional — marked assumed, and
       loadRec asks for one more clean session before it moves the bar. */
    const tapped = (s.efforts || {})[exName] || null;
    const eff = tapped || (!hit ? 'grind' : (top.r >= tR + 2 ? 'easy' : 'solid'));
    out.push({ date:s.date, week:s.week, w:+top.w || 0, r:+top.r || 0, targetR:tR, hit, eff,
      assumed: !tapped, dosed: !!s.autoreg });
  }
  return out;
}

/* how big a load step this movement takes — scaled by size, floored ~2.5% and ceilinged ~10%
   so it stays proportional whether it's a 315 lb squat or a 15 lb lateral raise */
function loadStep(exName, w){
  const m = byName[exName], g = (m && m.g) || [];
  const lower = g.some(x=>['quads','hamstrings','glutes','calves'].indexOf(x) > -1);
  let inc = lower ? 10 : 5;
  inc = Math.max(inc, Math.round(w * 0.025 / 2.5) * 2.5);        // heavy lifters get a real bump
  inc = Math.min(inc, Math.max(2.5, Math.round(w * 0.10 / 2.5) * 2.5));  // light work isn't jerked up
  return Math.max(2.5, Math.round(inc / 2.5) * 2.5);
}

/* the weekly speed limit: a movement can't be seeded more than ~10% over its recent best,
   so a mis-logged rep or a fluke can't spike the load */
function speedCap(exName, target, floor){
  const recent = progHistory(exName, 3).map(h=>h.w).filter(x=>x > 0);
  if(!recent.length) return target;
  let ceiling = Math.round(Math.max.apply(null, recent) * 1.10 / 2.5) * 2.5;
  /* Rounding the 10% ceiling to the nearest plate put it BELOW the current weight on light
     work — under 12.5 lb, 110% rounds back down to where you already are — so the cap and the
     step cancelled and the lift held forever however well it went. The ceiling is never allowed
     below one honest increment above the current load. */
  if(floor != null) ceiling = Math.max(ceiling, floor);
  return Math.min(target, ceiling);
}

/* THE RATCHET — for a loaded movement, what weight to put on the bar next, and why */
function loadRec(exName){
  /* A day the readiness check deliberately lightened is not evidence about the weight: the
     lifter was told to pull back, so clearing it earns nothing and it must not become the base
     the next session is figured from. Dosed days that went well drop out; a dosed day they
     still ground through stays, because that IS information. */
  const h = progHistory(exName, 6).filter(x=> !(x.dosed && x.hit));
  if(!h.length || !h[0].w) return null;             // first exposure — let the default seed stand
  const last = h[0], w = last.w, step = loadStep(exName, w);
  const up = () => Math.max(w, speedCap(exName, w + step, w + 2.5));

  if(last.eff === 'grind' || !last.hit){
    const prevBack = h[1] && (h[1].eff === 'grind' || !h[1].hit);
    if(prevBack){
      const dl = Math.max(2.5, Math.round(w * 0.90 / 2.5) * 2.5);
      return { w:dl, action:'deload', why:'Two hard sessions in a row, so this eases back about 10%. Rebuild from here — the dip is short.' };
    }
    return { w:w, action:'hold', why:'You came up short last time, so this holds the weight. Own these reps before it moves.' };
  }
  /* Below about 17 lb the smallest plate in the room IS a big relative jump — 5 to 7.5 lb is
     fifty percent. The increment cannot be made smaller, so it is made harder to earn instead:
     a step that large asks for one more clean session than a proportionate one would. Isolation
     and rehab work lives at exactly these loads, and that is where an unearned jump hurts. */
  const bigStep = (step / w) > 0.15;
  if(last.eff === 'easy'){
    const ok = !bigStep || (h[1] && h[1].w === w && h[1].hit && (h[1].eff === 'easy' || h[1].eff === 'solid'));
    if(!ok) return { w:w, action:'hold',
      why:'You had room, but the smallest step available here is ' + Math.round(step / w * 100) + '% of the weight. One more clean session and it moves.' };
    const nw = up();
    return nw > w ? { w:nw, action:'progress', why:'You hit every rep with room to spare, so it goes up ' + (nw - w) + ' lb. Earned, not scheduled.' }
                  : { w:w, action:'hold', why:'You had room, but this is as fast as it should climb this week. It moves next time.' };
  }
  if(last.eff === 'hard'){
    return { w:w, action:'hold', why:'You hit your reps, but it was a real fight — so bank this weight once more before adding.' };
  }
  /* solid + hit → count consecutive earned sessions AT THIS WEIGHT. The streak used to run
     straight through a weight change, so the threshold only ever bit once in a lift's life:
     after the first bump an intermediate progressed every session, exactly like a beginner,
     while the screen said "one more clean session at this weight". It now counts what it says
     it counts. A streak resting on assumed efforts — sessions where nobody tapped how it felt —
     asks for one extra clean session before the bar moves. */
  let earns = 0, assumed = false;
  for(const x of h){
    if(x.w !== w) break;
    if(x.hit && (x.eff === 'solid' || x.eff === 'easy')){ earns++; if(x.assumed) assumed = true; }
    else break;
  }
  const bar = earnedThreshold() + (assumed ? 1 : 0) + (bigStep ? 1 : 0);
  if(earns >= bar){
    const nw = up();
    return nw > w ? { w:nw, action:'progress', why:'Clean reps ' + earns + ' session' + (earns === 1 ? '' : 's') + ' running at ' + w + ' lb — it goes up ' + (nw - w) + ' lb.' }
                  : { w:w, action:'hold', why:'Earned, but this is as fast as it should climb this week. It moves next time.' };
  }
  const need = bar - earns;
  return { w:w, action:'hold', why:'Solid work. ' + need + ' more clean session' + (need === 1 ? '' : 's') + ' at ' + w + ' lb and it goes up.' +
    (bigStep ? ' The smallest step here is ' + Math.round(step / w * 100) + '% of the weight, so it is worth being sure.' : '') +
    (assumed ? ' Tap how a set felt and it can move sooner — an untapped session counts, just more cautiously.' : '') };
}

/* Bodyweight and holds progress by reps/seconds rather than load — but reps are not an open
   ended climb. They rise to the top of the goal's range (volume), and only then does complexity
   take over: the movement itself levels up, and reps rebuild from the bottom of a harder pattern.
   Without the ceiling, a bodyweight squat drifts to forty reps and quietly becomes endurance work
   the goal never called for. */
function repCeiling(exName){
  const ex = state.plan.flatMap(d=>d.exercises || []).find(e=>e.name === exName) || { name:exName };
  const t = targetReps(ex);
  return t && t > 0 ? t : 15;
}
function repRec(exName, baseReps){
  const h = progHistory(exName, 4);
  if(!h.length) return null;
  const last = h[0], m = byName[exName];
  const ceiling = repCeiling(exName);
  const cur = Math.min(ceiling, Math.max(last.r || 0, baseReps || 0));
  if(last.eff === 'grind' || !last.hit){
    /* Two bad sessions running is the same signal that earns a loaded lift its 10% deload. There
       is no weight to take off a bodyweight movement, so the equivalent is the rung below — and
       if the kit has no easier rung, say so plainly rather than showing nothing at all. */
    const backTo = (h[1] && (h[1].eff === 'grind' || !h[1].hit) && !isTimedMove(m)) ? prevVariation(exName) : null;
    if(backTo) return { r:cur, action:'regress', next:backTo.n,
      why:'Two sessions short of the target now. There is no weight to strip off a bodyweight movement, so the honest step is back to ' + backTo.n + ' — own the reps there and climb again. Grinding a movement you cannot control yet buys nothing.' };
    return { r:cur, action:'hold', why:'You came up short of ' + (last.targetR || cur) + ', so the target holds here until the reps come clean. Quality first, then the count.' };
  }
  let earns = 0; for(const x of h){ if(x.hit && x.eff !== 'hard' && x.eff !== 'grind') earns++; else break; }
  const earned = last.eff === 'easy' || earns >= earnedThreshold();
  const atTop = Math.max(last.r || 0, baseReps || 0) >= ceiling;
  if(earned && atTop){
    /* Reps are pinned at the top of the range and earned — volume has done its job. Complexity is
       the next lever, but only if a genuinely harder rung exists on this pattern and tissue.
       Otherwise the honest move is to hold: never invent a progression, never push reps into junk. */
    const nxt = (m && loadKindOf(m) === 'bw' && !isTimedMove(m)) ? nextVariation(exName) : null;
    if(nxt) return { r:ceiling, action:'levelup', next:nxt.n,
      why:'You own ' + ceiling + ' clean reps here — the top of the range. Time to level the movement up to ' + nxt.n + ', where you rebuild from the bottom and start overloading again. Changing it sooner would trade progress for variety.' };
    return { r:ceiling, action:'hold',
      why:'You\u2019ve maxed the reps and there\u2019s no harder version in your kit to step up to — hold here and keep every rep clean.' };
  }
  if(earned) return { r:Math.min(ceiling, cur + 1), action:'progress',
    why:'You cleared these, so add a rep. Reps climb to ' + ceiling + ', then the movement itself levels up — that\u2019s how bodyweight work keeps overloading.' };
  return { r:cur, action:'hold', why:'Solid — a clean session or two more and the reps step up.' };
}
/* The next rung: one skill step up, same pattern and same primary tissue, still bodyweight, inside
   this lifter's technical ceiling and clear of flagged injuries and kit. The smallest legitimate
   jump, so complexity rises one honest notch — never a leap onto something unearned. */
function nextVariation(exName){
  const m = byName[exName];
  if(!m || loadKindOf(m) !== 'bw' || isTimedMove(m)) return null;
  const curSkill = m.skill || 2, groups = m.g || [];
  const gate = x => (SKILL_PREF[setup.exp] || SKILL_PREF.intermediate)[(x.skill || 2) - 1] > -50;
  const cands = BANK.filter(x =>
    x.n !== exName && loadKindOf(x) === 'bw' && !isBandMove(x) &&
    x.p === m.p && (x.g || []).some(g => groups.indexOf(g) > -1) &&
    (x.skill || 2) > curSkill && equipPick(x).include &&
    !(x.x || []).some(k => (setup.injuries || []).indexOf(k) > -1) && gate(x)
  ).sort((a, b) => ((a.skill || 2) - (b.skill || 2)) || ((a.tier || 2) - (b.tier || 2)) || a.n.localeCompare(b.n));
  return cands[0] || null;
}
/* The rung below. The ladder only ever went up, so a lifter who could not hit the prescribed
   reps on a bodyweight movement was held there indefinitely — a loaded lift in the same position
   gets a 10% deload after two bad sessions, and bodyweight got nothing to step back onto. Same
   pattern, same tissue, one skill step easier, still inside their kit and clear of injuries. */
function prevVariation(exName){
  const m = byName[exName];
  if(!m || loadKindOf(m) !== 'bw' || isTimedMove(m)) return null;
  const curSkill = m.skill || 2, groups = m.g || [];
  const gate = x => (SKILL_PREF[setup.exp] || SKILL_PREF.intermediate)[(x.skill || 2) - 1] > -50;
  const cands = BANK.filter(x =>
    x.n !== exName && loadKindOf(x) === 'bw' && !isBandMove(x) &&
    x.p === m.p && (x.g || []).some(g => groups.indexOf(g) > -1) &&
    (x.skill || 2) < curSkill && equipPick(x).include &&
    !(x.x || []).some(k => (setup.injuries || []).indexOf(k) > -1) && gate(x)
  ).sort((a, b) => ((b.skill || 2) - (a.skill || 2)) || ((a.tier || 2) - (b.tier || 2)) || a.n.localeCompare(b.n));
  return cands[0] || null;
}
/* Earned complexity step, opt-in. Reuses the manual-swap path so the new movement persists into the
   plan and the session rebuilds its sets from the harder movement — which, being harder, seeds
   fewer earned reps and rebuilds the pattern before overloading it again. */
async function levelUp(exName){
  if(!ui.sess) return;
  const nxt = nextVariation(exName);
  if(!nxt){ toast('Nothing harder to step up to — hold here'); return; }
  const d = day(ui.sess.dayId);
  const raw = (d.exercises || []).find(x => x.name === exName);
  if(!raw) return;
  /* Swap the exact movement directly — not through the fuzzy search resolver — and regenerate its
     prescription for the new movement so reps and effort fit it. The swap persists into the plan;
     the session's cached sets are cleared so they rebuild from the harder movement's own range. */
  const gk = goalForTier(nxt.tier, nxt.p);
  ui.sess.swaps[exName] = nxt.n;
  raw.name = nxt.n; raw.note = nxt.note; raw.goal = gk;
  raw.targets = genTargets(3, gk, weekCount(), nxt.p, nxt.tier, d.dayIdx || 0, 0, loadKindOf(nxt), nxt.n);
  if(ui.sess.sets) delete ui.sess.sets[exName];
  const i = (d.exercises || []).findIndex(x => x.name === nxt.n);
  if(i > -1) ui.sess.i = i;
  writeOpenSession(); await save(); render();
  toast('Leveled up to ' + nxt.n + ' — rebuild the pattern, then overload it again');
}

/* Stepping back down the same ladder. Deliberately opt-in like levelUp — the app proposes it,
   the lifter decides; nothing is swapped out from under them mid-session. */
async function levelDown(exName){
  if(!ui.sess) return;
  const prv = prevVariation(exName);
  if(!prv){ toast('Nothing easier to step back to — keep the reps clean and hold here'); return; }
  const d = day(ui.sess.dayId);
  const raw = (d.exercises || []).find(x => x.name === exName);
  if(!raw) return;
  const gk = goalForTier(prv.tier, prv.p);
  ui.sess.swaps[exName] = prv.n;
  raw.name = prv.n; raw.note = prv.note; raw.goal = gk;
  raw.targets = genTargets(3, gk, weekCount(), prv.p, prv.tier, d.dayIdx || 0, 0, loadKindOf(prv), prv.n);
  if(ui.sess.sets) delete ui.sess.sets[exName];
  const i = (d.exercises || []).findIndex(x => x.name === prv.n);
  if(i > -1) ui.sess.i = i;
  writeOpenSession(); await save(); render();
  toast('Stepped back to ' + prv.n + ' — own this one, then climb again');
}

/* what the seed hooks call */
function progLoadSeed(ex){
  const m = byName[ex.name];
  if(!m || loadKindOf(m) === 'bw' || isTimedMove(m)) return null;
  return loadRec(ex.name);
}
function progRepSeed(ex, baseReps){
  const m = byName[ex.name];
  if(!m) return null;
  if(loadKindOf(m) !== 'bw' && !isTimedMove(m)) return null;
  return repRec(ex.name, baseReps);
}

/* ── effort capture (one optional tap) ── */
function setEffort(exName, tag){
  if(!ui.sess) return;
  ui.sess.effort = ui.sess.effort || {};
  ui.sess.effort[exName] = (ui.sess.effort[exName] === tag) ? null : tag;
  writeOpenSession(); renderSession();
}
function effortRow(ex){
  if(!ui.sess) return '';
  const cur = (ui.sess.effort || {})[ex.name] || null;
  const done = ((ui.sess.sets || {})[ex.name] || []).some(r=>r.done && !r.warm);
  return '<div class="effort' + (done ? ' lit' : '') + '"><div class="rowsplit"><span class="tiny dim">' +
    (cur ? 'How that felt' : 'How did that feel? <span style="opacity:.7">(optional — it sharpens your next weight)</span>') +
    '</span></div><div class="effchips">' +
    EFFORT_ORDER.map(t=>'<button class="effchip' + (cur === t ? ' on ' + t : '') +
      '" onclick="setEffort(\'' + jsq(ex.name) + '\',\'' + t + '\')">' + EFFORT[t].label + '</button>').join('') +
    '</div></div>';
}

/* ── the suggested-weight line shown above the sets ── */
function progSuggestLine(ex){
  const m = byName[ex.name]; if(!m) return '';
  if(loadKindOf(m) === 'bw' || isTimedMove(m)){
    const rr = progRepSeed(ex, targetReps(ex));
    if(!rr) return '';
    if(rr.action === 'levelup'){
      return '<div class="progline levelup"><span class="progtag">\u2b06 Ready to level up \u2014 ' + esc(rr.next) + '</span>' +
        '<button class="proglvl" onclick="levelUp(\'' + jsq(ex.name) + '\')">Level up</button>' +
        '<button class="linkq" onclick="whyProg(\'' + jsq(ex.name) + '\')">why?</button></div>';
    }
    if(rr.action === 'regress'){
      return '<div class="progline regress"><span class="progtag">\u2b07 Step back \u2014 ' + esc(rr.next) + '</span>' +
        '<button class="proglvl" onclick="levelDown(\'' + jsq(ex.name) + '\')">Step back</button>' +
        '<button class="linkq" onclick="whyProg(\'' + jsq(ex.name) + '\')">why?</button></div>';
    }
    /* A hold used to render nothing at all, so the one lifter who most needed telling why the
       number was not moving was the only one shown no reason. */
    if(rr.action === 'hold'){
      const unitH = isTimedMove(m) ? 's' : ' reps';
      return '<div class="progline hold"><span class="progtag">\u2192 hold ' + rr.r + unitH + '</span>' +
        '<button class="linkq" onclick="whyProg(\'' + jsq(ex.name) + '\')">why?</button></div>';
    }
    const unit = isTimedMove(m) ? 's' : ' reps';
    return '<div class="progline ' + rr.action + '"><span class="progtag">Target ' + rr.r + unit + '</span>' +
      '<button class="linkq" onclick="whyProg(\'' + jsq(ex.name) + '\')">why?</button></div>';
  }
  const lr = progLoadSeed(ex);
  if(!lr) return '';
  const arrow = lr.action === 'progress' ? '\u2191' : lr.action === 'deload' ? '\u2193' : '\u2192';
  const word = lr.action === 'progress' ? 'up to' : lr.action === 'deload' ? 'ease to' : 'stay at';
  return '<div class="progline ' + lr.action + '"><span class="progtag">' + arrow + ' ' + word + ' ' + lr.w + ' lb</span>' +
    '<button class="linkq" onclick="whyProg(\'' + jsq(ex.name) + '\')">why?</button></div>';
}
function whyProg(exName){
  const ex = state.plan.flatMap(d=>d.exercises || []).find(e=>e.name === exName) || { name:exName };
  const m = byName[exName];
  const rec = (m && (loadKindOf(m) === 'bw' || isTimedMove(m))) ? progRepSeed(ex, targetReps(ex)) : progLoadSeed(ex);
  const body = rec ? rec.why
    : 'This is your first time logging ' + esc(exName) + '. Log a set or two and the app learns your working weight, then adjusts it from what you actually lift.';
  sheet('<h4>Why this number</h4><p class="sub" style="margin:6px 0 14px;line-height:1.55">' + esc(body) +
    '</p><p class="tiny dim" style="margin:0 0 14px;line-height:1.5">The program sets your reps and how hard each set should feel. The weight is yours — it moves when you earn it, and holds when you don\u2019t.</p>' +
    '<button class="b pri" onclick="closeSheets()">Got it</button>');
}


/* ══════════ EARNED-PROGRESS ACKNOWLEDGMENT ══════════
   When a lift has earned a bump, the client should feel the moment — and understand it. At the
   start of the session we surface every movement whose weight (or reps) just went up, each with
   the plain reason it moved, and one button to take it in. The point is not the celebration; it
   is teaching them, session by session, that their program is reading their body specifically. */
function progReveals(dayId){
  const d = day(dayId); if(!d) return [];
  const out = [];
  (d.exercises || []).forEach(ex=>{
    const m = byName[ex.name]; if(!m) return;
    const bw = loadKindOf(m) === 'bw' || isTimedMove(m);
    let rec; try{ rec = bw ? progRepSeed(ex, targetReps(ex)) : progLoadSeed(ex); }catch(e){ rec = null; }
    if(!rec || rec.action !== 'progress') return;              // only the wins get the moment
    const val = rec.w != null ? rec.w : rec.r;
    const unit = isTimedMove(m) ? 's' : bw ? ' reps' : ' lb';
    const sig = 'p:' + val;
    if((state.progAck || {})[ex.name] === sig) return;         // already taken in
    out.push({ name:ex.name, val, unit, why:rec.why, sig });
  });
  return out;
}
function maybeRevealProgress(){
  const list = progReveals(ui.dayId);
  if(!list.length) return;
  ui.progReveal = list;
  progRevealSheet();
}
function ackProgress(){
  state.progAck = state.progAck || {};
  (ui.progReveal || []).forEach(r=>{ state.progAck[r.name] = r.sig; });
  ui.progReveal = null;
  closeSheets(); saveNow(); render();
}
function progRevealSheet(){
  const list = ui.progReveal || []; if(!list.length) return;
  const rows = list.map(r=>
    '<div class="earnrow"><div class="earnhead"><span class="earnname">' + esc(r.name) + '</span>' +
    '<span class="earnval">\u2191 ' + r.val + r.unit + '</span></div>' +
    '<div class="tiny dim" style="margin-top:4px;line-height:1.45">' + esc(r.why) + '</div></div>').join('');
  const many = list.length > 1;
  sheet('<div class="earnkicker">' + (many ? list.length + ' lifts earned it' : 'You earned it') + '</div>' +
    '<h4 style="margin:3px 0 5px">' + (many ? 'Your weights moved' : 'Your weight moved') + '</h4>' +
    '<p class="sub" style="margin:0 0 14px">Last session earned ' + (many ? 'these' : 'this') + '. Today ' + (many ? 'they go' : 'it goes') + ' up.</p>' +
    rows +
    '<p class="tiny dim" style="margin:14px 2px 16px;line-height:1.5">This is your program tuning itself to what you actually lift \u2014 earned by your own reps and effort, not handed out on a schedule. Keep logging honestly and it keeps learning your body.</p>' +
    '<button class="b pri wide" onclick="ackProgress()">Let\u2019s train</button>');
}

/* ══════════ EDUCATION ══════════ */

// ---- Session -> muscle map (matches your PPL split; edit freely) ----
  /* One colour per group, assigned so groups that TOUCH on the body are far apart
     in hue. Running the hues head-to-foot read tidily in a legend but put amber
     shoulders beside citron arms — neighbours in both position and colour, which is
     the hardest case to tell apart. Every adjacency below is a wide hue jump:
     shoulders/arms amber→blue, chest/shoulders red→amber, glutes/hamstrings
     orange→magenta, quads/hamstrings teal→magenta, back/glutes green→orange. */
  /* Same hues as the dark set, moved down in lightness so they carry on white. The
     adjacency spacing is what matters and it is unchanged: no two muscle groups that
     touch on the body sit within 55° of each other. */
  const GROUP_HUE = {
    shoulders:'#b8860b',   // amber
    arms:'#1f6fb2',        // blue
    chest:'#c2185b',       // crimson
    core:'#7b3fbf',        // violet
    back:'#1e8a5f',        // green
    glutes:'#c2621c',      // orange
    quads:'#0f8a86',       // teal
    hamstrings:'#b0369e',  // magenta
    calves:'#4a54c4'       // indigo
  };
  const NS = 'http://www.w3.org/2000/svg';
  const SLUG_SET = new Set(['chest','front-deltoids','side-deltoids','back-deltoids','biceps','triceps','forearm','trapezius','lats','upper-back','rotator-cuff','lower-back','abs','obliques','quadriceps','hamstring','gluteal','adductor','calves','soleus']);
  const SLUGS = {
    chest:['chest'],
    back:['trapezius','upper-back','lower-back','lats'],
    shoulders:['front-deltoids','back-deltoids','side-deltoids','rotator-cuff'],
    arms:['biceps','triceps','forearm'],
    core:['abs','obliques'],
    quads:['quadriceps'],
    hamstrings:['hamstring','adductor'],
    glutes:['gluteal','abductors'],
    calves:['calves','left-soleus','right-soleus','soleus']
  };
  const SLUG_GROUP = {};
  Object.keys(SLUGS).forEach(g=>SLUGS[g].forEach(s=>{ SLUG_GROUP[s] = g; }));
  const hueOf = g => GROUP_HUE[g] || 'var(--muscle-lit)';
  window.groupHue = hueOf;              // the plan lists read the same key as the body map

  function mapSvg(side, lit){
    let s = '';
    const groups = MUSCLE_DATA[side];
    for(const m in groups){
      const on = lit.has(m);
      const col = on ? hueOf(SLUG_GROUP[m]) : '';
      groups[m].forEach(pts=>{
        s += '<polygon points="' + pts + '" class="mm' + (on ? ' on' : '') + '"' +
          (col ? ' style="--lit:' + col + '"' : '') + ' data-m="' + m + '"></polygon>';
      });
    }
    return '<svg viewBox="0 0 100 200" width="100%">' + s + '</svg>';
  }
  /* ══ the session's own body map ══
     A muscle map on the Today screen answers "what does this session train". Mid-set the
     question is narrower: what is THIS movement working. The widget lives in its own container
     outside #session, because renderSession() replaces that element's innerHTML on every set
     tick — mounting inside it would build and tear down a WebGL context several times a minute,
     and browsers cap those at about sixteen. Here the figure is mounted once when the session
     opens and only re-lit as you move between movements. */
  let sessM = { handle:null, key:null, mounting:false };
  const slugsForGroups = gs => {
    const set = new Set();
    (gs || []).forEach(g=>(SLUGS[g] || []).forEach(x=>set.add(x)));
    return set;
  };
  window.disposeSessionModel = function(){
    if(sessM.handle){ try{ sessM.handle.dispose(); }catch(e){} }
    sessM = { handle:null, key:null, mounting:false };
    const host = document.getElementById('sessmodel');
    if(host) host.innerHTML = '';
  };
  window.renderSessionModel = function(){
    const host = document.getElementById('sessmodel');
    if(!host) return;
    if(!ui.sess){ window.disposeSessionModel(); return; }
    const ex = sessEx(ui.sess.i || 0);
    if(!ex || !ex.name){ window.disposeSessionModel(); return; }

    if(!ui.mm3show){
      window.disposeSessionModel();
      host.innerHTML = '<button class="mm3peek ' + ui.mm3side + '" onclick="toggleSessModel()" ' +
        'aria-label="Show the muscles this movement trains">Muscles</button>';
      return;
    }
    const m = byName[ex.name];
    const groups = (m && m.g && m.g.length) ? m.g : (groupsOf(ex.name) || []);
    const lit = slugsForGroups(groups);
    const key = ex.name;

    /* rebuild the shell only when it is not already there; re-light on every movement change */
    if(!host.querySelector('.mm3sess')){
      host.innerHTML =
        '<div class="mm3sess ' + ui.mm3side + '">' +
          '<div class="mm3sesshead">' +
            '<button class="mm3btn" onclick="flipSessModel()" aria-label="Move to the other side">\u21c4</button>' +
            '<button class="mm3btn" onclick="toggleSessModel()" aria-label="Hide the muscle map">\u2715</button>' +
          '</div>' +
          '<div class="mm3sessstage"></div>' +
          '<div class="mm3sesslabel"></div>' +
        '</div>';
      sessM = { handle:null, key:null, mounting:false };
    }
    const wrap = host.querySelector('.mm3sess');
    wrap.classList.toggle('left', ui.mm3side === 'left');
    wrap.classList.toggle('right', ui.mm3side !== 'left');
    const label = host.querySelector('.mm3sesslabel');
    if(label) label.innerHTML = groups.length
      ? groups.map(g=>'<span style="color:' + (hueOf(g) || 'inherit') + '">' + esc((GROUPS[g] && GROUPS[g].label) || g) + '</span>').join(' · ')
      : '<span class="dim">whole body</span>';

    const stage = host.querySelector('.mm3sessstage');
    if(sessM.handle){                                    // mounted already — just re-light it
      if(sessM.key !== key){ sessM.handle.setLit(lit); sessM.key = key; }
      return;
    }
    /* A mount is asynchronous, and renderSession() can fire several times while it is in
       flight — without this guard each one starts its own, and a handful of movement changes
       burns through the browser's WebGL context budget. */
    if(sessM.mounting){ sessM.key = key; return; }
    sessM.key = key;
    if(!hasWebGL()){ stage.innerHTML = '<div class="mm3flat">' + mapSvg('anterior', lit) + '</div>'; return; }
    sessM.mounting = true;
    mountModel(stage, lit, { inline:true, pad:1.16, spin:0.0016 })
      .then(h=>{
        sessM.mounting = false;
        if(!stage.isConnected || !ui.mm3show || !ui.sess){ h.dispose(); return; }
        sessM.handle = h;
        /* the movement may have changed while it was building — light what is current */
        const cur = sessEx(ui.sess.i || 0);
        const cm = cur && byName[cur.name];
        if(cur && cur.name !== key){
          h.setLit(slugsForGroups((cm && cm.g && cm.g.length) ? cm.g : (groupsOf(cur.name) || [])));
          sessM.key = cur.name;
        }
      })
      .catch(()=>{ sessM.mounting = false;
        stage.innerHTML = '<div class="mm3flat">' + mapSvg('anterior', lit) + '</div>'; });
  };
  window.paintBody = function(){
    const card = document.getElementById('bodycard');
    if(!card) return;
    const d = day(ui.dayId) || state.plan[0];
    if(!d){ card.remove(); return; }
    const restNow = !weekRows(state.week)[dowOf(todayISO())].lift;
    const regions = new Set(), lit = new Set();
    d.exercises.forEach(ex=>{
      const m = byName[ex.name];
      ((m && m.g) || groupsOf(ex.name)).forEach(g=>{
        regions.add(g);
        (SLUGS[g] || []).forEach(s=>lit.add(s));
      });
    });
    const names = Array.from(regions);
    /* Which groups are showing. Null means all of them; a tap narrows it so you
       can see exactly what one group covers. Reset when the day's groups change. */
    const key = names.slice().sort().join(',');
    if(ui.bodyKey !== key){ ui.bodyKey = key; ui.bodyOff = []; }
    const off = new Set(ui.bodyOff || []);
    const active = names.filter(g=>!off.has(g));
    const shown = new Set();
    active.forEach(g=>(SLUGS[g] || []).forEach(s=>shown.add(s)));
    const head =
      '<div class="rowsplit"><div class="kicker">' + (ui.dayId === d.id && !restNow ? 'Today trains' : 'Next session trains') + '</div>' +
        '<div class="tiny dim">' + esc(d.name.replace(/\s*\(.*\)$/,'')) + '</div></div>';
    const chips = '<div class="chipwrap">' + names.map(g=>
      '<button class="chip mmg' + (off.has(g) ? '' : ' on') + '" data-g="' + esc(g) +
      '" style="--lit:' + hueOf(g) + '"><i class="mmdot"></i>' +
      ((GROUPS[g] && GROUPS[g].label) || g) + '</button>').join('') +
      (off.size ? '<button class="chip mmall">Show all</button>' : '') + '</div>';

    /* Anything mounted last time is on a node about to be replaced — free its
       WebGL context before building the new one. */
    if(inlineHandle){ inlineHandle.dispose(); inlineHandle = null; }

    // the flat map, kept as the offline and no-WebGL fallback
    const flat = ()=>{
      const turned = card.dataset.turned === '1';
      card.innerHTML = head +
        '<div class="mmstage"><div class="mmturn' + (turned ? ' back showback' : '') + '">' +
          '<div class="mmface front">' + mapSvg('anterior', shown) + '</div>' +
          '<div class="mmface rear">' + mapSvg('posterior', shown) + '</div>' +
        '</div></div>' +

      wireTurn(card);

      const b3 = card.querySelector('.mm3d');
      if(b3) b3.onclick = ()=> open3D(shown, active);
    };

    const wireChips = ()=>{
      const retint = ()=>{
        const nOff = new Set(ui.bodyOff || []);
        const act = names.filter(g=>!nOff.has(g));
        const set = new Set();
        act.forEach(g=>(SLUGS[g] || []).forEach(s=>set.add(s)));
        card.querySelectorAll('.mmg').forEach(c=>
          c.classList.toggle('on', !nOff.has(c.getAttribute('data-g'))));
        const wrap = card.querySelector('.chipwrap');
        let all = card.querySelector('.mmall');
        if(nOff.size && !all){
          all = document.createElement('button');
          all.className = 'chip mmall'; all.textContent = 'Show all';
          wrap.appendChild(all); all.onclick = ()=>{ ui.bodyOff = []; retint(); };
        } else if(!nOff.size && all) all.remove();
        const big = card.querySelector('.mm3big') || card.querySelector('.mm3d');
        if(big) big.onclick = ()=> open3D(set, act);
        if(inlineHandle){ inlineHandle.setLit(set); return true; }
        return false;
      };
      card.querySelectorAll('.mmg').forEach(b=>{
        b.onclick = ()=>{
          const g = b.getAttribute('data-g');
          const cur = new Set(ui.bodyOff || []);
          if(cur.has(g)) cur.delete(g); else cur.add(g);
          if(cur.size >= names.length) cur.delete(g);        // never blank the figure entirely
          ui.bodyOff = Array.from(cur);

        };

      if(all0) all0.onclick = ()=>{ ui.bodyOff = []; if(!retint()) paintBody(); };
    };

    if(!hasWebGL()){ flat(); return; }

    card.innerHTML = head +
      '<div class="mm3stage"><div class="mm3load tiny dim">Loading the model…</div></div>' +
      '<div class="mmfoot"><button class="mini mm3big">Expand ›</button>' +
        '<span class="tiny dim">Drag to turn</span></div>' + chips;
    card.querySelector('.mm3big').onclick = ()=> open3D(shown, active);
    wireChips();
    const stage = card.querySelector('.mm3stage');
    mountModel(stage, shown, { inline:true, pad:1.14 })
      .then(hnd=>{ if(stage.isConnected) inlineHandle = hnd; else hnd.dispose(); })
      .catch(()=>{ if(card.isConnected && document.getElementById('bodycard') === card) flat(); });
  };
  let inlineHandle = null;
  let webglOk = null;
  function hasWebGL(){
    if(webglOk !== null) return webglOk;
