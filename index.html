/* ── Band work ───────────────────────────────────────────────────────────────
   A band earns its place as a finisher, not a movement of its own. Every band movement is
   attached to the last movement sharing a muscle group with it; one that cannot find a
   partner is substituted rather than dropped, which would shrink the day and pull a band
   forward into a primary slot. */
const isBandMove = m => /^band/i.test(m.n || '') ||
  (kitFor(m).length === 1 && kitFor(m)[0] === 'bands');
/* Band work is not training the program is built on. Ascending, unmeasurable tension makes it
   too easy to be a stimulus once a loadable option exists, so a band movement is REPLACED by a
   loadable one from the same pattern. The one place it earns is the very end of a lower-body
   day, where a high-rep glute or leg burnout does something no dumbbell does as well. Bands
   also live in the warm-up and in the Mobility tab, which is where the rest of their value is.

   The burnout is deliberately narrow: last position only, glutes or lower body only, one per
   day. Anything else is substituted or dropped. */
/* Band work is not training the program is built on. Ascending, unmeasurable tension makes it
   too easy to be a stimulus once a loadable option exists, so a band movement is REPLACED by a
   loadable one — same pattern where one exists, otherwise anything loadable training the same
   muscle group, because shortening the day is worse than substituting across patterns. Bands
   also live in the warm-up and in the Mobility tab, which is where the rest of their value is.

   The one place a band earns a slot in the session is the END of a lower-body day, as a glute
   or leg burnout: high-rep work under continuous tension that no dumbbell does as well. That
   is APPENDED, not waited for — leaving it to the slot draw meant it never appeared at all. */
const BURNOUT_GROUPS = ['glutes','quads','hamstrings','calves'];
/* Substitute across patterns when the pattern itself has no loadable option — a band triceps
   pressdown has no loadable same-pattern peer in the bank, and dropping it cost Push its only
   direct arm work and left the day three movements shorter than the others. */
function loadableFor(m, inUse, seed){
  const usable = x => !inUse.has(x.n) && !isBandMove(x) && equipPick(x).include &&
    !(x.x || []).some(k=>(setup.injuries || []).indexOf(k) > -1);
  const draw = (pool)=>{
    if(!pool.length) return null;
    pool.sort((a, b)=> (b.tier || 2) - (a.tier || 2));
    return pool[Math.abs(seed) % Math.max(1, Math.min(4, pool.length))] || pool[0];
  };
  /* pickForSlot scores the whole pattern and can hand back the band movement itself, so the
     pattern is searched directly against the bank with bands excluded first. Skipping this
     turned a band triceps pressdown into forearm and grip work, because 'arms' is one tag
     shared by biceps, triceps and forearm. */
  const samePattern = draw(BANK.filter(x=>x.p === m.p && usable(x)));
  if(samePattern) return samePattern;
  const alt = pickForSlot(m.p, seed, inUse, null, wantedGroups(), false);
  if(alt && !isBandMove(alt)) return alt;
  /* No loadable movement shares the pattern. Fall back on the muscle group, but prefer a
     candidate from the same pattern family so triceps work is replaced by triceps work. */
  const groups = m.g || [], fam = String(m.p || '').split('_')[0];
  const byGroup = BANK.filter(x=>usable(x) && (x.g || []).some(g=>groups.indexOf(g) > -1));
  return draw(byGroup.filter(x=>String(x.p || '').split('_')[0] === fam)) || draw(byGroup);
}
function bandFinisherFor(list){
  const have = new Set(list.map(x=>x.name));
  const trains = new Set();
  list.forEach(x=>{ const m = byName[x.name]; (m ? m.g : []).forEach(g=>trains.add(g)); });
  if(!BURNOUT_GROUPS.some(g=>trains.has(g))) return null;      // not a lower-body day
  const pool = BANK.filter(x=>
    !have.has(x.n) && isBandMove(x) && equipPick(x).include &&
    !(x.x || []).some(k=>(setup.injuries || []).indexOf(k) > -1) &&
    (x.g || []).some(g=>BURNOUT_GROUPS.indexOf(g) > -1));
  if(!pool.length) return null;
  const glute = pool.filter(x=>(x.g || []).indexOf('glutes') > -1);
  const pick = (glute.length ? glute : pool);
  return pick[Math.abs((state.seed || 1) * 13 + list.length * 29) % pick.length];
}
function pairBandWork(list){
  const kept = [], inUse = new Set(list.map(x=>x.name));
  list.forEach((item, idx)=>{
    const m = byName[item.name] || item;
    if(!isBandMove(m)){ kept.push(item); return; }
    const alt = loadableFor(m, inUse, (state.seed || 1) * 7 + idx * 97);
    if(alt){ inUse.add(alt.n); kept.push(Object.assign({}, item, { name:alt.n, note:alt.note })); }
    /* Nothing loadable trains this at all under the current kit — leave the slot out rather
       than keep easy work in the middle of a session. */
  });
  /* pairAntagonists returns its input by reference on the non-superset early return, so emptying
     kept before reading it wiped both. Hand it a copy — our kept is then never aliased. */
  const withPairs = pairAntagonists(kept.slice());
  kept.length = 0; withPairs.forEach(x=>kept.push(x));
  const fin = bandFinisherFor(kept);
  if(fin){
    const label = (fin.g || []).indexOf('glutes') > -1 ? 'glutes' : 'legs';
    const m0 = byName[kept[kept.length - 1] && kept[kept.length - 1].name];
    const weeks = Math.max(1, weekCount());
    kept.push({ name:fin.n, burnout:true,
      targets: Array.from({ length:weeks }, ()=> '1×25+ · bodyweight · to the burn'),
      note:'Finisher — one long set for the ' + label + ', high reps to a burn. Not a working set: there is nothing to add load to, so chase the burn and stop there.' });
  }
  return kept;
}


/* Unloadable movements are moved out of the primary slots BEFORE pairing, so pairing never
   has to reorder and no superset is separated from its parent. */
/* Whether a movement can carry the front of a session. primaryOk only asks whether load can be
   added, which a landmine press satisfies — so a tier-2 accessory kept the opening slot and every
   later stage inherited it. A primary slot is only satisfied by a compound when a compound is
   available for that pattern. */
function compoundAvailable(m){
  if(!m) return false;
  return BANK.some(x=>x.p === m.p && (x.tier || 2) === 1 && equipPick(x).include &&
    !(x.x || []).some(k=>(setup.injuries || []).indexOf(k) > -1) &&
    (SKILL_PREF[setup.exp] || SKILL_PREF.intermediate)[(x.skill || 2) - 1] > -50 &&
    (!hasLoadable() || primaryOk(x)));
}
/* Anything usable for this pattern that is not a band. When injuries strip out every compound —
   knee and low back together remove every loaded hinge — the fallback must still be the most
   loadable movement left, not a band. A band opening a leg day is the weakest possible session. */
function betterPrimaryExists(m){
  if(!m) return false;
  const mine = isBandMove(m) ? 0 : (m.tier || 2) === 1 ? 3 : 2;
  return BANK.some(x=>{
    if(x.p !== m.p || x.n === m.n) return false;
    if(!equipPick(x).include) return false;
    if((x.x || []).some(k=>(setup.injuries || []).indexOf(k) > -1)) return false;
    if((SKILL_PREF[setup.exp] || SKILL_PREF.intermediate)[(x.skill || 2) - 1] <= -50) return false;
    if(hasLoadable() && !primaryOk(x)) return false;
    const theirs = isBandMove(x) ? 0 : (x.tier || 2) === 1 ? 3 : 2;
    return theirs > mine;
  });
}
function primaryFit(m){
  if(!m || !primaryOk(m)) return false;
  /* A band never satisfies a primary slot while anything loadable remains. */
  if(isBandMove(m) && hasLoadable() && betterPrimaryExists(m)) return false;
  if((m.tier || 2) === 1) return true;
  return !betterPrimaryExists(m);
}
/* How well a movement can carry the front of a session: a loaded compound above a loaded
   accessory, both above bodyweight, and a band last. */
function primaryRank(m){
  if(!m) return -1;
  if(isBandMove(m)) return 0;
  const loadable = kitFor(m).some(k=>LOADABLE.indexOf(k) > -1);
  if(!loadable) return 1;
  return (m.tier || 2) === 1 ? 4 : (m.tier || 2) === 2 ? 3 : 2;
}
function guardPrimaries(list){
  for(let i = 0; i < Math.min(2, list.length); i++){
    if(primaryFit(byName[list[i].name])) continue;
    /* Take the strongest movement left in the day rather than the first acceptable one — with
       every compound hinge filtered out by an injury, the difference is a band pull-through
       opening leg day versus a loaded single-leg movement that was already in it. */
    let j = -1, bestRank = primaryRank(byName[list[i].name]);
    for(let k = i + 1; k < list.length; k++){
      if(list[k].burnout) continue;
      const r = primaryRank(byName[list[k].name]);
      if(r > bestRank){ bestRank = r; j = k; }
    }
    if(j > -1){ const t = list[i]; list[i] = list[j]; list[j] = t; }
  }
  return list;
}

/* ── Stages ──────────────────────────────────────────────────────────────────
   A workout has to be run more than once before it means anything. Four weeks runs a stage a
   week; anything longer runs each stage twice, then shifts — same patterns and body parts,
   a different movement or the same movement under a different tempo. */
const stageLen = () => (weekCount() <= 4 ? 1 : 2);
const stageCount = () => Math.min(6, Math.ceil(weekCount() / stageLen()));
const stageOf = week => Math.floor((Math.max(1, week || 1) - 1) / stageLen());
function buildStagesFor(d, seedBase){
  /* Stages are derived from the stored list, which already holds the finisher appended last
     time — so a new one accumulated on every version bump, and a bodyweight mobility drill
     could be left carrying a stale burnout flag beside its own working-set target. Clear both
     before deriving anything: exactly one finisher is appended per day per rebuild. */
  const base = guardPrimaries(d.exercises
    .filter(x=>!(x.burnout && isBandMove(byName[x.name] || { n:x.name })))
    .map(x=>{ const c = Object.assign({}, x); delete c.burnout; return c; }));
  /* Stages are derived from the stored exercise list, so a day an earlier version left short
     would stay short for good — a rebuild of stages is not a re-draw. Top it back up from the
     regions the day already trains, the same way buildDay finishes its own draw. */
  const want = Math.min(6, Math.max(4, (state.plan || []).reduce((a, x)=>Math.max(a, (x.exercises || []).length), 0)));
  if(base.length < want){
    const have = new Set(base.map(x=>x.name));
    const regions = new Set();
    base.forEach(x=>{ const m = byName[x.name]; (m ? m.g : []).forEach(g=>regions.add(g)); });
    /* A day's region set comes from its compound lifts, so 'arms' is present on a push day
       even when nothing isolates the triceps. Filling the slot with a second lateral raise
       when one was already there added nothing — patterns already in the day are excluded, and
       a muscle with no isolation work yet is preferred over one that has some. */
    const patterns = new Set();
    const isolated = new Set();
    base.forEach(x=>{ const m = byName[x.name]; if(!m) return;
      patterns.add(m.p);
      if((m.tier || 2) >= 3) (m.g || []).forEach(g=>isolated.add(g));
    });
    const pool = BANK.filter(x=>
      !have.has(x.n) && !isBandMove(x) && equipPick(x).include && !patterns.has(x.p) &&
      !(x.x || []).some(k=>(setup.injuries || []).indexOf(k) > -1) &&
      /* The technical ceiling applies here too. Topping a short day back up ignored it, which is
         how a beginner was handed an archer push-up. */
      (SKILL_PREF[setup.exp] || SKILL_PREF.intermediate)[(x.skill || 2) - 1] > -50 &&
      (x.g || []).some(g=>regions.has(g)))
      .sort((a, b)=>{
        const fresh = y => (y.g || []).some(g=>regions.has(g) && !isolated.has(g)) ? 0 : 1;
        return fresh(a) - fresh(b) || (b.tier || 2) - (a.tier || 2);
      });
    let k = 0;
    while(base.length < want && k < pool.length){
      const m = pool[k++];
      if(have.has(m.n) || patterns.has(m.p)) continue;
      have.add(m.n); patterns.add(m.p);
      (m.g || []).forEach(g=>isolated.add(g));
      const gk = goalForTier(m.tier, m.p);
      base.push({ name:m.n, note:m.note, goal:gk,
        targets:genTargets(m.tier === 1 ? 4 : 3, gk, weekCount(), m.p, m.tier, d.dayIdx || 0, 0, loadKindOf(m), m.n) });
    }
  }
  if(hasLoadable()){
    const held = new Set(base.map(x=>x.name));
    base.slice(0, 2).forEach((x, i)=>{
      const m = byName[x.name];
      if(!m || primaryFit(m)) return;
      held.delete(x.name);
      const alt = pickForSlot(m.p, seedBase + i * 53, held, null, wantedGroups(), true);
      if(alt && primaryFit(alt)){ base[i] = Object.assign({}, x, { name:alt.n, note:alt.note }); held.add(alt.n); }
      else held.add(x.name);
    });
  }
  const ROTATE = 4;
  /* Each stage is reordered independently — the opener guard moves a stronger movement forward,
     and a band finisher is placed after whatever it finishes. Position therefore says nothing
     about which movement replaced which, so the slot a movement occupies is stamped on it and
     carried through every substitution. That is what makes a progression traceable. */
  base.forEach((x, i)=>{ x.slot = i; });
  const history = base.map(x=>new Set([x.name]));
  /* Where each slot currently stands. Candidates used to be judged against the stage-0 movement
     for the whole block, so stage 1 could step up to a barbell variant and stage 2 drop back to a
     dumbbell one — each defensible against the original, but a reduction in load from the week
     before it, which is the opposite of overload. Progression is monotonic: every step is judged
     against what the client actually did last, not against where they started. */
  const cur = base.map(x=>byName[x.name] || null);
  const chains = [], holds = [];
  /* A progression has to be a progression OF something: the same tissue, the same way of
     loading it, and no easier than what it replaces. Swapping a weighted movement for a
     bodyweight one, or a bodyweight one for a band, reads as variety and is actually a
     reduction in stimulus — the client loses the load they had earned and the program stops
     overloading. Modality is therefore held constant and complexity is never allowed to fall. */
  /* pickForSlot returns the single best-scoring movement for a pattern, so once the current one
     is excluded the runner-up is usually rejected by the progression test and the slot keeps
     what it had — which is why an eight-week block ran the same floor press for eight weeks.
     A slot therefore gets an ordered CHAIN of valid progressions built up front, and each stage
     takes the next link: same tissue, same way of loading it, and rising demand. */
  /* How much load a movement can ever carry. A kettlebell deadlift cannot be a progression from
     a trap-bar deadlift — the implement caps it far lower, so the client is handed less absolute
     load and calls it week five. Ranked by implement rather than by exercise so the rule holds
     across the whole bank. */
  const loadCeiling = m => {
    const k = kitFor(m);
    if(k.indexOf('barbell') > -1) return 6;
    if(k.indexOf('machines') > -1 || k.indexOf('cable') > -1) return 4;
    if(k.indexOf('dumbbell') > -1) return 4;
    if(k.indexOf('kettlebell') > -1) return 3;
    if(k.indexOf('bands') > -1) return 1;
    return 2;                                    // bodyweight
  };
  const progressionChain = (m, primary)=>{
    if(!m) return [];
    const gate = k => (SKILL_PREF[setup.exp] || SKILL_PREF.intermediate)[(k || 2) - 1] > -50;
    const groups = m.g || [];
    const usable = x =>
      equipPick(x).include &&
      !(x.x || []).some(k=>(setup.injuries || []).indexOf(k) > -1) &&
      !isBandMove(x) && gate(x.skill) &&
      loadKindOf(x) === loadKindOf(m) &&
      (x.g || []).some(g=>groups.indexOf(g) > -1) &&
      (x.tier || 2) <= (m.tier || 2) &&
      loadCeiling(x) >= loadCeiling(m) &&
      /* A main lift has to be able to carry the session. Tier 2 accessory presses — a landmine
         press, a floor press — belong after the primary work, not in front of it, so a primary
         slot only accepts a movement at least as compound as what it replaces. */
      (!primary || (x.tier || 2) <= Math.min(2, m.tier || 2)) &&
      (!primary || !hasLoadable() || primaryOk(x));
    /* Same pattern first — the closest thing to the same movement done harder. Then movements on
       the same PRIMARY muscle from a neighbouring pattern.

       Requiring every muscle group to match was too strict to be useful: a shoulder-safe floor
       press lists chest and arms, and the incline presses that could legitimately follow it list
       chest and shoulders, so nothing qualified and the slot sat on one movement for the whole
       block. An injury filter can empty a pattern by itself — with a shoulder flagged, every
       other horizontal press in the bank is contraindicated — and when it does, the progression
       has to come from a neighbouring pattern on the same tissue or it cannot come at all. */
    const same = BANK.filter(x=>x.p === m.p && x.n !== m.n && usable(x));
    const primaryGroup = groups[0];
    const kin = BANK.filter(x=>x.p !== m.p && x.n !== m.n && usable(x) &&
      (x.g || []).indexOf(primaryGroup) > -1);
    /* For a main lift, the most compound and most loadable option comes first — that is what
       progression means at the front of a session. Accessories climb by skill instead. */
    const rank = primary
      ? (a, b)=> ((a.tier || 2) - (b.tier || 2)) || (loadCeiling(b) - loadCeiling(a)) || a.n.localeCompare(b.n)
      : (a, b)=> ((a.skill || 2) - (b.skill || 2)) || ((a.tier || 2) - (b.tier || 2)) || a.n.localeCompare(b.n);
    same.sort(rank); kin.sort(rank);
    /* Start from where the current movement sits, so the chain climbs rather than restarting. */
    const startSkill = m.skill || 2;
    const ahead = same.filter(x=>(x.skill || 2) >= startSkill).concat(same.filter(x=>(x.skill || 2) < startSkill));
    return ahead.concat(kin);
  };
  const progressionOK = (from, to)=>{
    if(!from || !to) return false;
    if(loadKindOf(to) !== loadKindOf(from)) return false;      // weighted stays weighted
    if(isBandMove(to) && !isBandMove(from)) return false;       // never progress into a band
    const g1 = from.g || [], g2 = to.g || [];
    if(!g2.some(g=>g1.indexOf(g) > -1)) return false;           // same tissue
    if((to.tier || 2) > (from.tier || 2)) return false;         // never less demanding
    if(loadCeiling(to) < loadCeiling(from)) return false;        // never a lighter implement
    const need = k => kitFor(to).indexOf(k) > -1;
    if(kitFor(from).some(k=>LOADABLE.indexOf(k) > -1) && !kitFor(to).some(k=>LOADABLE.indexOf(k) > -1)) return false;
    return true;
  };
  d.stages = [pairBandWork(guardPrimaries(base.map(x=>Object.assign({}, x))))];
  for(let st = 1; st < stageCount(); st++){
    /* One set per stage, shared across slots — rebuilding it per slot let two slots on the
       same pattern both take the winner, and the movement appeared twice. It holds the
       accessories plus everything already chosen this stage, and NOT the whole base list,
       which used to empty the pool and freeze the main lift. */
    const chosen = new Set(base.slice(ROTATE).map(x=>x.name));
    const list = base.map((x, i)=>{
      const m = byName[x.name];
      if(!m || i >= ROTATE) return Object.assign({}, x);
      const taken = new Set(chosen);
      history[i].forEach(nm=>taken.add(nm));
      const chain = chains[i] || (chains[i] = progressionChain(m, i < 2));
      const from = cur[i] || m;
      /* The next link this slot has not used, that nothing else this stage has taken, and that is
         a step up from where the slot stands now. */
      let alt = chain.find(c=>!history[i].has(c.n) && !taken.has(c.n) &&
        progressionOK(m, c) && progressionOK(from, c)) || null;
      if(!alt){
        const p = pickForSlot(m.p, seedBase + st * 911 + i * 37, taken, null, wantedGroups(), i < 2);
        if(p && !history[i].has(p.n) && progressionOK(m, p) && progressionOK(from, p)) alt = p;
      }
      const fit = !!alt;
      /* Nothing legitimate to move to — every alternative on this tissue is contraindicated by a
         flagged injury, missing from the kit, or beyond this experience level. The movement holds
         and progresses by execution instead. */
      if(!fit && st === 1 && chain.length === 0) holds[i] = true;
      if(fit){
        history[i].add(alt.n); chosen.add(alt.n); cur[i] = alt;
        return Object.assign({}, x, { name:alt.n, note:alt.note });
      }
      /* Nothing left to progress to. HOLD where the slot stands — returning the stage-0 item, as
         this used to, sent week nine back to the week-one movement: a barbell bench earned in the
         middle of the block became a pec deck again, which is a reduction in load dressed up as
         variety. A slot that runs out of progressions keeps what it reached and advances by sets,
         reps, load and execution instead. */
      const stay = cur[i] || byName[x.name];
      const mm = stay || byName[x.name];
      chosen.add(mm ? mm.n : x.name);
      const sets = parseInt(String((x.targets || [])[0] || ''), 10) || (mm && mm.tier === 1 ? 4 : 3);
      const gk = mm ? goalForTier(mm.tier, mm.p) : (x.goal || primaryGoal());
      const next = mm ? genTargets(sets, gk, weekCount(), mm.p, mm.tier, d.dayIdx || 0, st, loadKindOf(mm), mm.n) : null;
      return Object.assign({}, x,
        mm ? { name:mm.n, note:mm.note, goal:gk } : {},
        next && next.length ? { targets:next } : {});
    });
    d.stages.push(pairBandWork(guardPrimaries(list)));
  }
  /* Enforce the progression invariant on the finished stages, not only at the moment a candidate
     is chosen. Selection is one of several paths that can set a slot's movement — the chain, the
     scored fallback, the top-up fill, the opener guard — and a rule applied inside just one of
     them is a rule that holds most of the time. Checked here, against the stage before it and by
     slot, it holds for every path: any slot that came out easier than the week before reverts to
     what it had, which is always safe. */
  for(let s = 1; s < d.stages.length; s++){
    const prev = {};
    d.stages[s - 1].forEach(x=>{ if(x.slot !== undefined) prev[x.slot] = x; });
    d.stages[s] = d.stages[s].map(x=>{
      const was = prev[x.slot];
      if(!was || was.name === x.name) return x;
      const from = byName[was.name], to = byName[x.name];
      if(!from || !to || progressionOK(from, to)) return x;
      const gk = from.goal || goalForTier(from.tier, from.p);
      const sets = parseInt(String((was.targets || [])[0] || ''), 10) || (from.tier === 1 ? 4 : 3);
      const next = genTargets(sets, gk, weekCount(), from.p, from.tier, d.dayIdx || 0, s, loadKindOf(from), from.n);
      return Object.assign({}, x, { name:from.n, note:from.note, goal:gk },
        next && next.length ? { targets:next } : {});
    });
  }
  /* Three structural invariants, checked on every finished stage for the same reason the
     progression rule above is: five different code paths can set a slot's movement, and a rule
     enforced inside one of them holds only most of the time.

     A stage that violates one of these is not merely untidy. Two rungs of the same drill ladder
     in one session is the same drill twice, with the harder rung prescribed to someone who has
     not shown they own the easier one. Explosive work behind heavy strength work is a jump
     performed on a fatigued athlete, and rate of force development and landing mechanics both
     fall with fatigue — that is the mechanism behind most plyometric injury. And a movement
     listed twice is a set count nobody intended.

     Held slots and the progression chain's cross-pattern candidates are what let these through:
     a slot that holds is not in the stage's chosen set, and a hinge can legitimately progress to
     a hang power clean, which changes the movement's demand class and so its correct position. */
  for(let s = 0; s < d.stages.length; s++){
    const seenName = new Set(), seenFam = new Set(), kept = [];
    d.stages[s].forEach(x=>{
      const m = byName[x.name];
      const l = m ? ladderOf(m.n) : null;
      if(seenName.has(x.name)) return;                    // the same movement twice
      if(l && seenFam.has(l.fam)) return;                  // a second rung of one ladder
      seenName.add(x.name);
      if(l) seenFam.add(l.fam);
      kept.push(x);
    });
    /* Explosive first, then Olympic, then the rest — each group holding its relative order, and
       a band finisher staying behind whatever it finishes. */
    const demand = x=>{
      if(x.ssAfter) return 3;
      const m = byName[x.name];
      if(!m) return 2;
      return /^plyo/.test(m.p || '') ? 0 : (m.p === 'oly' ? 1 : 2);
    };
    /* Length is checked per stage, not only on the day it was drawn from. A stage regenerates
       its prescriptions, so a later stage can carry more sets than the one before it and run past
       the session ceiling — the trim has to happen where the sets actually are. Ordering first, so
       the trim takes from the accessories rather than the opening lift. */
    d.stages[s] = fitDayToTime(kept
      .map((x, i)=>({ x, i, d:demand(x) }))
      .sort((a, b)=> a.d - b.d || a.i - b.i)
      .map(o=>o.x), peakWeek(s));
  }
  /* Guardrail: no stage may ship empty when the day had movements to begin with. Any transform
     above that returns nothing falls back to the base list rather than handing over a blank day. */
  if(base.length){
    d.stages = d.stages.map(s => (s && s.length) ? s : guardPrimaries(base.map(x=>Object.assign({}, x))));
  }
  d.exercises = d.stages[0];
}
/* Point every day at the stage the shown week belongs to. Assigned by reference, so a swap
   the lifter keeps is written into that stage and survives the next visit. */
function applyStages(week){
  let moved = 0;
  (state.plan || []).forEach(d=>{
    if(!Array.isArray(d.stages) || !d.stages.length) return;
    const i = Math.min(d.stages.length - 1, stageOf(week || state.week));
    if(d.exercises !== d.stages[i]){ d.exercises = d.stages[i]; moved++; }
  });
  return moved;
}

/* A movement name typed by hand has to resolve to something the app knows, or the plan holds
   a string with no muscles, no how-to and no kit. */
function resolveMovement(name){
  const q = String(name || '').trim();
  if(!q) return null;
  if(byName[q]) return q;
  const lc = q.toLowerCase();
  let hit = BANK.find(m=>m.n.toLowerCase() === lc);
  if(hit) return hit.n;
  hit = BANK.find(m=>m.n.toLowerCase().indexOf(lc) === 0) || BANK.find(m=>m.n.toLowerCase().indexOf(lc) > -1);
  return hit ? hit.n : null;
}
function repairPlanNames(){
  let fixed = 0;
  (state.plan || []).forEach(d=>(d.exercises || []).forEach(e=>{
    if(!byName[e.name]){
      const r = resolveMovement(e.name);
      if(r && r !== e.name){ e.name = r; const m = byName[r]; if(m) e.note = m.note; fixed++; }
    }
    if(Array.isArray(e.targets)){
      const m = byName[e.name];
      /* The movement's OWN goal decides its band. Snapping against the program's primary goal
         clamped a small-muscle range into a compound one and produced the odd numbers it was
         meant to remove. */
      const gk = e.goal || (m ? goalForTier(m.tier, m.p) : primaryGoal());
      const band = repBandFor(gk, m && m.p, e.name);
      const held = isTimedMove(m) ? holdSecs(gk, state.week, weekCount(), m && m.p) : 0;
      e.targets = e.targets.map((t, wi)=>{
        const next = snapTarget(String(t), band, held ? holdSecs(gk, wi + 1, weekCount(), m && m.p) : 0);
        if(next !== t) fixed++;
        return next;
      });
    }
  }));
  return fixed;
}

/* A program's targets are written once, at build time, so an engine fix reaches only programs
   built after it. Rewrite stored targets from the current engine and rebuild stages. Logged
   sessions are untouched: this rewrites the prescription, never the record. */
const PROG_VERSION = 58;
function migrateProgramming(){
  if(!state.plan || !state.plan.length) return 0;
  if((state.progVersion || 0) >= PROG_VERSION){ state.progVersion = PROG_VERSION; return 0; }
  const n = weekCount();
  let swapped = 0, retargeted = 0;
  state.plan.forEach((d, di)=>{
    const taken = new Set(d.exercises.map(e=>e.name));
    d.exercises.forEach((ex, i)=>{
      let m = byName[ex.name];
      if(!m) return;
      if(i < 2 && bandOnly(m) && hasLoadable()){
        taken.delete(ex.name);
        const alt = pickForSlot(m.p, (state.seed || 1) * 17 + di * 61 + i, taken, null, wantedGroups(), true);
        if(alt && !bandOnly(alt)){ ex.name = alt.n; ex.note = alt.note; m = alt; swapped++; }
        taken.add(ex.name);
      }
      const setsNow = parseInt(String((ex.targets || [])[0] || ''), 10) || (m.tier === 1 ? 4 : 3);
      const gk = ex.goal || goalForTier(m.tier, m.p);
      const next = genTargets(setsNow, gk, n, m.p, m.tier, di, 0, loadKindOf(m), m.n);
      if(next && next.length){ ex.targets = next; retargeted++; }
    });
  });
  state.plan.forEach((d, di)=>{
    d.dayIdx = di;
    /* Bring a stored day up to length before stages are derived from it, or every stage inherits
       a session that is twenty minutes short. */
    d.exercises = fitDayToTime(fillDayToTime(d.exercises, 1, di), 1);
    buildStagesFor(d, (state.seed || 1) * 31 + di * 977);
    retargeted++;
  });
  /* The weekly ceiling has to be applied to a stored plan too, not just a freshly built one:
     an existing six-day program is exactly the case that was over-prescribed. */
  governVolume(state.plan);
  state.plan.forEach(d=>{ if(d.stages && d.stages.length) d.exercises = d.stages[0]; });
  applyStages(state.week);
  /* Repair a current week the log cannot justify. Stopping future writes does nothing about a
     value already stored — a plan sitting on week 6 with nothing logged keeps prescribing week-6
     load to a client who has trained none of the weeks before it. The current week can never be
     more than one past the last week actually trained. */
  const trained = new Set();
  (state.sessions || []).forEach(s=>{ if(s && s.week) trained.add(+s.week); });
  const highest = trained.size ? Math.max.apply(null, [...trained]) : 0;
  const allowed = Math.max(1, Math.min(weekCount(), highest + 1));
  if((state.week || 1) > allowed){
    state.week = allowed;
    retargeted++;
  }
  applyStages(state.week);
  const auto = /^Wk \d+ · /;
  if(Array.isArray(state.weekNames) && state.weekNames.length && state.weekNames.every(x=>auto.test(x))){
    const fresh = genWeekNames(primaryGoal(), state.weekNames.length);
    if(fresh && fresh.length === state.weekNames.length) state.weekNames = fresh;
  }
  state.progVersion = PROG_VERSION;
  return swapped + retargeted;
}

function sportMatches(){
  const q = String(ui.sportQ || '').trim().toLowerCase();
  const keys = Object.keys(SPORTS).sort((a,b)=>SPORTS[a].label.localeCompare(SPORTS[b].label));
  if(!q) return [];                                   // nothing until they type, or open the bank
  const hit = k => {
    if(SPORTS[k].label.toLowerCase().indexOf(q) > -1 || k.indexOf(q) > -1) return true;
    return (SPORT_ALIAS[k] || []).some(a=>a.indexOf(q) > -1 || q.indexOf(a) > -1);

/* Two days is not enough week for a dedicated focus day. Setting one anyway consumed half
   the week and left the other day resolving to Upper Body — so an in-season volleyball
   player got chest, back, shoulders and arms and no quads, glutes, hamstrings or calves at
   all, while the app's own rationale on screen asked for jump capacity. At two days the
   split goes full-body and the sport's regions carry extra volume inside it instead. */
const tightWeek = days => (days || setup.liftDays || 3) <= 2;
function applySport(){
  const s = SPORTS[ui.sportPick];
  if(!s) return;
  const ph = SEASON[ui.sportSeason || 'off'];
  setup.goals = s.goals.slice(0, 3);
  setup.goal = setup.goals[0];
  const stored = (state.sport && state.sport.baseDays) || null;
  const key = ui.sportSeason || 'off';
  if(key === 'in' && !stored) state.sport = Object.assign({}, state.sport, { baseDays:setup.liftDays });
  const days = ph.days || stored || setup.liftDays;
  const tight = tightWeek(days);
  if(tight){ setup.focus = 'balanced'; setup.splitStyle = 'full'; }
  else {
    setup.splitStyle = 'auto';
    if(s.focus && FOCUS[s.focus]) setup.focus = s.focus;
  }
  /* Every region the readback names is applied — all three, not the first two. A sport's
     risk areas earn extra volume; they are never added to the injury list, which removes
     movements and is the opposite of what a shoulder facing a swim season needs. */
  setup.priorities = s.prio.map((k, i)=>({ r:k, lvl:(!tight && i === 0) ? 'day' : 'more' }));
  setup.runGoal = s.run || 'none';
  /* A sport's readback promises conditioning — VO2 work, tempo runs, distance — but applying the
     sport only ever set the run GOAL, never the run DAYS. With the default of zero run days the
     whole conditioning half of the program silently never built, so a soccer or cross-country
     program came out lifting-only. Give the sport a sensible run-day count so the conditioning the
     readback names actually appears. Endurance and race goals earn more days; support conditioning
     for a lifting-primary athlete earns fewer. The client can still change it afterwards. */
  const RUN_DAYS_FOR = { maintain:2, speed:2, vo2:2, endurance:3, race5k:3, race10k:3, racehalf:3, racemarathon:3 };
  setup.runDays = setup.runGoal === 'none' ? 0 : (RUN_DAYS_FOR[setup.runGoal] || 2);
  setup.liftDays = days;
  if(typeof syncTrainDows === 'function') syncTrainDows();
  if(ph.weeks) setup.weeks = ph.weeks;
  state.sport = { key:ui.sportPick, season:key,
    baseDays: key === 'in' ? (stored || state.sport && state.sport.baseDays || days) : null };
  toast(s.label + ' · ' + ph.label.toLowerCase() + ' applied');
  render();
}

/* Areas of emphasis — extra set on matching movements, plus one added movement */
const GROUPS = {
  chest:{ label:'Chest', re:/bench|dip|fly|pec|push-up|chest throw|floor press|incline .*press|crossover/i },
  back:{ label:'Back', re:/pull-?up|pulldown|row|straight-arm|pullover|pull-apart|y-t-w|clean/i },
  shoulders:{ label:'Shoulders', re:/shoulder press|overhead press|lateral raise|face pull|rear-delt|reverse pec|push press|external rotation|landmine|z-press/i },
  arms:{ label:'Arms', re:/curl|triceps|pressdown|skull|close-grip/i, not:/leg curl|hamstring curl|ham curl|nordic/i },
  quads:{ label:'Quads', re:/squat|leg press|leg extension|step[- ]?up|lunge|step[- ]?down|sissy|depth drop|box jump/i },
  hamstrings:{ label:'Hamstrings', re:/romanian|leg curl|hamstring|nordic|deadlift|back extension|good morning|slider/i },
  glutes:{ label:'Glutes', re:/hip thrust|glute|kickback|abduction|frog|bulgarian|step[- ]?up|lunge|romanian|swing|cossack/i },
  calves:{ label:'Calves', re:/calf|tibialis|pogo/i },
  core:{ label:'Core', re:/plank|pallof|dead bug|bird dog|carry|leg raise|copenhagen|rollout|woodchop|slam|rotational throw/i }
};
const groupHit = (g,name) => GROUPS[g].re.test(name) && !(GROUPS[g].not && GROUPS[g].not.test(name));
const groupsOf = name => Object.keys(GROUPS).filter(g=>groupHit(g,name));
function nameWords(n){ return String(n).toLowerCase().replace(/\(.*?\)/g,'').replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(Boolean); }
function sameLift(a,b){
  const A=new Set(nameWords(a)), B=new Set(nameWords(b));
  const small = A.size<=B.size?A:B, big = A.size<=B.size?B:A;
  let hit=0; small.forEach(w=>{ if(big.has(w)) hit++; });
  return small.size>0 && hit===small.size;
}
const dupOf = (list,name) => list.some(x=>sameLift(x.n||x.name,name));

/* The bank declares what each movement needs. That declaration is authoritative —
   deriving kit from the name instead used to ignore 43 real requirements, so a
   client with no barbell was prescribed Standing Overhead Press, and one with no
   cable got Face Pull. Name matching is kept only as a net for bank rows that
   declare nothing. */
function kitFor(m){
  const declared = (m.kit || []).filter(Boolean);
  if(declared.length) return [...new Set(declared)];
  const need = [];
  if(MACHINE_ONLY.indexOf(m.n) > -1){
    // a cable station and a selectorised machine are different pieces of kit
    need.push(/cable|pulldown|pressdown|kickback/i.test(m.n) ? 'cable' : 'machines');
    return need;
  }
  KIT_KEYS.forEach(k=>{ const r = KIT[k].re; if(r && r.test(m.n)) need.push(k); });
  // a barbell lift does not also need the dumbbell rack
  if(need.indexOf('barbell') > -1 && need.indexOf('dumbbell') > -1 && /^barbell|^back squat|^front squat|trap bar|conventional/i.test(m.n)){
    need.splice(need.indexOf('dumbbell'), 1);
  }
  return need;
}

function syncPriorities(){
  const p = setup.priorities || [];

  setup.focus = withDay ? REGIONS[withDay.r].focus : 'balanced';
  const em = [];

    if(x === withDay) return;                 // the focus day already covers it
    (REGIONS[x.r] ? REGIONS[x.r].groups : []).forEach(g=>{ if(em.indexOf(g) < 0) em.push(g); });
  });

function togglePriority(r){
  const p = setup.priorities || (setup.priorities = []);
  const i = p.findIndex(x=>x.r === r);
  if(i > -1) p.splice(i, 1);
  else {
    if(p.length >= 2) return toast('Two priorities is the most that works — any more and nothing stands out');
    p.push({ r, lvl: REGIONS[r].dayOnly ? 'day' : 'more' });
  }

function setPriorityLevel(r, lvl){
  const p = setup.priorities || [];

  if(lvl === 'day'){
    if(!REGIONS[r].focus) return toast('Calves cannot have a day of their own');
    p.forEach(y=>{ if(y !== x && y.lvl === 'day') y.lvl = 'more'; });   // only one day
  }
  x.lvl = lvl;
  syncPriorities(); render();
}
function priorityNote(){
  const p = setup.priorities || [];
  if(!p.length) return 'Everything trained evenly — a good default.';
  const day = p.find(x=>x.lvl === 'day');
  const more = p.filter(x=>x.lvl !== 'day');
  const bits = [];
  if(day) bits.push(REGIONS[day.r].label.toLowerCase() + ' gets a day of its own plus extra work elsewhere');
  if(more.length) bits.push(more.map(x=>REGIONS[x.r].label.toLowerCase()).join(' and ') + ' get an extra set and are picked ahead of other exercises');
  const s = bits.join('; ') + '.';
  return s.charAt(0).toUpperCase() + s.slice(1);
}

/* ══════════ REST & TIME ══════════
   Rest comes from the goal the exercise follows and how demanding the lift is:
   big compound lifts on a heavy goal need minutes, small isolation work needs a breather. */
/* Rest by training goal, from the NSCA goal-based rest assignments:
   strength and power 2–5 min, hypertrophy 30 s–1.5 min, muscular endurance ≤30 s.
   Assistance exercises take the shorter end (60–90 s) whatever the goal, since the
   published assignments apply to core exercises. */
const REST_TABLE = {
  strength:    [[180,300],[120,180],[60,90]],
  power:       [[180,300],[180,300],[120,180]],   // quality of movement is the point
  hypertrophy: [[60,90],[45,75],[30,60]],
  health:      [[45,60],[30,60],[30,45]]
};
function restSecs(goalKey, tier, week){
  /* Rest is a property of the adaptation, not a separate table. Reading it from its own
     table meant a strength-and-size week prescribed 30–60 seconds where the adaptation
     calls for 120–240 — a fourfold understatement, shown on screen mid-set. The tier and
     the short-rest week now scale WITHIN the adaptation's band instead of outside it. */
  const n = weekCount(), w = week || state.week, ph = phaseOf(w, n);
  const a = ADAPT[adaptFor(goalKey, w, n)] || ADAPT.hypertrophy;
  const lo = a.rest[0], top = a.rest[1];
  const t = Math.max(1, Math.min(3, tier || 2));
  let hi = t === 1 ? top : Math.round(lo + (top - lo) * (t === 2 ? 0.6 : 0.3));
  if(ph === 1) hi = Math.round(lo + (hi - lo) * 0.4);     // the short-rest week
  if(ph === 3) hi = Math.round(hi * 0.9);
  /* Snap to clean 30-second steps — the timer and the printed range should be numbers a person
     counts to (30/60/90/120), not a computed 96. This is the single source of truth: the session
     timer, the rest label and the session-length estimate all read from here. */
  const snap = s => Math.max(30, Math.round(s / 30) * 30);
  const rlo = snap(lo), rhi = Math.max(rlo, snap(hi));
  return [rlo, rhi];
}

function fmtRest(secs){
  const round = s => Math.max(30, Math.round(s / 30) * 30);
  const lo = round(secs[0]), hi = round(secs[1]);
  return lo === hi ? lo + ' seconds' : lo + '–' + hi + ' seconds';
}
function restFor(ex, week, idx){
  const m = byName[ex.name];
  let tier = m ? m.tier : 2;
  // only the first couple of lifts get the long window; later work is accessory work
  const i = idx === undefined ? exIndexOf(ex) : idx;
  if(i >= 2) tier = Math.min(3, tier + 1);
  if(i >= 4) tier = 3;
  return restSecs(ex.goal || primaryGoalOf(), tier, week);
}
function exIndexOf(ex){
  for(const d of state.plan){
    const i = d.exercises.indexOf(ex);
    if(i > -1) return i;
    const j = d.exercises.findIndex(e=>e.name === ex.name);
    if(j > -1) return j;
  }
  return 0;
}
function primaryGoalOf(){
  const s = state.setup || {};
  const g = (s.goals && s.goals.length) ? s.goals : [s.goal || 'hypertrophy'];
  return GOAL_ORDER.find(k=>g.indexOf(k) > -1) || g[0];
}
/* Roughly how long a session runs: warm-up + every set and the rest after it. */
function setSeconds(ex){
  const m = byName[ex.name];
  const tier = m ? m.tier : 2;
  return tier === 1 ? 45 : tier === 2 ? 35 : 30;      // time under the bar, plus getting set up
}
function dayMinutes(d, week){
  if(!d || !d.exercises) return 0;
  let secs = 0;
  d.exercises.forEach((ex, i)=>{
    const t = String(tgt(ex, week));
    const m = t.match(/^(\d+)/);
    const sets = m ? +m[1] : 3;
    const [lo, hi] = restFor(ex, week, i);
    secs += sets * setSeconds(ex) + (sets - 1) * ((lo + hi) / 2);
  });
  secs += 10 * 60;                                    // the fixed three-part warm-up
  secs += 120;                                        // changing plates, finding a bench
  return Math.round(secs / 60);
}
/* No session should run past its length ceiling, warm-up included. Trim from the
   back — the last exercises are the smallest — then shave a set off the biggest
   remaining block, rather than cutting the main lifts.
   Seventy minutes is the default. A beginner is asked for their ceiling instead: an hour
   is a lot of time to find and a lot of unfamiliar work to hold attention through, so a
   45-minute session is a legitimate answer rather than a compromised one. */
const SESSION_CAP_DEFAULT = 70;
/* Session length scales with training age. A beginner sets their own ceiling — an hour of
   unfamiliar work is a lot to hold and stay sharp through — while an intermediate, and more so
   an advanced athlete, need the room for the volume their goals actually call for. The old
   single 70-minute ceiling for everyone was what made every experienced session feel clipped. */
const SESSION_CAP_BY_EXP   = { beginner:60, intermediate:75, advanced:80 };
const SESSION_FLOOR_BY_EXP = { beginner:35, intermediate:48, advanced:52 };
/* The real guardrail on session size. Minutes alone let a day balloon — a hard ceiling on how
   many movements it carries keeps it a handful of things done well. Experience buys one more
   slot, not a checklist. */
const MAX_MOVES_BY_EXP     = { beginner:5, intermediate:6, advanced:7 };
function maxMoves(){ return MAX_MOVES_BY_EXP[setup.exp] || MAX_MOVES_BY_EXP.intermediate; }
function sessionCap(){
  if(setup.exp === 'beginner') return +setup.sessionMax || SESSION_CAP_BY_EXP.beginner;
  return SESSION_CAP_BY_EXP[setup.exp] || SESSION_CAP_BY_EXP.intermediate;
}
/* The floor tracks the ceiling so a build can't fill a day up and then trim it straight back. */
function sessionFloor(){
  if(setup.exp === 'beginner'){ const c = sessionCap(); return Math.max(18, c - 10); }
  return SESSION_FLOOR_BY_EXP[setup.exp] || SESSION_FLOOR_BY_EXP.intermediate;
}
/* A session has a floor as well as a ceiling. Trimming to fit 70 minutes was the only length
   rule, so a day that came out at 35 minutes was left there — and a beginner's lower set counts
   made that the normal outcome. Fill up to 50 minutes first from the muscle groups the day
   already trains, keeping every selection rule intact, then trim if the result overshoots. */
function fillDayToTime(exercises, week, dayIdx){
  const day = { exercises:exercises.slice() };
  if(dayMinutes(day, week) >= sessionFloor()) return day.exercises;
  const have = new Set(day.exercises.map(x=>x.name));
  const patterns = new Set(), regions = new Set();
  day.exercises.forEach(x=>{ const m = byName[x.name]; if(!m) return;
    patterns.add(m.p); (m.g || []).forEach(g=>regions.add(g)); });
  /* An upper/lower day must not import the opposite family. Sharing a region isn't enough: every
     day has a core slot, and core-braced pressing and rowing share it — which is how a shoulder
     press and a barbell row were landing on a lower day. Judge a candidate by its PRIMARY muscle. */
  const UPPER_G = ['chest','back','shoulders','arms'], LOWER_G = ['quads','hamstrings','glutes','calves'];
  const famOf = g => UPPER_G.indexOf(g) > -1 ? 'upper' : LOWER_G.indexOf(g) > -1 ? 'lower' : 'neutral';
  const dayFams = new Set();
  day.exercises.forEach(x=>{ const m = byName[x.name]; if(m) (m.g || []).forEach(g=>dayFams.add(famOf(g))); });
  const dayIsLower = dayFams.has('lower') && !dayFams.has('upper');
  const dayIsUpper = dayFams.has('upper') && !dayFams.has('lower');
  const pool = BANK.filter(x=>
    !have.has(x.n) && !patterns.has(x.p) && !isBandMove(x) && equipPick(x).include &&
    !(x.x || []).some(k=>(setup.injuries || []).indexOf(k) > -1) &&
    (SKILL_PREF[setup.exp] || SKILL_PREF.intermediate)[(x.skill || 2) - 1] > -50 &&
    (x.g || []).some(g=>regions.has(g)) &&
    !((dayIsLower && famOf((x.g || [])[0]) === 'upper') || (dayIsUpper && famOf((x.g || [])[0]) === 'lower')))
    .sort((a, b)=> (b.tier || 2) - (a.tier || 2));      // accessories first — the compounds are done
  let guard0 = 0;
  while(dayMinutes(day, week) < sessionFloor() && pool.length && guard0++ < 12){
    const m = pool.shift();
    if(have.has(m.n) || patterns.has(m.p)) continue;
    have.add(m.n); patterns.add(m.p);
    const gk = goalForTier(m.tier, m.p);
    const cap = setup.exp === 'beginner' ? 3 : setup.exp === 'advanced' ? 5 : 4;
    day.exercises.push({ name:m.n, note:m.note, goal:gk,
      targets:genTargets(Math.min(cap, 3), gk, weekCount(), m.p, m.tier, dayIdx || 0, 0, loadKindOf(m), m.n) });
  }
  /* Still short because the bank has nothing left for these muscles — add a set to the accessory
     work rather than leaving the session under length. */
  let guard1 = 0;
  while(dayMinutes(day, week) < sessionFloor() && guard1++ < 10){
    const cap = setup.exp === 'beginner' ? 3 : setup.exp === 'advanced' ? 5 : 4;
    const i = day.exercises.findIndex(ex=>{
      const m = byName[ex.name];
      const n = +(String(tgt(ex, week)).match(/^(\d+)/) || [0, 0])[1];
      return m && (m.tier || 2) >= 2 && n < cap && !ex.burnout;
    });
    if(i < 0) break;
    const ex = day.exercises[i];
    ex.targets = ex.targets.map(t=>String(t).replace(/^(\d+)/, (mm, n)=> Math.min(6, +n + 1)));
  }
  return day.exercises;
}
function fitDayToTime(exercises, week){
  const day = { exercises:exercises.slice() };
  /* Movement-count ceiling first. Drop from the back, but prefer a movement whose primary muscle
     is already covered by another kept movement — so a third quad slot goes before the day's only
     calf or core movement, and group coverage survives the trim. */
  const maxN = maxMoves();
  while(day.exercises.length > maxN){
    let idx = -1;
    for(let i = day.exercises.length - 1; i >= 0; i--){
      const g0 = ((byName[day.exercises[i].name] || {}).g || [])[0];

/* Browsers throttle a backgrounded page, which is what makes phone GPS unreliable.

async function holdScreen(){

    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', ()=>{ wakeLock = null; paintTrack(); });

  }catch(e){ wakeLock = null; return 'refused'; }

function releaseScreen(){

/* A GPS fix is a guess with an error radius, so summing raw fix-to-fix hops both
   invents distance while you stand still and loses it while you run. This is the
   standard 1-D Kalman filter over position: each reading is blended in proportion
   to how precise it claims to be, and the estimate's own uncertainty grows with
   time so real movement is still tracked. Q is metres per second of expected motion. */
function kalmanReset(){ ui.track.k = null; }
function kalmanFix(lat, lon, acc, at){
  const t = ui.track;
  const Q = 1.6;                                   // a runner's plausible motion, m/s
  const accuracy = Math.max(acc, 1);
  if(!t.k){
    t.k = { lat, lon, v:accuracy * accuracy, at };
    return { lat, lon };
  }
  const dt = Math.max(0, (at - t.k.at) / 1000);
  let v = t.k.v + dt * Q * Q;
  const gain = v / (v + accuracy * accuracy);
  const nlat = t.k.lat + gain * (lat - t.k.lat);
  const nlon = t.k.lon + gain * (lon - t.k.lon);
  t.k = { lat:nlat, lon:nlon, v:(1 - gain) * v, at };
  return { lat:nlat, lon:nlon };
}
function haversine(a, b){
  const R = 3958.8, toR = Math.PI / 180;
  const dLat = (b.lat - a.lat) * toR, dLon = (b.lon - a.lon) * toR;
  const la = a.lat * toR, lb = b.lat * toR;
  const x = Math.sin(dLat/2) ** 2 + Math.cos(la) * Math.cos(lb) * Math.sin(dLon/2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(x)));
}
function startTrack(){

  const work = todayRun && todayRun.segments ? (todayRun.segments.find(s=>s.kind === 'work') || todayRun.segments[0]) : null;
  const off = work ? PACE_OFFSET[work.type] : undefined;

    targetSecs: (state.runPace && off !== null && off !== undefined) ? state.runPace + off : 0 };

function beginTracking(){
  const t = ui.track;

function onFix(pos){
  const t = ui.track;
  if(!t) return;
  const acc = pos.coords.accuracy || 999;                  // metres
  t.gps = 'on';
  t.acc = Math.round(acc);
  t.fixes = (t.fixes || 0) + 1;
  t.lastFixAt = Date.now();
  // A phone outdoors reports 5–65 m. Only reject fixes too vague to be useful at all.
  if(acc > 100){ paintTrack(); return; }
  const at = Date.now();
  // Phones report their own speed; a stationary reading means any apparent
  // movement is drift, whatever the coordinates say.
  const spd = typeof pos.coords.speed === 'number' && pos.coords.speed >= 0 ? pos.coords.speed : null;
  const sm = kalmanFix(pos.coords.latitude, pos.coords.longitude, acc, at);
  const p = { lat:sm.lat, lon:sm.lon, at, acc };
  if(!t.last || t.paused){ t.last = p; paintTrack(); return; }

  const d = haversine(t.last, p);
  const gap = (p.at - t.last.at) / 1000;
  if(d < 0.0013) { paintTrack(); return; }                       // under 7 ft — residual drift
  if(spd !== null && spd < 0.4 && !t.paused){ t.last = p; paintTrack(); return; }   // standing still
  if(gap >= 1 && d / (gap / 3600) > 13){ t.last = p; paintTrack(); return; }   // a jump, not a stride

  t.miles += d;
  t.recent.push({ d, at:p.at });
  if(t.recent.length > 12) t.recent.shift();
  const whole = Math.floor(t.miles);
  if(whole > t.splits.length){
    const prev = t.splits.reduce((n,s)=>n + s, 0);
    t.splits.push(Math.round(t.ms / 1000) - prev);

}
/* Only a denied permission is terminal. A timeout or a lost signal is normal

function onFixErr(err){

}
function tickTrack(){

  const gap = now - t.lastTick;

     suspended the page — screen locked, or another app in front. Time still
     elapsed, but no GPS fixes arrived, so the distance for that stretch is lost.
     Record it so the pace can be trusted or corrected rather than quietly wrong. */
  if(gap > 8000 && !t.paused){
    t.gapMs = (t.gapMs || 0) + gap;
    t.gaps = (t.gaps || 0) + 1;
    t.last = null;                  // do not draw a straight line across the gap
    kalmanReset();

}
function trackPause(){
  if(!ui.track) return;

function livePace(){

  const dist = t.recent.reduce((n,r)=>n + r.d, 0);

  return Math.round((span / 1000) / dist);
}

const DOW = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
function dowOf(iso){ return (new Date(iso + 'T12:00:00').getDay() + 6) % 7; }
function startDow(){ return dowOf(setup.startDate || todayISO()); }
function defaultDows(n){ return (LIFT_DOWS[Math.max(1, Math.min(6, n))] || []).slice(); }
function trainDows(){
  const d = (setup.trainDows || []).filter(x=>x >= 0 && x < 7);
  return d.length === setup.liftDays ? d.slice().sort((a,b)=>a-b) : defaultDows(setup.liftDays);
}
/* Which days a toggle would leave you training, and why it might refuse. Pure, so the rule
   ("at least one, at most six") can be tested without a screen. */
function nextTrainDows(cur, d){
  const days = (cur || []).slice();
  const i = days.indexOf(d);
  if(i > -1){
    if(days.length <= 1) return { days, refused:'You need at least one training day' };
    days.splice(i, 1);
  } else {
    if(days.length >= 6) return { days, refused:'Six training days is the most Trainlog will write' };
    days.push(d);
  }
  return { days: days.sort((a,b)=>a-b), refused:null };
}
function toggleTrainDow(d){
  const r = nextTrainDows(trainDows(), d);
  if(r.refused) return toast(r.refused);
  setup.trainDows = r.days;
  setup.liftDays = r.days.length;
  render();
}
/* Keep the day picker honest when the day count changes elsewhere. */
function syncTrainDows(){
  const cur = (setup.trainDows || []).slice().sort((a,b)=>a-b);
  if(cur.length === setup.liftDays) return;
  setup.trainDows = defaultDows(setup.liftDays);
}
function restDayNote(){
  const on = trainDows();
  const off = DOW.map((_,i)=>i).filter(i=>on.indexOf(i) < 0);
  const backToBack = on.filter((d,i)=> i > 0 && d === on[i-1] + 1).length;
  const bits = [];
  bits.push(off.length ? 'Rest on ' + off.map(i=>DOW[i]).join(', ') : 'No rest days — hard to hold');

function isoPlus(n){
  const d = new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate() + n);

function nextDowISO(target){                   // the next occurrence of a weekday, today included
  const d = new Date(); d.setHours(12,0,0,0);
  const cur = (d.getDay() + 6) % 7;

const LIFT_DOWS = { 1:[2], 2:[0,3], 3:[0,2,4], 4:[0,1,3,4], 5:[0,1,2,4,5], 6:[0,1,2,3,4,5] };
const isLowerDay = name => /leg|lower|glute|quad|posterior/i.test(name || '');

/* Place runs around the lifting week: hard runs away from leg days, recovery runs after them. */
function buildSchedule(liftNames, nRun, goalKey, startDow, chosenDows){
  const nLift = Math.max(0, Math.min(6, liftNames.length));
  const custom = chosenDows && chosenDows.length === nLift;
  const liftDows = custom ? chosenDows.slice().sort((a,b)=>a-b) : (LIFT_DOWS[nLift] || []).slice();
  const lifts = {};
  liftDows.forEach((d,i)=> lifts[d] = { name: liftNames[i], lower: isLowerDay(liftNames[i]) });
  const goal = RUN_GOALS[goalKey] || RUN_GOALS.maintain;
  const types = goal.mix.slice(0, Math.max(0, Math.min(6, nRun)));
  const runs = {};
  types.forEach(type=>{
    const s = RUN_SESSIONS[type];
    let best = -1, bestScore = -1e9;
    for(let d=0; d<7; d++){
      if(runs[d] !== undefined) continue;
      const here = lifts[d], next = lifts[(d+1)%7], prev = lifts[(d+6)%7];
      let sc = 0;
      if(here){
        // doubling up: fine when the run is easy or the lift is upper-body
        if(s.hard >= 2 && here.lower) sc -= 60;
        else if(s.hard >= 2) sc += 6;              // hard run on an upper day — least interference
        if(s.hard === 0 && here.lower) sc += 8;     // easy/recovery flushes the legs after squatting

function scoreState(){
  const H = allHistory();

  let prs = 0, sets = 0, reps = 0, volume = 0, bigSession = 0, prBest = 0, prSessions = 0;
  H.sessions.forEach(s=>{
    let sVol = 0, sPr = 0;

      const e = s.entries[k]; if(!e || !e.length) return;

function celebrate(before, after, line){

    (b.repeat ? (b.count || 0) > (was[b.id] || 0) : !had.has(b.id)));

    '<div class="kicker" style="color:var(--color-accent-300)">Session complete</div>' +

    (fresh.length ? '<div class="celbadges">' + fresh.map(b=>'<div class="badge on pop">' +

    '<button class="b pri" style="margin-top:20px" id="celdone">Done</button></div>';
  document.body.appendChild(ov);
  setTimeout(()=>ov.classList.add('in'), 16);

  const n = ov.querySelector('#celn'), bar = ov.querySelector('#celbar');
  const pct = Math.round(after.into / after.need * 100);
  const dur = 900, t0 = performance.now();
  const tick = t => {
    const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    n.textContent = Math.round(gained * e).toLocaleString();
    if(p < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
  setTimeout(()=>{ bar.style.width = pct + '%'; }, 260);
  const close = ()=>{ ov.classList.remove('in'); setTimeout(()=>ov.remove(), 220); };
  ov.querySelector('#celdone').onclick = close;
  ov.addEventListener('click', e=>{ if(e.target === ov) close(); });
}
/* ── Suggesting a heavier weight ────────────────────────────────────────────────
   The estimated max already tracks training on its own, so the load a percentage resolves to
   climbs by itself. What it cannot do is tell you to put more on the bar, so this reads the
   last fortnight of a movement's own sets and offers a bump when the evidence is there.

   Deliberately slow: at most one suggestion per movement every 14 days. A prompt after every
   good session is how people get talked into adding load faster than tissue adapts, and a
   fortnight is long enough for two or three exposures to say something real. */
const BUMP_DAYS = 14;
function daysSince(iso){
  if(!iso) return 1e6;
  const d = new Date(iso + 'T12:00:00');
  if(isNaN(d.getTime())) return 1e6;
  return Math.round((new Date(todayISO() + 'T12:00:00') - d) / 864e5);
}
/* Every logged appearance of a movement, newest first. */
function recentOf(exName, days){
  const out = [];
  try{
    allHistory().sessions.forEach(s=>{
      const e = (s.entries || {})[exName];
      if(!e || !e.length) return;
      if(daysSince(s.date) > days) return;
      out.push({ date:s.date, sets:e });
    });
  }catch(e){}
  return out.sort((a, b)=>a.date < b.date ? 1 : -1);
}
/* ── Progressive overload, applied rather than suggested ────────────────────────
   The prescription is a percentage, so the weight climbs whenever the estimated max climbs —
   but a max only moves when a set beats every set before it, and that is not how most weeks
   go. Between those jumps the load would sit still, which is not overload.

   So the percentage resolves against a TRAINING max: the best estimated max on record plus a
   small increment earned by recent performance. Everything about it is derived from the log,
   so there is nothing to accept, nothing to enter, and nothing to keep in step.

   The rate is the part that matters for tissue. Connective tissue remodels more slowly than
   muscle produces force, so the ceiling is deliberately low — a few per cent per fortnight,
   never compounding beyond it — and a session that misses its reps removes the increment
   immediately rather than waiting to be told. */
function progressRate(exName, target){
  /* Nothing progresses out of the opening fortnight of a longer block: those two weeks are the
     same session twice by design, and the first pass is a rehearsal rather than a real attempt.
     Adding load off it would be adding load off a number nobody actually tested. */
  const n = weekCount();
  if(n >= 6 && (state.week || 1) <= 2) return 0;
  const hist = recentOf(exName, 21);
  /* A beginner's estimated max climbs mostly because the movement is being learned, not because
     tissue has adapted — early sets are conservative and technique improves fast, so the number
     runs ahead of the tendon. The RATE is the same for everyone; a beginner simply has to show
     it one more time before it counts. */
  const need = setup.exp === 'beginner' ? 3 : 2;
  if(hist.length < need) return 0;
  const met = s => {
    const work = s.sets.filter(x=>!x.warm);
    return work.length > 0 && work.every(x=>(+x.r || 0) >= target);
  };
  /* The most recent session is the veto: miss the reps and the increment is gone. */
  if(!met(hist[0])) return 0;
  let streak = 0;
  for(const s of hist){ if(!met(s)) break; streak++; }
  if(streak < need) return 0;
  /* One rate for everybody. Overload is a principle, not a setting: a beginner and an advanced
     lifter both add load when their sets say they are ready, and the rate a tendon tolerates
     does not change with training age. What experience changes is which movements are
     programmed and how they are loaded — the complexity of the pattern, the equipment, the
     progression the movement itself sits on — and that is decided before this point. */
  return Math.min(0.045, (streak - (need - 1)) * 0.02);

   tension and a bodyweight movement gives what the lifter weighs, so on both there is nothing
   for a percentage to act on and nothing to progress — those movements advance by how they are
   performed and by moving to a harder variation, which the stage rotation handles. Progressing
   a number that does not govern the set would be fiction. */
function trainingMax(exName, ex){
  const m = byName[exName];
  if(m && loadKindOf(m) !== 'pct') return maxOf(exName);   // nothing to overload
  if(ex && ex.burnout) return maxOf(exName);
  const base = maxOf(exName);
  if(!base) return 0;
  const target = ex ? targetReps(ex) : 8;
  return Math.round(base * (1 + progressRate(exName, target)));

  if(!isFinite(v)) v = 0;

  rows[i][field] = field === 'r' ? Math.round(v) : Math.round(v * 2) / 2;

  rows[i][field] = Math.max(0, Math.min(cap, (rows[i][field] || 0) + amt));
  writeOpenSession();
  /* Repainting the whole session screen for a ±5 lb tap threw the scroll position back to the
     top, so entering a weight meant scrolling to find your place again. The field is updated
     where it stands; nothing else on screen depends on it. */

/* Manual swap: search the whole movement bank rather than typing blind. */
async function doSwap(nameIn){
  const name = resolveMovement(nameIn) || String(nameIn || '').trim();
  if(!name || !ui.sess) return;
  const d = day(ui.sess.dayId), raw = d.exercises[ui.sess.i];
  if(!raw) return;
  const was = raw.name;
  const m = byName[name];
  /* A swap changed the NAME and kept the outgoing movement's prescription, so the incoming one
     inherited numbers written for something else. On a held movement that was visibly wrong:
     swap a pressing or crunching movement for a plank and its rep count came across as the hold,
     relabelled in seconds — an 8–10 rep target became an 8–10 SECOND plank — and a "% 1RM" that
     means nothing for an isometric came with it. levelUp and levelDown already regenerate; this
     is the same thing, and now so does this. */
  let tg = null, gk = null;
  if(m){
    gk = goalForTier(m.tier, m.p);
    try{
      tg = genTargets(setsIn(raw) || 3, gk, weekCount(), m.p, m.tier,
        d.dayIdx || 0, 0, loadKindOf(m), m.n);
    }catch(e){ tg = null; }
  }
  if(ui.swapPersist !== false){
    raw.name = name;
    if(m){ raw.note = m.note; if(gk) raw.goal = gk; if(tg) raw.targets = tg; }
    delete ui.sess.swaps[name];
    delete ui.sess.swaps[was];
  } else {
    ui.sess.swaps[was] = name;
    /* the non-persisting swap needs its own prescription too, or sessEx hands back the
       original movement's targets under the new movement's name */
    ui.sess.swapTargets = ui.sess.swapTargets || {};
    if(tg) ui.sess.swapTargets[was] = tg;
  }
  /* rows were built from the old prescription — drop them so they rebuild from the new one */
  if(ui.sess.sets){ delete ui.sess.sets[was]; delete ui.sess.sets[name]; }
  ui.swap = false;
  writeOpenSession(); await save(); render();
}

/* ── Does the program still match the settings? ─────────────────────────────────
   Settings and program are deliberately separate: changing your equipment must not silently
   rewrite a program you are mid-way through. But the reverse failure is worse — someone leaves
   a gym, switches to home equipment, and the app keeps prescribing a barbell bench press with
   no barbell in the room. So settings persist on change, and any mismatch between them and the
   live program is stated on the screens you actually look at, with one tap to resolve it. */
function planDrift(){
  if(!state.plan || !state.plan.length) return null;
  const kitMiss = [], hurt = [];
  const seen = new Set();
  state.plan.forEach(d=>{
    const lists = (d.stages && d.stages.length) ? d.stages : [d.exercises || []];
    lists.forEach(list=>(list || []).forEach(ex=>{
      const m = byName[ex.name];
      if(!m || seen.has(ex.name)) return;
      seen.add(ex.name);
      const need = kitFor(m).filter(k=>!hasKit(k));
      if(need.length) kitMiss.push({ n:ex.name, need:need.map(k=>(KIT[k] || {}).label || k) });
      const inj = (m.x || []).filter(k=>(setup.injuries || []).indexOf(k) > -1);
      if(inj.length) hurt.push({ n:ex.name, inj:inj.map(k=>(INJURIES[k] || {}).label || k) });
    }));
  });
  const days = state.plan.length !== (setup.liftDays || 3);
  const weeks = weekCount() !== (setup.weeks || 4);
  if(!kitMiss.length && !hurt.length && !days && !weeks) return null;
  return { kitMiss, hurt, days, weeks,
    /* Equipment you no longer have and a movement flagged for an injury are the two that can
       actually hurt someone or waste a session. Day and week counts are only bookkeeping. */
    serious: kitMiss.length > 0 || hurt.length > 0 };

  /* and the week sits under it */

  /* Advancing the program lives here, next to the session it changes — and only once the current
     week has actually been trained. */
  const ws = weekStats(state.week);
  if(state.week < weekCount() && ws.planned && ws.done >= ws.planned){
    h += '<div class="panel"><div class="kicker">Week ' + state.week + ' complete</div>' +
      '<p class="sub" style="margin-top:6px">All ' + ws.planned + ' sessions done. Week ' + (state.week + 1) +
      ' raises the load and changes the prescription.</p>' +
      '<div class="brow" style="margin-top:11px"><button class="b pri" onclick="setWeek(' + (state.week + 1) + ')">Start week ' + (state.week + 1) + '</button></div></div>';

}
/* The training week as a calendar: seven dates, what is on each, and where today is. */
function calendarCard(){
  const off = ui.calOff || 0;
  const base = new Date(todayISO() + 'T12:00:00');
  base.setDate(base.getDate() - dowOf(todayISO()) + off * 7);
  const days = Array.from({ length:7 }, (_, i)=>{
    const dt = new Date(base); dt.setDate(dt.getDate() + i);
    return localISO(dt);
  });
  const rows = weekRows(state.week);
  const done = consistency();
  const ws = weekStats(state.week);
  const pct = ws.planned ? Math.round(ws.done / ws.planned * 100) : 0;
  const S = (()=>{ try{ return scoreState().stats.streak; }catch(e){ return 0; } })();
  const span = fmtDate(days[0]) + ' – ' + fmtDate(days[6]);
  const todayIso = todayISO();

  let h = '<div class="panel calpanel"><div class="rowsplit">' +
    '<div class="kicker">' + (off === 0 ? 'This week' : off < 0 ? 'Earlier' : 'Ahead') + '</div>' +
    '<div class="calnavwrap"><button class="calnav" onclick="calShift(-1)">‹</button>' +
      '<span class="tiny dim">' + esc(span) + '</span>' +
      '<button class="calnav" onclick="calShift(1)">›</button></div></div>';

  h += '<div class="calgrid">' + days.map((iso, i)=>{
    const r = rows[i] || {};
    const isToday = iso === todayIso;
    const past = iso < todayIso;
    const didLift = !!done.lift[iso], didRun = !!done.run[iso];
    const label = r.lift ? r.lift : (r.run ? (r.run.label || 'Run') : '');
    const mark = didLift || didRun ? '✓' : past && label ? '×' : label ? '·' : '';
    return '<div class="calcell' + (isToday ? ' now' : '') + (label ? '' : ' empty') +
      (didLift || didRun ? ' hit' : '') + (r.lift ? ' movable' : '') + '" data-dow="' + i + '"' +
      (r.lift ? ' data-lift="' + esc(r.lift) + '"' : '') + ' onclick="pickCalDay(' + i + ')">' +
      '<div class="caldow">' + esc(DOW[i].slice(0, 1)) + '</div>' +
      '<div class="calnum num">' + (+iso.slice(8)) + '</div>' +
      '<div class="calmark">' + mark + '</div>' +
      '<div class="callabel">' + esc(shortName(label)) + '</div></div>';
  }).join('') + '</div>';

  h += '<div class="tiny dim" style="margin-top:9px">Drag a session onto another day to move it. Landing on a day that is taken swaps the two.</div>';
  h += '<div class="rowsplit" style="margin-top:11px;align-items:flex-end">' +
    '<div class="tiny dim">' + pct + '% of planned sessions done · ' + S + ' week streak</div>' +
    '<button class="mini" onclick="go(\'plan\')">See the plan</button></div>' +
    '<div class="tiny dim" style="margin-top:6px">Tap a day to open what is on it.</div></div>';
  return h;
}
const shortName = s => {

/* ══════════ MANAGE SCHEDULE ══════════
   A generated week is a starting point, not a contract. Life moves sessions around — a day gets
   missed, a gym is shut, a Saturday fills up — and until now the only way to change which
   session fell on which day was to rebuild the whole program, which files the current one away
   and throws out the arrangement you were happy with.

   Two different things can be changed here, and they are kept apart on purpose because they
   drive different parts of the app:
     · WHICH DAY a session lands on — the weekly calendar, the Plan grid, the Today card.
     · WHAT ORDER sessions run in — what Trainlog offers you next when you finish one, which is
       sequence-based and deliberately survives a missed day rather than skipping it.
   Editing either leaves everything logged untouched. */
const DOW_FULL = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];

/* A writable copy of the live schedule. schedNow() may hand back a generated object that was
   never stored, so anything that edits it has to persist a real one. */
function schedEditable(){
  const s = schedNow();
  return {
    liftDows:(s.liftDows || []).slice(),
    lifts:Object.assign({}, s.lifts || {}),
    runs:Object.assign({}, s.runs || {}),
    goal:s.goal, nLift:s.nLift, startDow:s.startDow || 0, custom:true
  };
}
function dowOfWorkout(name){
  const s = schedNow();
  const k = Object.keys(s.lifts || {}).find(d=> s.lifts[d] && s.lifts[d].name === name);
  return k === undefined ? -1 : +k;
}
/* Move a session onto a weekday. If something is already there the two trade places, so the
   number of training days never quietly changes underneath the program. */
function moveWorkoutToDow(name, dow, reopen){
  const from = dowOfWorkout(name);
  if(from === dow) return;
  const sched = schedEditable();
  const moving = sched.lifts[from];
  if(!moving) return;
  const sitting = sched.lifts[dow] || null;
  if(sitting) sched.lifts[from] = sitting; else delete sched.lifts[from];
  sched.lifts[dow] = moving;
  sched.liftDows = Object.keys(sched.lifts).map(Number).sort((a, b)=>a - b);
  state.sched = sched;
  saveNow(); render();
  if(reopen) openManageSchedule();
  toast(sitting ? name + ' and ' + sitting.name + ' swapped days' : name + ' moved to ' + DOW_FULL[dow]);
}
/* Reorder the sequence Trainlog works through. state.plan order is what suggestDayId walks, so
   this is the lever for "I missed Monday — do that one next" without touching the calendar. */
function moveDayOrder(id, delta){
  const i = state.plan.findIndex(d=>d.id === id);
  const j = i + delta;
  if(i < 0 || j < 0 || j >= state.plan.length) return;
  const row = state.plan.splice(i, 1)[0];
  state.plan.splice(j, 0, row);
  state.plan.forEach((d, k)=>{ d.dayIdx = k; });
  saveNow(); render(); openManageSchedule();
  toast(row.name + ' moved to position ' + (j + 1));
}
async function resetSchedule(){
  if(!await askConfirm('Put the week back to the schedule Trainlog suggested? Your sessions and everything logged stay exactly as they are.')) return;
  const names = state.plan.map(d=>d.name);
  state.sched = buildSchedule(names, state.runVisible ? (setup.runDays || 0) : 0,
    state.runGoal || setup.runGoal, startDow(), trainDows());
  await save(); render(); openManageSchedule();
  toast('Week reset to the suggested schedule');
}

  h += '<div class="kicker">Your week now</div><div class="msweek">' +

      '</div>').join('') + '</div>';

    '<p class="tiny dim" style="margin:5px 0 12px;line-height:1.5">Tap a day to move that session there. If the day is already taken, the two swap.</p>';
  h += state.plan.map(d=>{

        '<button class="msdowb' + (i === cur ? ' on' : '') + '" onclick="moveWorkoutToDow(\'' + jsq(d.name) + '\',' + i + ',1)"' +
        ' aria-label="Move ' + esc(d.name) + ' to ' + DOW_FULL[i] + '"' + (i === cur ? ' aria-current="true"' : '') + '>' +
        esc(lab[0]) + '</button>').join('') + '</div></div>';
  }).join('');

  h += '<div class="rule" style="margin:16px 0 14px"></div>';
  h += '<div class="kicker">What comes next</div>' +
    '<p class="tiny dim" style="margin:5px 0 12px;line-height:1.5">When you finish a session, Trainlog offers the next one in this order — so a missed day is picked up rather than skipped.</p>';
  h += state.plan.map((d, i)=>
    '<div class="msrow ord"><span class="msno num">' + (i + 1) + '</span>' +
    '<div class="msrowname" style="flex:1">' + esc(d.name) + '</div>' +
    '<button class="msarrow" onclick="moveDayOrder(' + d.id + ',-1)"' + (i === 0 ? ' disabled' : '') +
      ' aria-label="Move ' + esc(d.name) + ' earlier">\u2191</button>' +
    '<button class="msarrow" onclick="moveDayOrder(' + d.id + ',1)"' + (i === state.plan.length - 1 ? ' disabled' : '') +
      ' aria-label="Move ' + esc(d.name) + ' later">\u2193</button></div>').join('');

  h += '<div class="brow" style="margin-top:18px">' +

    '<button class="b quiet" onclick="resetSchedule()">Reset to suggested</button></div>';

  sheet(h);
